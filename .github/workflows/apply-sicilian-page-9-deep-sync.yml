name: Apply Sicilian Page 9 deep PDF sync

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page-9-deep-sync.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Deep-sync printed PDF Page 9
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          text = chapter.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '10...a5!? 11.e5 Nd7 12.Bxe7 Qxe7 In my opinion Black has an excellent position.',
              '10...a5!? 11.e5 Nd7 12.Bxe7 Nxe7∓ In my opinion Black has an excellent position.',
              'Nxe7 evaluation',
          )
          replace_once(
              '5.d3 Ng6 6.h4!? (6.0-0 Be7 7.c3 d5 8.Bb3 0-0+ is great for Black) 6...Bd6! 7.Nbd2 h6 8.h5 Nge5 9.Nxe5 Bxe5 10.Nf3 Bb8!? 11.c3 0-0 12.Bb3 d5∓ is fine for us.',
              '5.d3 Ng6 6.h4!? (6.0-0 Be7 7.c3 d5 8.Bb3 0-0∓ is great for Black) 6...Bd6! 7.Nbd2 h6 8.h5 Nge5 9.Nxe5 Bxe5 10.Nf3 Bb8!? 11.c3 0-0 12.Bb3 d5⇆ is fine for us.',
              'Page 9 evaluation and counterplay glyphs',
          )
          replace_once('Rasik - Jirovsky', 'Rasik – Jirovsky', 'Rasik-Jirovsky dash')
          replace_once('B) 2.c4\n1.e4 c5 2.c4\n\n', 'B) 2.c4\n\n', 'remove duplicate opening line')
          replace_once(
              '13.Be3 Rab8+ was excellent for Black in Plueg - Shaw, Coulsdon 1997.',
              '13.Be3 Rab8∓ was excellent for Black in Plueg – Shaw, Coulsdon 1997.',
              'Rab8 evaluation and source dash',
          )
          replace_once(
              '13.Kh1?! (13.Nd5!?, preparing to counterattack by b2-b4, might have made a fight of it.)\n\n## Page 10\n\n13...h5! 14.Bxh5 Be6 15.Ne2 Kb8 16.Nxd4 cxd4+ Black\'s attack eventually proved too much for White in Karacsony - S. Petkov, corr. 2012.',
              '13.Kh1?! (13.Nd5!?, preparing to counterattack by b2-b4, might have made a fight of it.)\n\n13...h5! 14.Bxh5 Be6 15.Ne2 Kb8 16.Nxd4 cxd4∓ Black\'s attack eventually proved too\n\n## Page 10\n\nmuch for White in Karacsony – S. Petkov, corr. 2012.',
              'Page 9-to-10 boundary and cxd4 evaluation',
          )

          chapter.write_text(text, encoding='utf-8')

          tests = Path('apps/opening-book-sicilian/tests/chapter-workflow.test.mjs')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'test("evaluation and positional glyphs remain attached to move buttons", () => {'
          regression = '''test("printed PDF Page 9 keeps its exact move content and boundary", async () => {\n  const markdown = await readChapterOne();\n  const pageStart = markdown.indexOf("## Page 9");\n  const pageEnd = markdown.indexOf("## Page 10", pageStart);\n  const page = markdown.slice(pageStart, pageEnd);\n  const pageTen = markdown.slice(pageEnd, markdown.indexOf("## Page 11", pageEnd));\n\n  assert.match(page, /12\\.Bxe7 Nxe7∓/);\n  assert.match(page, /8\\.Bb3 0-0∓/);\n  assert.match(page, /12\\.Bb3 d5⇆/);\n  assert.match(page, /12\\.\\.\\.Qc7N∓/);\n  assert.match(page, /13\\.Be3 Rab8∓/);\n  assert.match(page, /16\\.Nxd4 cxd4∓/);\n  assert.match(page, /Black's attack eventually proved too\\s*$/);\n  assert.doesNotMatch(page, /12\\.Bxe7 Qxe7/);\n  assert.doesNotMatch(page, /8\\.Bb3 0-0\\+/);\n  assert.doesNotMatch(page, /12\\.Bb3 d5∓/);\n  assert.doesNotMatch(page, /13\\.Be3 Rab8\\+/);\n  assert.doesNotMatch(page, /16\\.Nxd4 cxd4\\+/);\n  assert.doesNotMatch(page, /1\\.e4 c5 2\\.c4/);\n  assert.doesNotMatch(page, /much for White/);\n  assert.doesNotMatch(page, /3\\.\\.\\.Nf6!/);\n  assert.match(pageTen, /^## Page 10\\s+much for White in Karacsony – S\\. Petkov, corr\\. 2012\\./);\n});\n\n'''
          if regression.strip() not in test_text:
              if marker not in test_text:
                  raise SystemExit('Could not find Page 9 regression insertion point')
              test_text = test_text.replace(marker, regression + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

          git diff --check

      - name: Install and test Sicilian app
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page-9-deep-sync.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md \
                  apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          git diff --cached --check
          git commit -m "Deep-sync Sicilian Page 9 with PDF"
          git push origin HEAD:wip/sicilian-20260805-153931
