name: Apply deep Sicilian Page 12 PDF sync

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page12-deep-sync.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Sync printed PDF Page 12
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          text = chapter.read_text(encoding='utf-8')

          replacements = [
              (
                  "11.0-0 Be7∓ leads to a situation where Black's control over the d4-square",
                  "11.0-0 Be7⇆ leads to a situation where Black's control over the d4-square",
                  'Page 12 counterplay glyph',
              ),
              (
                  'In Hou Yifan - Ju Wenjun, Lopota 2014,',
                  'In Hou Yifan – Ju Wenjun, Lopota 2014,',
                  'Hou Yifan source punctuation',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          chapter.write_text(text, encoding='utf-8')

          tests = Path('apps/opening-book-sicilian/tests/chapter-workflow.test.mjs')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'test("evaluation and positional glyphs remain attached to move buttons", () => {'
          regression = r'''test("printed PDF Page 12 keeps its exact move content and boundary", async () => {
  const markdown = await readChapterOne();
  const start = markdown.indexOf("## Page 12");
  const end = markdown.indexOf("## Page 13", start);
  const page = markdown.slice(start, end);
  const pageThirteen = markdown.slice(end, markdown.indexOf("## Page 14", end));

  assert.match(page, /5\.\.\.e6∓/);
  assert.match(page, /5\.\.\.h5∓/);
  assert.match(page, /Nxf4!∓/);
  assert.match(page, /11\.0-0 Be7⇆/);
  assert.match(page, /13\.Qxa6 \(13\.Qg2 g6 14\.0-0 Bg7 15\.Bxa6 0-0 16\.Bd3 Qc8∞\) 13\.\.\.Nf3\+/);
  assert.match(page, /15\.Ke1 \(15\.Bf4 Nxd3 16\.Qxd3 Qxd3\+ 17\.cxd3 Rxb2 18\.Be3 g6 19\.Bd4 f6=/);
  assert.match(page, /Hou Yifan – Ju Wenjun/);
  assert.match(page, /12\.Rd1 Qc8/);
  assert.match(page, /15\.Rxd8\+ Qxd8/);
  assert.match(page, /22\.Rd2±\s*$/);
  assert.doesNotMatch(page, /11\.0-0 Be7∓/);
  assert.doesNotMatch(page, /Hou Yifan - Ju Wenjun/);
  assert.doesNotMatch(page, /12\.Rd1 Qe8/);
  assert.doesNotMatch(page, /22\.Rd2=/);
  assert.doesNotMatch(page, /16\.Rd5/);
  assert.match(pageThirteen, /^## Page 13\s+<!--[\s\S]*?-->\s*16\.Rd5/);
});

'''
          if 'printed PDF Page 12 keeps its exact move content and boundary' not in test_text:
              if marker not in test_text:
                  raise SystemExit('Could not find Page 12 regression insertion point')
              test_text = test_text.replace(marker, regression + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

          git diff --check

      - name: Install and test Sicilian app
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page12-deep-sync.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md \
                  apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          git diff --cached --check
          git commit -m "Deep-sync Sicilian Page 12 with PDF"
          git push origin HEAD:wip/sicilian-20260805-153931
