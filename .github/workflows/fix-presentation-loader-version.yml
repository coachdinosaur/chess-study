name: Normalize presentation loader version

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'agent/add-presentation-click-indicator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-presentation-click-indicator
          fetch-depth: 0

      - name: Update every production presentation loader reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "20260725-presentation-click-pulse-v5"
          pattern = re.compile(r"lesson-presentation\.js(?:\?v=[^\"'`\s)]*)?")
          changed = []
          references = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.js', '.mjs'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'lesson-presentation.js' not in text:
                  continue
              updated = pattern.sub(f"lesson-presentation.js?v={version}", text)
              references.append(path)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path)
          if not references:
              raise SystemExit('No presentation loader references found')
          stale = []
          for path in references:
              text = path.read_text(encoding='utf-8')
              if f"lesson-presentation.js?v={version}" not in text:
                  stale.append(path)
          if stale:
              raise SystemExit('Stale references: ' + ', '.join(map(str, stale)))
          print('Presentation references:')
          for path in references:
              print(' -', path)
          print('Changed:', len(changed))
          PY

      - name: Validate updated JavaScript
        run: |
          node --check lessons/lesson-presentation.js
          for file in $(grep -RIl --exclude-dir=.git --exclude-dir=.github 'lesson-presentation.js' . | grep -E '\.(js|mjs)$'); do
            node --check "$file"
          done
          git diff --check

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-presentation-loader-version.yml

      - name: Commit cache-version normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons .github
          git commit -m "Normalize presentation click pulse asset version"
          git push origin HEAD:agent/add-presentation-click-indicator
