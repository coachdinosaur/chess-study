name: Run documentation and teacher board patch

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/update-app-documentation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-app-documentation
          fetch-depth: 0
          show-progress: false

      - name: Apply updates
        run: |
          set -o pipefail
          python .github/scripts/apply_teacher_board_status.py 2>&1 | tee /tmp/teacher-patch.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-patch-log
          path: /tmp/teacher-patch.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Validate changed files
        run: |
          node --check ai-help-chat.mjs
          node --check lessons/pawn-teacher-board.js
          git diff --check
          grep -q "teacher-board-game-status" lessons/pawn-teacher-board.js
          grep -q "Checkmate" lessons/pawn-teacher-board.js
          grep -q "Stalemate" lessons/pawn-teacher-board.js
          grep -q "lower-left" README.md
          grep -q "teacher-board wrapper" ARCHITECTURE.md

      - name: Commit validated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_teacher_board_status.py
          git rm .github/workflows/apply-teacher-board-status.yml
          git add README.md ARCHITECTURE.md ai-help-chat.css ai-help-chat.mjs lessons/pawn-teacher-board.js lessons/pawn-teacher-board.css
          git diff --cached --check
          git commit -m "Update app documentation and teacher board feedback"
          git push origin HEAD:agent/update-app-documentation
