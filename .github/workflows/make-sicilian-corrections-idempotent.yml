name: Make Sicilian Corrections Idempotent

on:
  push:
    branches:
      - fix/materialize-sicilian-pdf-corrections
    paths:
      - ".github/workflows/make-sicilian-corrections-idempotent.yml"
      - "apps/opening-book-sicilian/scripts/add-correction-idempotence.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/materialize-sicilian-pdf-corrections

      - name: Add already-corrected guards
        run: python apps/opening-book-sicilian/scripts/add-correction-idempotence.py

      - name: Commit compatibility guards
        run: |
          git diff --check
          git add apps/opening-book-sicilian/app/lib/chapter-*-corrections.ts
          if git diff --cached --quiet; then
            echo "Correction functions already support corrected Markdown."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep Sicilian app corrections compatible with corrected Markdown"
          git push origin HEAD:fix/materialize-sicilian-pdf-corrections
