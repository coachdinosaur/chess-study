name: Apply Sicilian labeled-alternative navigation fix

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-labeled-alternative-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Patch labeled sibling alternatives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/opening-book-sicilian/app/lib/markdown-moves.ts')
          text = path.read_text(encoding='utf-8')
          old = '      const numberedKey = moveNumberKey(display);\n      if (depth > 0 && numberedKey && betweenMoves.includes(";")) {\n'
          new = '      const numberedKey = moveNumberKey(display);\n      const labeledSibling = depth === 0\n        && numberedKey\n        && previousMatch\n        && moveNumberKey(previousMatch[0].trim()) === numberedKey\n        && /\\b[A-Z]\\d+\\)\\s*$/.test(betweenMoves);\n      if (labeledSibling) {\n        // Labels such as `D1) 3.Bb5 and D2) 3.Nf3` are sibling choices.\n        active = lastBefore;\n        previousMoveResolved = true;\n      }\n      if (depth > 0 && numberedKey && betweenMoves.includes(";")) {\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one resolver insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check

      - name: Install dependencies
        working-directory: apps/opening-book-sicilian
        run: npm ci

      - name: Verify D1 and D2 share the position after 2...Nc6
        working-directory: apps/opening-book-sicilian
        shell: bash
        run: |
          node --import tsx <<'NODE'
          import assert from 'node:assert/strict';
          import { MarkdownMoveResolver } from './app/lib/markdown-moves.ts';

          const resolver = new MarkdownMoveResolver();
          const anchor = 'r1bqkbnr/pp1ppppp/2n5/2p5/4P3/N7/PPPP1PPP/R1BQKBNR w KQkq - 2 3';
          resolver.setAnchor(anchor, 'After 2...Nc6');
          const tokens = resolver.resolveText('We will consider two moves for White: D1) 3.Bb5 and D2) 3.Nf3.');
          const bb5 = tokens.find((token) => token.display === '3.Bb5');
          const nf3 = tokens.find((token) => token.display === '3.Nf3');

          assert.ok(bb5?.navigation, 'D1) 3.Bb5 should be navigable.');
          assert.ok(nf3?.navigation, 'D2) 3.Nf3 should be navigable.');
          assert.deepEqual(bb5.navigation.steps.map((step) => step.label), ['After 2...Nc6', '3.Bb5']);
          assert.deepEqual(nf3.navigation.steps.map((step) => step.label), ['After 2...Nc6', '3.Nf3']);
          assert.equal(bb5.navigation.steps[0].fen, anchor);
          assert.equal(nf3.navigation.steps[0].fen, anchor);
          NODE

      - name: Run Sicilian tests
        working-directory: apps/opening-book-sicilian
        run: npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-labeled-alternative-fix.yml
          git add apps/opening-book-sicilian/app/lib/markdown-moves.ts
          git diff --cached --check
          git commit -m "Fix labeled Sicilian alternative navigation"
          git push origin HEAD:wip/sicilian-20260805-153931
