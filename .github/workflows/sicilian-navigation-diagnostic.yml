name: Export Sicilian repair workspace

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/sicilian-navigation-diagnostic.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Install
        working-directory: apps/opening-book-sicilian
        run: npm ci

      - uses: actions/upload-artifact@v4
        with:
          name: sicilian-repair-workspace
          path: |
            apps/opening-book-sicilian
            apps/01_Rare_Options.pdf
          if-no-files-found: error
