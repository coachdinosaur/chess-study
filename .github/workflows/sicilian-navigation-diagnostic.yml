name: Apply Sicilian navigation repair

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/sicilian-navigation-diagnostic.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Install Sicilian dependencies
        working-directory: apps/opening-book-sicilian
        run: npm ci

      - name: Apply guarded source repair
        working-directory: apps/opening-book-sicilian
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          resolver = Path('app/lib/markdown-moves.ts')
          text = resolver.read_text(encoding='utf-8')

          start = text.index('  setAnchor(')
          end = text.index('\n  private indexRoot', start)
          method = text[start:end]
          old_reset = '    this.resetHistory(root);'
          new_reset = '''    this.remember(root);
              if (root.fen !== START_FEN) {
                this.remember({ fen: START_FEN, steps: [{ fen: START_FEN, label: "Initial position" }] });
              }'''
          if old_reset not in method:
              raise SystemExit('setAnchor reset call not found')
          method = method.replace(old_reset, new_reset, 1)
          text = text[:start] + method + text[end:]

          method_marker = '  private resolveMoveText(text: string): MarkdownMoveToken[] {\n'
          helper = '''  private continuationScore(
              moveText: string,
              sourceText: string,
              matches: RegExpMatchArray[],
              startIndex: number,
              fen: string,
              depth: number,
              baseDepth: number,
            ): number {
              let currentFen = fen;
              let score = 0;
              for (let index = startIndex + 1; index < matches.length; index++) {
                const match = matches[index];
                const at = match.index ?? 0;
                const tokenDepth = Math.max(0, baseDepth + parenDepthDeltaAt(moveText, at));
                if (tokenDepth < depth) break;
                if (tokenDepth > depth) continue;

                const display = match[0].trim();
                if (!display || isLikelyProseSquare(sourceText, at, display) || isCoordinateMoveReference(sourceText, at)) continue;
                if (!moveNumberMatchesFen(display, currentFen)) break;
                const move = this.resolveFrom(currentFen, display);
                if (!move) break;
                currentFen = move.fen;
                score++;
              }
              return score;
            }

          '''
          if method_marker not in text:
              raise SystemExit('resolveMoveText marker not found')
          text = text.replace(method_marker, helper + method_marker, 1)

          old_loop = '''    for (const match of moveText.matchAll(SOURCE_MOVE_TOKEN)) {
              const at = match.index ?? 0;
          '''
          new_loop = '''    const matches = [...moveText.matchAll(SOURCE_MOVE_TOKEN)];
              for (let matchIndex = 0; matchIndex < matches.length; matchIndex++) {
                const match = matches[matchIndex];
                const at = match.index ?? 0;
          '''
          if old_loop not in text:
              raise SystemExit('move loop not found')
          text = text.replace(old_loop, new_loop, 1)

          old_selection = '''      const activeMatch = legalCandidates.find((candidate) => candidate.before.fen === active.fen);
              if (activeMatch) {
                ({ before, resolved } = activeMatch);
              } else {
                const distinct = legalCandidates.filter((candidate, index, all) => all.findIndex((other) => other.before.fen === candidate.before.fen) === index);
                if (distinct.length === 1) ({ before, resolved } = distinct[0]);
              }
          '''
          new_selection = '''      const distinct = legalCandidates.filter((candidate, index, all) => all.findIndex((other) => other.before.fen === candidate.before.fen) === index);
              const activeMatch = distinct.find((candidate) => candidate.before.fen === active.fen);
              if (distinct.length === 1) {
                ({ before, resolved } = distinct[0]);
              } else if (distinct.length > 1) {
                const scored = distinct.map((candidate) => ({
                  candidate,
                  score: this.continuationScore(moveText, text, matches, matchIndex, candidate.resolved.fen, nextDepth, baseDepth),
                }));
                const bestScore = Math.max(...scored.map((entry) => entry.score));
                const best = scored.filter((entry) => entry.score === bestScore);
                if (bestScore > 0 && best.length === 1) {
                  ({ before, resolved } = best[0].candidate);
                } else if (activeMatch) {
                  ({ before, resolved } = activeMatch);
                }
              }
          '''
          if old_selection not in text:
              raise SystemExit('candidate selection block not found')
          text = text.replace(old_selection, new_selection, 1)
          resolver.write_text(text, encoding='utf-8')

          chapter = Path('app/content/chapters/chapter-1-sicilian.md')
          text = chapter.read_text(encoding='utf-8')
          old_fen = 'r1bqkb1r/pp1pnppp/2n1p3/2p5/2B1P3/2P5/PP1PQPPP/RNB1K1NR w KQkq - 1 5'
          new_fen = 'r1bqkb1r/pp1pnppp/2n1p3/2p5/2B1P3/5N2/PPPPQPPP/RNB1K2R w KQkq - 4 5'
          if old_fen not in text:
              raise SystemExit('Page 9 variation FEN not found')
          text = text.replace(old_fen, new_fen, 1)
          text = text.replace('9.Bg5 f6 10.Nh3', '9.Ng5 f6 10.Nh3')
          text = text.replace('16.Bxd4 cxd4+', '16.Nxd4 cxd4+')
          chapter.write_text(text, encoding='utf-8')
          PY

      - name: Test repaired application
        working-directory: apps/opening-book-sicilian
        run: |
          npm test
          npm run build

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git add apps/opening-book-sicilian/app/lib/markdown-moves.ts \
                  apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md
          git diff --cached --check
          git commit -m "Repair Sicilian move recovery from page 3"
          git push origin HEAD:wip/sicilian-20260805-153931
