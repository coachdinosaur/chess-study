name: Sicilian navigation diagnostic

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/sicilian-navigation-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Install Sicilian dependencies
        working-directory: apps/opening-book-sicilian
        run: npm ci

      - name: Upload local chess tooling
        uses: actions/upload-artifact@v4
        with:
          name: sicilian-chess-tooling
          path: |
            apps/opening-book-sicilian/node_modules/chess.js/dist/esm/chess.js
            apps/opening-book-sicilian/node_modules/chess.js/package.json
            apps/opening-book-sicilian/app/lib/chess-notation.ts
            apps/opening-book-sicilian/app/lib/markdown-chapter.ts
            apps/opening-book-sicilian/app/lib/markdown-moves.ts
            apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md
          if-no-files-found: error
