name: Apply deep Sicilian Page 8 PDF sync

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page-8-deep-sync.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Match Page 8 game references to the PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter_path = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          chapter = chapter_path.read_text(encoding='utf-8')
          start = chapter.index('## Page 8')
          end = chapter.index('## Page 9', start)
          page = chapter[start:end]

          replacements = {
              'Quaddy - Neapus': 'Quaddy – Neapus',
              'Osipov - Rimkus': 'Osipov – Rimkus',
              'Bersamina - Kantans': 'Bersamina – Kantans',
              'Rasik - Smirin': 'Rasik – Smirin',
          }
          for old, new in replacements.items():
              if page.count(old) != 1:
                  raise SystemExit(f'Expected one Page 8 occurrence of {old!r}, found {page.count(old)}')
              page = page.replace(old, new, 1)

          chapter = chapter[:start] + page + chapter[end:]
          chapter_path.write_text(chapter, encoding='utf-8')

          tests_path = Path('apps/opening-book-sicilian/tests/chapter-workflow.test.mjs')
          tests = tests_path.read_text(encoding='utf-8')
          old = 'assert.match(markdown, /Bersamina - Kantans, Pune 2014, and now: 13\\.Re1!N=/);'
          new = 'assert.match(markdown, /Bersamina – Kantans, Pune 2014, and now: 13\\.Re1!N=/);'
          if tests.count(old) != 1:
              raise SystemExit(f'Expected one old Bersamina assertion, found {tests.count(old)}')
          tests = tests.replace(old, new, 1)

          anchor = '  assert.match(page, /20\\.Na3 Bc3⇆/);\n'
          added = (
              '  assert.match(page, /Quaddy – Neapus/);\n'
              '  assert.match(page, /Osipov – Rimkus/);\n'
              '  assert.match(page, /Bersamina – Kantans/);\n'
              '  assert.match(page, /Rasik – Smirin/);\n'
          )
          if added not in tests:
              if tests.count(anchor) != 1:
                  raise SystemExit(f'Expected one Page 8 assertion anchor, found {tests.count(anchor)}')
              tests = tests.replace(anchor, anchor + added, 1)

          tests_path.write_text(tests, encoding='utf-8')
          PY

          git diff --check

      - name: Install and test Sicilian app
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page-8-deep-sync.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md \
                  apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          git diff --cached --check
          git commit -m "Deep-sync Sicilian Page 8 with PDF"
          git push origin HEAD:wip/sicilian-20260805-153931
