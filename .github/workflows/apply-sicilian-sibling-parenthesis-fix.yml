name: Apply Sicilian sibling parenthesis navigation fix

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-sibling-parenthesis-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Apply resolver and regression-test patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/apply_sibling_fix.py
          python /tmp/apply_sibling_fix.py
          git diff --check

      - name: Install and test Sicilian app
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-sibling-parenthesis-fix.yml
          git add apps/opening-book-sicilian/app/lib/markdown-moves.ts \
                  apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          git diff --cached --check
          git commit -m "Fix sibling parenthetical move navigation"
          git push origin HEAD:wip/sicilian-20260805-153931
