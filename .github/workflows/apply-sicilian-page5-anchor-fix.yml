name: Apply Sicilian page 5 navigation fixes

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page5-anchor-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Apply page 5 source corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'White is trying to postpone d2-d4 and create an awkward dilemma for Najdorf players: 2...Nc6 runs into 3.d4, while 2...d6 3.Nbc3 Nf6 4.g3 could be luring them into a g3 Dragon or a Closed Sicilian with ...e6 (which is beyond the subject of this book). Therefore, I have decided to offer a more clear-cut solution, in an attempt to satisfy all tastes:',
                  'White is trying to postpone d2-d4 and create an awkward dilemma for Najdorf players: (2...Nc6 runs into 3.d4), while (2...d6 3.Nbc3 Nf6 4.g3 could be luring them into a g3 Dragon or a Closed Sicilian with 4...e6), which is beyond the subject of this book. Therefore, I have decided to offer a more clear-cut solution, in an attempt to satisfy all tastes:',
              ),
              (
                  'Weaker is 11.Nxf6+ Qxf6 12.Ng3 Qe5! 13.Bd3 b6! 14.c6',
                  'Weaker is 11.Nxf6+ Qxf6 12.Ng3 Ne5! 13.Bd3 b6! 14.c6',
              ),
              (
                  '14...Bxc6 15.0-0 a5 16.Rc1 Bd6+ when Black still maintains a nagging initiative. <!-- NON-NAVIGATION -->',
                  '14...Qxc6 15.0-0 a5 16.Rc1 Qd6+ when Black still maintains a nagging initiative.',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one passage, found {count}: {old[:70]}')
              text = text.replace(old, new, 1)

          stale_comments = [
              '<!-- FEN: r1b2rk1/p4ppp/1pn5/2P1q3/3pP3/3B2N1/PP3PPP/R2QK2R w KQ - 0 14 -->',
              '<!-- FEN: r1b2rk1/p4ppp/2n5/4q3/2p1P3/3p2N1/PP3PPP/R2QRBK1 w - - 0 17 -->',
          ]
          for comment in stale_comments:
              count = text.count(comment)
              if count != 1:
                  raise SystemExit(f'Expected one stale FEN comment, found {count}: {comment}')
              text = text.replace(comment, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Install Sicilian dependencies
        working-directory: apps/opening-book-sicilian
        run: npm ci

      - name: Verify the requested navigation lines
        working-directory: apps/opening-book-sicilian
        shell: bash
        run: |
          node --import tsx <<'NODE'
          import assert from 'node:assert/strict';
          import { MarkdownMoveResolver } from './app/lib/markdown-moves.ts';

          const alternatives = new MarkdownMoveResolver();
          alternatives.setAnchor(
            'rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPPNPPP/RNBQKB1R b KQkq - 1 2',
            'After 2.Ne2',
          );
          const dilemma = alternatives.resolveText(
            'White is trying to postpone d2-d4: (2...Nc6 runs into 3.d4), while (2...d6 3.Nbc3 Nf6 4.g3 could lead to a Closed Sicilian with 4...e6).',
          );
          assert.ok(
            dilemma.every((token) => token.navigation),
            'Both second-move alternatives must be independently navigable.',
          );

          const c4Line = new MarkdownMoveResolver();
          c4Line.setAnchor(
            'r1bq1rk1/pp3ppp/2n2b2/2PN4/3pP3/8/PP2NPPP/R2QKB1R w KQ - 2 11',
            'After 10...0-0',
          );
          const tokens = [
            ...c4Line.resolveText('Weaker is 11.Nxf6+ Qxf6 12.Ng3 Ne5! 13.Bd3 b6! 14.c6'),
            ...c4Line.resolveText('(14.0-0? bxc5 15.Re1 c4 16.Bf1 d3'),
            ...c4Line.resolveText('17.Nd2 Rb8-+)'),
            ...c4Line.resolveText('14...Qxc6 15.0-0 a5 16.Rc1 Qd6+'),
          ];
          assert.ok(
            tokens.every((token) => token.navigation),
            'The parenthetical sideline must return to the position after 14.c6.',
          );
          NODE

      - name: Run Sicilian tests
        working-directory: apps/opening-book-sicilian
        run: npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page5-anchor-fix.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md
          git diff --cached --check
          git commit -m "Fix Sicilian page 5 navigation anchors"
          git push origin HEAD:wip/sicilian-20260805-153931
