name: Apply Sicilian page 5 navigation fixes

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page5-anchor-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Apply page 5 source corrections
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          text = path.read_text(encoding='utf-8')

          old_dilemma = 'White is trying to postpone d2-d4 and create an awkward dilemma for Najdorf players: 2...Nc6 runs into 3.d4, while 2...d6 3.Nbc3 Nf6 4.g3 could be luring them into a g3 Dragon or a Closed Sicilian with ...e6 (which is beyond the subject of this book). Therefore, I have decided to offer a more clear-cut solution, in an attempt to satisfy all tastes:'
          new_dilemma = 'White is trying to postpone d2-d4 and create an awkward dilemma for Najdorf players: (2...Nc6 runs into 3.d4), while (2...d6 3.Nbc3 Nf6 4.g3 could be luring them into a g3 Dragon or a Closed Sicilian with 4...e6), which is beyond the subject of this book. Therefore, I have decided to offer a more clear-cut solution, in an attempt to satisfy all tastes:'
          if text.count(old_dilemma) != 1:
              raise SystemExit(f'Expected one Najdorf-dilemma passage, found {text.count(old_dilemma)}')
          text = text.replace(old_dilemma, new_dilemma, 1)

          branch_pattern = re.compile(
              r'Weaker is 11\.Nxf6\+ Qxf6 12\.Ng3 Qe5! 13\.Bd3 b6! 14\.c6'
              r'[\s\S]*?'
              r'14\.\.\.Bxc6 15\.0-0 a5 16\.Rc1 Bd6\+ when Black still maintains a nagging initiative\.\s*<!-- NON-NAVIGATION -->'
          )
          corrected_branch = (
              'Weaker is 11.Nxf6+ Qxf6 12.Ng3 Ne5! 13.Bd3 b6! 14.c6 '
              '(14.0-0? bxc5 15.Re1 c4 16.Bf1 d3 17.Nd2 Rb8-+ was simply lost for White '
              'in Eisenbeiser - Fluvia Poyatos, Barcelona 2007) '
              '14...Qxc6 15.0-0 a5 16.Rc1 Qd6+ when Black still maintains a nagging initiative.'
          )
          text, branch_count = branch_pattern.subn(corrected_branch, text, count=1)
          if branch_count != 1:
              raise SystemExit(f'Expected one 14.c6 passage to replace, found {branch_count}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Install Sicilian dependencies
        working-directory: apps/opening-book-sicilian
        run: npm ci

      - name: Verify the requested navigation lines
        working-directory: apps/opening-book-sicilian
        shell: bash
        run: |
          node --import tsx <<'NODE'
          import assert from 'node:assert/strict';
          import { MarkdownMoveResolver } from './app/lib/markdown-moves.ts';

          function expectNavigable(tokens, displays, context) {
            for (const display of displays) {
              const token = tokens.find((candidate) => candidate.display === display);
              assert.ok(token, `Missing ${display} in ${context}.`);
              assert.ok(token.navigation, `${display} is not navigable in ${context}.`);
            }
          }

          const alternatives = new MarkdownMoveResolver();
          alternatives.setAnchor(
            'rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPPNPPP/RNBQKB1R b KQkq - 1 2',
            'After 2.Ne2',
          );
          const dilemma = alternatives.resolveText(
            'White is trying to postpone d2-d4: (2...Nc6 runs into 3.d4), while (2...d6 3.Nbc3 Nf6 4.g3 could lead to a Closed Sicilian with 4...e6).',
          );
          expectNavigable(
            dilemma,
            ['2...Nc6', '3.d4', '2...d6', '3.Nbc3', 'Nf6', '4.g3', '4...e6'],
            'the Najdorf-dilemma passage',
          );

          const c4Line = new MarkdownMoveResolver();
          c4Line.setAnchor(
            'r1bq1rk1/pp3ppp/2n2b2/2PN4/3pP3/8/PP2NPPP/R2QKB1R w KQ - 2 11',
            'After 10...0-0',
          );
          const branch = c4Line.resolveText(
            'Weaker is 11.Nxf6+ Qxf6 12.Ng3 Ne5! 13.Bd3 b6! 14.c6 (14.0-0? bxc5 15.Re1 c4 16.Bf1 d3 17.Nd2 Rb8-+ was simply lost for White in Eisenbeiser - Fluvia Poyatos, Barcelona 2007) 14...Qxc6 15.0-0 a5 16.Rc1 Qd6+ when Black still maintains a nagging initiative.',
          );
          expectNavigable(
            branch,
            [
              '11.Nxf6+', 'Qxf6', '12.Ng3', 'Ne5!', '13.Bd3', 'b6!', '14.c6',
              '14.0-0?', 'bxc5', '15.Re1', 'c4', '16.Bf1', 'd3', '17.Nd2', 'Rb8',
              '14...Qxc6', '15.0-0', 'a5', '16.Rc1', 'Qd6+',
            ],
            'the continuous 14.c6 variation',
          );
          NODE

      - name: Run Sicilian tests
        working-directory: apps/opening-book-sicilian
        run: npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page5-anchor-fix.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md
          git diff --cached --check
          git commit -m "Fix Sicilian page 5 navigation anchors"
          git push origin HEAD:wip/sicilian-20260805-153931
