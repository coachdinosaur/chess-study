name: Add Canonical Sicilian FEN

on:
  push:
    branches:
      - cleanup/sicilian-canonical-markdown-20260806
    paths:
      - .github/workflows/add-canonical-sicilian-fen.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/sicilian-canonical-markdown-20260806
          fetch-depth: 0

      - name: Add required visible FEN to canonical Markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md")
          text = path.read_text(encoding="utf-8")
          needle = "### **A) 2.Bc4**\n\n"
          replacement = (
              "### **A) 2.Bc4**\n\n"
              "**FEN:**\n"
              "`rnbqkbnr/pp1ppppp/8/2p5/2B1P3/8/PPPP1PPP/RNBQK1NR b KQkq - 1 2`\n\n"
          )
          if text.count(needle) != 1:
              raise SystemExit("Expected exactly one A) 2.Bc4 heading")
          if "**FEN:**" in text:
              raise SystemExit("Canonical Markdown already contains a visible FEN")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/add-canonical-sicilian-fen.yml

      - name: Commit required FEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add required FEN to canonical Sicilian Markdown"
          git push origin HEAD:cleanup/sicilian-canonical-markdown-20260806
