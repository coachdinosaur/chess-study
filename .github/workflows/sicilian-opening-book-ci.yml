# Verifies the current Catalan and Sicilian opening-book checkpoint, including deep PDF-synchronized Pages 8-13 content, exact Page 13 variation hierarchy, 4...Nge7!N annotation, glyphs, and page boundaries.
name: Sicilian Opening Book CI

on:
  push:
    branches:
      - main
      - wip/sicilian-20260805-153931
    paths:
      - "apps/opening-book-sicilian/**"
      - "apps/opening-book/**"
      - "tests/opening-book-integration.test.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sicilian-opening-book-ci.yml"
  pull_request:
    paths:
      - "apps/opening-book-sicilian/**"
      - "apps/opening-book/**"
      - "tests/opening-book-integration.test.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sicilian-opening-book-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/opening-book/package-lock.json
            apps/opening-book-sicilian/package-lock.json

      - name: Test and build Catalan opening book
        working-directory: apps/opening-book
        run: |
          npm ci
          npm test

      - name: Test and build Sicilian opening book
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test
          npm run chapters:audit -- --chapter 1 --markdown app/content/chapters/chapter-1-sicilian.md --expected-first-page 7 --expected-pages 17
          npm run chapters:audit -- --chapter 2 --markdown app/content/chapters/chapter-2-sicilian.md --expected-first-page 24 --expected-pages 15 --expected-diagrams 47

      - name: Verify combined opening routes
        run: node --test tests/opening-book-integration.test.mjs
