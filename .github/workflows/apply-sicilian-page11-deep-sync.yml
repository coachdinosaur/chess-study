name: Apply deep Sicilian Page 11 PDF sync

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page11-deep-sync.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Deep-sync printed PDF Page 11
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          text = chapter.read_text(encoding='utf-8')

          replacements = [
              (
                  '16.Bf3 Qg6+ left White in dire straits in Eisenbeiser - Solak, Dresden 2007.',
                  '16.Bf3 Qg6∓ left White in dire straits in Eisenbeiser – Solak, Dresden 2007.',
                  'Qg6 evaluation and Eisenbeiser-Solak punctuation',
              ),
              (
                  '16.N2c3 Eminov - Yilmazyerli, Antalya 2013, and now:',
                  '16.N2c3 Eminov – Yilmazyerli, Antalya 2013, and now:',
                  'Eminov-Yilmazyerli punctuation',
              ),
              (
                  'was simply lost for White in Eisenbeiser - Fluvia Poyatos, Barcelona 2007) 14...Qxc6 15.0-0 a5 16.Rc1 Qd6+ when Black still maintains a nagging initiative.',
                  'was simply lost for White in Eisenbeiser – Fluvia Poyatos, Barcelona 2007) 14...Qxc6 15.0-0 a5 16.Rc1 Qd6∓ when Black still maintains a nagging initiative.',
                  'Qd6 evaluation and Fluvia Poyatos punctuation',
              ),
              (
                  '12.Bg2 d3 13.Qxd3 Bxb2 14.Rb1 Qa5+ 15.Qd2 Ba3 16.Qxa5 Nxa5 17.h3 Be6 18.0-0 Bxc5 19.Nef4=',
                  '12.Bg2 d3 13.Qxd3 Bxb2 14.Rad1 Qa5+ 15.Qd2 Ba3 16.Qxa5 Nxa5 17.h3 Be6 18.0-0 Bxc5 19.Nef4=',
                  'Rad1 transcription',
              ),
              (
                  'C) 2.Ne2\n1.e4 c5 2.Ne2\n\n**FEN:**',
                  'C) 2.Ne2\n\n**FEN:**',
                  'remove repeated opening sequence',
              ),
              (
                  'White is trying to postpone d2-d4 and create an awkward dilemma for Najdorf players: (2...Nc6 runs into 3.d4), while (2...d6 3.Nbc3 Nf6 4.g3 could be luring them into a g3 Dragon or a Closed Sicilian with 4...e6), which is beyond the subject of this book. Therefore, I have decided to offer a more clear-cut solution, in an attempt to satisfy all tastes:',
                  'White is trying to postpone d2-d4 and create an awkward dilemma for Najdorf players: 2...Nc6 runs into 3.d4, while 2...d6 3.Nbc3 Nf6 4.g3 could be luring them into a g3 Dragon or a Closed Sicilian with ...e6 (which is beyond the subject of this book). Therefore, I have decided to offer a more clear-cut solution, in an attempt to satisfy all tastes:',
                  'C-section prose',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          chapter.write_text(text, encoding='utf-8')

          tests = Path('apps/opening-book-sicilian/tests/chapter-workflow.test.mjs')
          test_text = tests.read_text(encoding='utf-8')
          old_global = 'assert.match(markdown, /16\\.N2c3 Eminov - Yilmazyerli/);'
          new_global = 'assert.match(markdown, /16\\.N2c3 Eminov – Yilmazyerli/);'
          if test_text.count(old_global) != 1:
              raise SystemExit('Expected one global Eminov test to update')
          test_text = test_text.replace(old_global, new_global, 1)

          marker = 'test("evaluation and positional glyphs remain attached to move buttons", () => {'
          regression_lines = [
              'test("printed PDF Page 11 keeps its exact move content and boundary", async () => {',
              '  const markdown = await readChapterOne();',
              '  const start = markdown.indexOf("## Page 11");',
              '  const end = markdown.indexOf("## Page 12", start);',
              '  const page = markdown.slice(start, end);',
              '  const pageTwelve = markdown.slice(end, markdown.indexOf("## Page 13", end));',
              '',
              '  assert.match(page, /16\\.Bf3 Qg6∓/);',
              '  assert.match(page, /16\\.N2c3 Eminov – Yilmazyerli/);',
              '  assert.match(page, /20\\.f3 Nd4!∓/);',
              '  assert.match(page, /14\\.\\.\\.Qxc6 15\\.0-0 a5 16\\.Rc1 Qd6∓/);',
              '  assert.match(page, /11\\.\\.\\.Bg4/);',
              '  assert.match(page, /15\\.\\.\\.f5!\\?∞/);',
              '  assert.match(page, /15\\.\\.\\.Nf3\\+ 16\\.Qxf3 Qxd5 17\\.Bd3 Qxc5 18\\.0-0 Be6∞/);',
              '  assert.match(page, /14\\.Rad1 Qa5\\+/);',
              '  assert.match(page, /19\\.Nef4=/);',
              '  assert.match(page, /C\\) 2\\.Ne2/);',
              '  assert.match(page, /a g3 Dragon or a Closed Sicilian with \\.\\.\\.e6/);',
              '  assert.match(page, /2\\.\\.\\.Nf6!\\? 3\\.Nbc3 d5!\\s*$/);',
              '  assert.doesNotMatch(page, /16\\.Bf3 Qg6\\+/);',
              '  assert.doesNotMatch(page, /16\\.Rc1 Qd6\\+/);',
              '  assert.doesNotMatch(page, /14\\.Rb1 Qa5\\+/);',
              '  assert.doesNotMatch(page, /1\\.e4 c5 2\\.Ne2/);',
              '  assert.doesNotMatch(page, /\\(2\\.\\.\\.Nc6 runs into 3\\.d4\\)/);',
              '  assert.doesNotMatch(page, /with 4\\.\\.\\.e6/);',
              '  assert.doesNotMatch(page, /That.s it! Usually this pawn thrust/);',
              '  assert.match(pageTwelve, /^## Page 12\\s+That.s it! Usually this pawn thrust/);',
              '});',
              '',
              '',
          ]
          regression = '\n'.join(regression_lines)
          if regression.strip() not in test_text:
              if marker not in test_text:
                  raise SystemExit('Could not find Page 11 test insertion point')
              test_text = test_text.replace(marker, regression + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

          git diff --check

      - name: Install and test Sicilian app
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page11-deep-sync.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md \
                  apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          git diff --cached --check
          git commit -m "Deep-sync Sicilian Page 11 with PDF"
          git push origin HEAD:wip/sicilian-20260805-153931
