name: Apply move annotation glyphs

on:
  push:
    branches:
      - feature/move-annotation-glyphs
    paths:
      - 'tools/apply_move_annotation_glyphs.py'
      - '.github/workflows/apply-move-annotation-glyphs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/apply_move_annotation_glyphs.py'
      - '.github/workflows/apply-move-annotation-glyphs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/move-annotation-glyphs
          fetch-depth: 1
          show-progress: false

      - name: Apply move annotation implementation
        id: apply
        shell: bash
        run: |
          set +e
          python -u tools/apply_move_annotation_glyphs.py > bootstrap.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: move-annotation-bootstrap-log
          path: bootstrap.log
          if-no-files-found: error

      - name: Stop after bootstrap failure
        if: steps.apply.outputs.status != '0'
        run: |
          cat bootstrap.log
          exit 1

      - name: Validate JavaScript and tests
        run: |
          node --check app.js
          node --check pgn.mjs
          node --check move-annotations.mjs
          node --test tests/move-annotations.test.mjs
          node --test tests/lesson-data-foundation.test.mjs
          node --test tests/lesson-position-interoperability.test.mjs
          node --test tests/lesson-variation-tree.test.mjs

      - name: Commit generated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add move annotation glyphs"
          git push origin HEAD:feature/move-annotation-glyphs
