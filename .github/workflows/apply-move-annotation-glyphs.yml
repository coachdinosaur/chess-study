name: Apply move annotation glyphs

on:
  push:
    branches:
      - feature/move-annotation-glyphs
    paths:
      - 'tools/apply_move_annotation_glyphs.py'
      - '.github/workflows/apply-move-annotation-glyphs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/apply_move_annotation_glyphs.py'
      - '.github/workflows/apply-move-annotation-glyphs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/move-annotation-glyphs
          fetch-depth: 0

      - name: Apply move annotation implementation
        run: python tools/apply_move_annotation_glyphs.py

      - name: Validate JavaScript and tests
        run: |
          node --check app.js
          node --check pgn.mjs
          node --check move-annotations.mjs
          node --test tests/move-annotations.test.mjs
          node --test tests/lesson-data-foundation.test.mjs
          node --test tests/lesson-position-interoperability.test.mjs
          node --test tests/lesson-variation-tree.test.mjs

      - name: Commit generated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add move annotation glyphs"
          git push origin HEAD:feature/move-annotation-glyphs
