name: Restore board-only context menu behavior

on:
  push:
    branches:
      - feature/move-annotation-glyphs
    paths:
      - '.github/workflows/apply-move-annotation-glyphs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/move-annotation-glyphs
          fetch-depth: 1
          show-progress: false

      - name: Restore existing board-only shortcut
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = """    openMoveAnnotationMenu(notationMove.dataset.nodeId || '', event.clientX, event.clientY);\n    return;\n  }\n  const square = squareFromEventTarget(event.target);\n"""
          new = """    openMoveAnnotationMenu(notationMove.dataset.nodeId || '', event.clientX, event.clientY);\n    return;\n  }\n  if (state.boardOnlyMode && event.shiftKey) {\n    event.preventDefault();\n    event.stopPropagation();\n    state.annotations.suppressContextMenu = false;\n    return;\n  }\n  const square = squareFromEventTarget(event.target);\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one context-menu anchor, found {text.count(old)}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          node --check app.js
          node --test tests/move-annotations.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Preserve board-only context menu behavior"
          git push origin HEAD:feature/move-annotation-glyphs
