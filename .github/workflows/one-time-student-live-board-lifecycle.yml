name: One-time student Live Board lifecycle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-student-live-board-lifecycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Implement permanent student Live Board entry point
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          WORKFLOW = Path('.github/workflows/one-time-student-live-board-lifecycle.yml')

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text was not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Shared URL helpers. Tokens stay in URL fragments and are not sent in HTTP requests.
          core = Path('management/js/student-workspace-core.mjs')
          core_text = core.read_text(encoding='utf-8')
          if 'export function liveBoardStudentLink' not in core_text:
              core_text += '''

function normalizeLiveBoardRoomCode(value) {
  return String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
}

function liveBoardUrl(locationObject = globalThis.location) {
  const url = new URL('../live-board.html', locationObject.href);
  url.search = '';
  return url;
}

export function liveBoardStudentLink(roomCode, studentToken, locationObject = globalThis.location) {
  const url = liveBoardUrl(locationObject);
  url.hash = new URLSearchParams({
    room: normalizeLiveBoardRoomCode(roomCode),
    role: 'student',
    access: String(studentToken || ''),
  }).toString();
  return url.href;
}

export function liveBoardTeacherLink(
  roomCode,
  teacherToken,
  studentToken,
  locationObject = globalThis.location,
) {
  const url = liveBoardUrl(locationObject);
  url.hash = new URLSearchParams({
    room: normalizeLiveBoardRoomCode(roomCode),
    role: 'teacher',
    access: String(teacherToken || ''),
    student: String(studentToken || ''),
  }).toString();
  return url.href;
}
'''
              core.write_text(core_text, encoding='utf-8')

          # Teacher dashboard markup: replace the manually pasted expiring URL with lifecycle controls.
          replace_once(
              'management/teacher.html',
