    state.liveBoard = { active: false };
    render();
    setStatus(elements.status, 'Live Board session ended. The permanent student workspace remains available.', 'success');
  } catch (error) {
    setStatus(elements.status, readableError(error), 'error');
  } finally {
    setBusy(elements.endLiveBoard, false);
  }
}

async function initialize() {'''
