name: Fix Lichess puzzle visibility

on:
  push:
    branches:
      - agent/fix-lichess-puzzle-visibility
    paths:
      - .github/workflows/fix-lichess-puzzle-visibility.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force browsers to load the merged launcher module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = './focus-analysis-popup.mjs?v=20260719-focus-analysis3'
          new = './focus-analysis-popup.mjs?v=20260725-lichess-position-training2'
          if old not in text:
              raise SystemExit(f'Expected cache-version reference not found: {old}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          grep -F 'focus-analysis-popup.mjs?v=20260725-lichess-position-training2' index.html
          grep -F "import './lichess-position-training.mjs?v=20260725-position-training1';" focus-analysis-popup.mjs
          test -f lichess-position-training.mjs
          test -f assets/puzzles/lichess-position-training/manifest.json

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-lichess-puzzle-visibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-lichess-puzzle-visibility.yml
          git commit -m 'Force browsers to load Lichess puzzle launcher'
          git push origin HEAD:agent/fix-lichess-puzzle-visibility
