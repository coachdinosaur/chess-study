name: Make Position Study wording consistent

on:
  push:
    branches: [main]
    paths:
      - '.github/position-study-wording-trigger.txt'

permissions:
  contents: write

jobs:
  update-wording:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Position Study wording and cache keys
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('lichess-position-training.mjs'): [
                  ('<h3>Lichess Position Training</h3>', '<h3>Position Study</h3>'),
                  ('Lichess puzzles available', 'positions available'),
                  ('Open position training', 'Open position study'),
              ],
              Path('focus-analysis-popup.mjs'): [
                  ('./lichess-position-training.mjs?v=20260726-position-study1', './lichess-position-training.mjs?v=20260726-position-study-wording1'),
              ],
              Path('index.html'): [
                  ('./focus-analysis-popup.mjs?v=20260726-position-study1', './focus-analysis-popup.mjs?v=20260726-position-study-wording1'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-use workflow files
        run: |
          rm -f .github/position-study-wording-trigger.txt
          rm -f .github/workflows/position-study-wording.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lichess-position-training.mjs focus-analysis-popup.mjs index.html .github/position-study-wording-trigger.txt .github/workflows/position-study-wording.yml
          git commit -m "Make Position Study wording consistent"
          git push origin main
