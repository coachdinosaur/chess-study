name: Apply Sicilian page 8 branch corrections

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page8-branch-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Correct page 8 moves and FEN anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
            ('6...g6!', '6...Ng6!'),
            ('6...a6?! 7.Na5 Qd7 8.Nb6 Qc7 9.a4! is not the kind of bind we\'d like to fall into.',
             '6...a6?! 7.Ba5 Qd7 8.Nb6 Qc7 9.Ba4! is not the kind of bind we\'d like to fall into.'),
            ('7.Ne3 Bg7 8.Nf3', '7.Ne3 Be7 8.Nf3'),
            ('r1bqkb1r/pp2np1p/2np2p1/1Bp1p3/2N1P3/3P4/PPPB1PPP/R2QK1NR w KQkq - 0 7',
             'r1bqkb1r/pp3ppp/2np2n1/1Bp1p3/2N1P3/3P4/PPPB1PPP/R2QK1NR w KQkq - 2 7'),
            ('r1bqk2r/pp2npbp/2np2p1/1Bp1p3/4P3/3PNN2/PPPB1PPP/R2QK2R b KQkq - 3 8',
             'r1bqk2r/pp2bppp/2np2n1/1Bp1p3/4P3/3PNN2/PPPB1PPP/R2QK2R b KQkq - 5 8'),
            ('r1bq1rk1/pp2npbp/2np2p1/1Bp1p3/4P3/3PNN2/PPPB1PPP/R2Q1RK1 b - - 5 9',
             'r1bq1rk1/pp2bppp/2np2n1/1Bp1p3/4P3/3PNN2/PPPB1PPP/R2Q1RK1 b - - 7 9'),
            ('r1bq1rk1/pp2npbp/3p2p1/1Bp1p3/3nP3/3PNN2/PPPB1PPP/R2Q1RK1 w - - 6 10',
             'r1bq1rk1/pp2bppp/3p2n1/1Bp1p3/3nP3/3PNN2/PPPB1PPP/R2Q1RK1 w - - 8 10'),
            ('r1bq1rk1/pp2npbp/3p2p1/1Bp1p3/2NnP3/3P1N2/PPPB1PPP/R2Q1RK1 b - - 7 10',
             'r1bq1rk1/pp2bppp/3p2n1/1Bp1p3/2NnP3/3P1N2/PPPB1PPP/R2Q1RK1 b - - 9 10'),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count < 1:
              raise SystemExit(f'Missing expected page 8 source text: {old}')
            text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Install Sicilian dependencies
        working-directory: apps/opening-book-sicilian
        run: npm ci

      - name: Verify the exact page 8 branches
        working-directory: apps/opening-book-sicilian
        shell: bash
        run: |
          node --import tsx <<'NODE'
          import assert from 'node:assert/strict';
          import { MarkdownMoveResolver } from './app/lib/markdown-moves.ts';

          const start = 'r1bqkb1r/pp2nppp/2np4/1Bp1p3/2N1P3/3P4/PPPB1PPP/R2QK1NR b KQkq - 1 6';

          const a6 = new MarkdownMoveResolver();
          a6.setAnchor(start, 'After 6.Bd2');
          const a6Tokens = a6.resolveText('6...a6?! 7.Ba5 Qd7 8.Nb6 Qc7 9.Ba4!');
          assert.ok(a6Tokens.every((token) => token.navigation), 'The 6...a6 branch must stay continuous through 9.Ba4.');
          assert.deepEqual(
            a6Tokens.at(-1).navigation.steps.map((step) => step.label),
            ['After 6.Bd2', '6...a6?!', '7.Ba5', 'Qd7', '8.Nb6', 'Qc7', '9.Ba4!'],
          );

          const main = new MarkdownMoveResolver();
          main.setAnchor(start, 'After 6.Bd2');
          const setup = main.resolveText('6...Ng6! 7.Ne3 Be7');
          assert.ok(setup.every((token) => token.navigation), 'The corrected main setup must be legal.');
          const alternatives = main.resolveText('Both 8.a4 Bg5 9.Nf3 Bxe3 10.Bxe3 0-0 and 8.Nd5 0-0 9.Ne2 Bg5 are level.');
          const actualMoves = alternatives.filter((token) => token.navigation);
          assert.equal(actualMoves.length, 10, 'Every move in both page 8 alternatives must be navigable.');

          const bg5 = alternatives.filter((token) => token.display === 'Bg5');
          assert.equal(bg5.length, 2, 'Both Bg5 moves must be detected.');
          assert.deepEqual(
            bg5[0].navigation.steps.slice(-2).map((step) => step.label),
            ['8.a4', 'Bg5'],
          );
          assert.deepEqual(
            bg5[1].navigation.steps.slice(-3).map((step) => step.label),
            ['0-0', '9.Ne2', 'Bg5'],
          );
          NODE

      - name: Run Sicilian tests
        working-directory: apps/opening-book-sicilian
        run: npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page8-branch-fix.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md
          git diff --cached --check
          git commit -m "Fix Sicilian page 8 branch navigation"
          git push origin HEAD:wip/sicilian-20260805-153931
