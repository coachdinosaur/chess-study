name: Update Study variation documentation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  update-docs:
    if: github.event.pull_request.head.ref == 'agent/update-study-variation-documentation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply documentation updates
        run: |
          python scripts/update-study-docs-main.py
          python scripts/update-study-docs-lessons.py

      - name: Validate documentation and lesson behavior
        run: |
          git diff --check
          grep -Fq '## Study main lines, variations, and comments' README.md
          grep -Fq '| Position Sets | CSV/XLSX Position Set Builder' README.md
          grep -Fq '`lesson-variation-tree.mjs` owns preferred-continuation semantics' ARCHITECTURE.md
          grep -Fq '### Stage 3: main-line and recursive variation controls' LESSON_DATA_ARCHITECTURE.md
          grep -Fq 'The **Make main line** button appears only' USER_GUIDE.md
          grep -Fq '## Quick example' LESSON_VARIATIONS_AND_MAIN_LINES.md
          if grep -Fq '| Lessons | CSV/XLSX Lesson Position Builder |' README.md; then
            echo 'README still contains stale Lessons terminology.' >&2
            exit 1
          fi
          node --test tests/lesson-data-foundation.test.mjs
          node --test tests/lesson-position-interoperability.test.mjs
          node --test tests/lesson-variation-tree.test.mjs

      - name: Commit documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ARCHITECTURE.md USER_GUIDE.md LESSON_DATA_ARCHITECTURE.md LESSON_VARIATIONS_AND_MAIN_LINES.md
          git diff --cached --check
          git commit -m "Update Study variation documentation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
