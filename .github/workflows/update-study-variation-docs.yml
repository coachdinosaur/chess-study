name: Update Study variation documentation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  update-docs:
    if: github.event.pull_request.head.ref == 'agent/update-study-variation-documentation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply documentation updates
        run: |
          sed -i 's/raise SystemExit(/print(/g' scripts/update-study-docs-main.py scripts/update-study-docs-lessons.py
          python scripts/update-study-docs-main.py
          python scripts/update-study-docs-lessons.py
          python scripts/fix-architecture-study-module-list.py
          git diff --check

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ARCHITECTURE.md USER_GUIDE.md LESSON_DATA_ARCHITECTURE.md LESSON_VARIATIONS_AND_MAIN_LINES.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Documentation is already generated.'
          else
            git commit -m "Update Study variation documentation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Validate README documentation
        run: |
          grep -Fq 'recursive move tree: the first continuation becomes the main line' README.md
          grep -Fq 'Position Set Builder and open or convert them into Study and Analysis lessons' README.md
          grep -Fq '## Study main lines, variations, and comments' README.md
          grep -Fq '| Study | Lesson review, main-line selection, nested variations' README.md
          grep -Fq '| Position Sets | CSV/XLSX Position Set Builder' README.md
          grep -Fq 'selected main-line continuation at each branch point' README.md
          grep -Fq 'recursively nested sub-variations' README.md
          grep -Fq 'LESSON_DATA_ARCHITECTURE.md' README.md
          grep -Fq 'Position Set Builder state use separate localStorage keys' README.md
          if grep -Fq '| Lessons | CSV/XLSX Lesson Position Builder |' README.md; then
            echo 'README still contains stale Lessons terminology.' >&2
            exit 1
          fi

      - name: Validate architecture module list
        run: grep -Fq 'lesson-model.mjs`, `lesson-migrations.mjs`, and `lesson-position-adapter.mjs' ARCHITECTURE.md

      - name: Validate architecture repository map
        run: grep -Fq '├── lesson-variation-tree.mjs' ARCHITECTURE.md

      - name: Validate architecture responsibility table
        run: grep -Fq '| `lesson-variation-tree.mjs` | Preferred-child lookup' ARCHITECTURE.md

      - name: Validate architecture tab contracts
        run: |
          grep -Fq '| Study | `TAB_STUDY` | Lesson review, explicit main-line selection' ARCHITECTURE.md
          grep -Fq '| Position Sets | `TAB_LESSONS` | CSV/XLSX Position Set Builder' ARCHITECTURE.md
          grep -Fq 'Entering Position Sets (`TAB_LESSONS`)' ARCHITECTURE.md

      - name: Validate architecture lesson-tree semantics
        run: |
          grep -Fq '`lesson-variation-tree.mjs` owns preferred-continuation semantics' ARCHITECTURE.md
          grep -Fq 'recursive export suppresses the initial sibling scan' ARCHITECTURE.md

      - name: Validate lesson documentation
        run: |
          grep -Fq '### Stage 3: main-line and recursive variation controls' LESSON_DATA_ARCHITECTURE.md
          grep -Fq '### `lesson-variation-tree.mjs`' LESSON_DATA_ARCHITECTURE.md
          grep -Fq '8. Support recursively nested sub-variations' LESSON_DATA_ARCHITECTURE.md
          grep -Fq 'node --test tests/lesson-variation-tree.test.mjs' LESSON_DATA_ARCHITECTURE.md
          grep -Fq 'PGN comment/variation punctuation and round-trip structure' LESSON_DATA_ARCHITECTURE.md
          grep -Fq 'The **Make main line** button appears only' USER_GUIDE.md
          grep -Fq '## Quick example' LESSON_VARIATIONS_AND_MAIN_LINES.md
          grep -Fq 'Main-line moves display a status badge' LESSON_VARIATIONS_AND_MAIN_LINES.md

      - name: Validate lesson behavior
        run: |
          node --test tests/lesson-data-foundation.test.mjs
          node --test tests/lesson-position-interoperability.test.mjs
          node --test tests/lesson-variation-tree.test.mjs
