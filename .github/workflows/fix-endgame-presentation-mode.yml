body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-position-scene .board,
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-position-scene .board-screen,
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-position-scene .board-static,
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-position-scene .board-grid{
  width:min(66vh,760px) !important;
  max-width:100% !important;
  aspect-ratio:1 / 1 !important;
  margin-inline:auto !important;
}
