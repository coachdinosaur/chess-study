  display:block;
}
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-position-scene .position-note{
  min-width:0;
  padding:clamp(1rem,2vw,1.75rem) !important;
  border:1px solid var(--panel-border,var(--line,#43545a));
  border-radius:18px;
  background:color-mix(in srgb,var(--panel-bg,var(--panel,#1b2a2e)) 94%,transparent);
  box-shadow:0 18px 48px rgba(0,0,0,.16);
}
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-position-scene .caption{
  max-width:min(66vh,760px);
  margin:.65rem auto 0 !important;
  color:var(--ink-soft,var(--muted,#b9c6c3));
  text-align:center;
  font-size:clamp(.88rem,1vw,1.05rem) !important;
}
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card{
  width:min(1250px,100%) !important;
  display:grid !important;
  grid-template-columns:minmax(420px,min(66vh,720px)) minmax(280px,1fr) !important;
  grid-template-areas:"head head" "board question" "board fen";
  gap:clamp(.8rem,2vw,1.5rem) clamp(1.35rem,3vw,3rem) !important;
  align-content:center !important;
  align-items:center !important;
  margin-inline:auto !important;
}
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card>.test-card-head{grid-area:head;}
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card>.test-question{grid-area:question;}
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card>.test-diagram{grid-area:board;}
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card>.test-fen{grid-area:fen;overflow-wrap:anywhere;}
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card .board,
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card .board-screen,
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card .board-static,
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card .board-grid,
body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card .board-iframe{
  width:min(66vh,720px) !important;
  height:min(66vh,720px) !important;
  max-width:100% !important;
  margin-inline:auto !important;
}
'''
          if css_text.count(css_anchor) != 1:
              raise SystemExit(f'lessons/lesson-presentation.css: expected one context anchor, found {css_text.count(css_anchor)}')
          css_text = css_text.replace(css_anchor, css_insert, 1)

          mobile_anchor = '''  body.lesson-presentation-active .presentation-scene.presentation-current.hero,body.lesson-presentation-active .presentation-current .board-and-notes,body.lesson-presentation-active .presentation-current .two-col,body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-position-scene .position-body,body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene{
    grid-template-columns:1fr !important;
  }
'''
          mobile_replace = '''  body.lesson-presentation-active .presentation-scene.presentation-current.hero,body.lesson-presentation-active .presentation-current .board-and-notes,body.lesson-presentation-active .presentation-current .two-col,body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-position-scene .position-body,body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene,body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-position-scene .position-body,body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card{
    grid-template-columns:1fr !important;
  }
  body.lesson-presentation-endgame-page.lesson-presentation-active .presentation-current.test-card{
    grid-template-areas:"head" "question" "board" "fen";
  }
'''
          if css_text.count(mobile_anchor) != 1:
              raise SystemExit(f'lessons/lesson-presentation.css: expected one mobile anchor, found {css_text.count(mobile_anchor)}')
          css_text = css_text.replace(mobile_anchor, mobile_replace, 1)
          css.write_text(css_text, encoding='utf-8')

          test = Path('tests/lesson-endgame-presentation.test.mjs')
          test.write_text('''import test from 'node:test';
import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';

const presentation = readFileSync(new URL('../lessons/lesson-presentation.js', import.meta.url), 'utf8');
const presentationCss = readFileSync(new URL('../lessons/lesson-presentation.css', import.meta.url), 'utf8');
const endgameRuntime = readFileSync(new URL('../lessons/endgame-lesson.js', import.meta.url), 'utf8');

test('endgame lessons use their own complete scene collector', () => {
  assert.match(presentation, /function isEndgameLessonPage\(\)/);
  assert.match(presentation, /function collectEndgameScenes\(\)/);
  assert.match(presentation, /root\.querySelectorAll\(\":scope > \\.lesson\"\)/);
  assert.match(presentation, /root\.querySelectorAll\(\":scope > \\.test-section \\.test-card\"\)/);
  assert.match(presentation, /if \(endgameLesson\) return collectEndgameScenes\(\)/);
});

test('endgame position and test scenes receive presentation layouts', () => {
  assert.match(presentationCss, /lesson-presentation-endgame-page/);
  assert.match(presentationCss, /presentation-generated-scene/);
  assert.match(presentationCss, /presentation-position-scene \\.position-body/);
  assert.match(presentationCss, /presentation-current\.test-card/);
});

test('the shared endgame runtime loads presentation mode', () => {
  assert.match(endgameRuntime, /function loadLessonPresentation\(\)/);
  assert.match(endgameRuntime, /lesson-presentation\.js/);
});
''', encoding='utf-8')

          workflow = Path('.github/workflows/lesson-interoperability-tests.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          test_anchor = '          node --test tests/move-annotations.test.mjs\n'
          test_insert = test_anchor + '          node --test tests/lesson-endgame-presentation.test.mjs\n'
          if workflow_text.count(test_anchor) != 1:
              raise SystemExit(f'CI workflow: expected one test anchor, found {workflow_text.count(test_anchor)}')
          workflow.write_text(workflow_text.replace(test_anchor, test_insert, 1), encoding='utf-8')
          PY

          node --check lessons/lesson-presentation.js
          node --check lessons/endgame-lesson.js
          node --test tests/lesson-endgame-presentation.test.mjs
          node --test tests/move-annotations.test.mjs
          node --test tests/lesson-data-foundation.test.mjs
          node --test tests/lesson-position-interoperability.test.mjs
          node --test tests/lesson-variation-tree.test.mjs
          git diff --check

          rm .github/workflows/fix-endgame-presentation-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete endgame lesson presentation mode"
          git push origin HEAD:fix/endgame-presentation-mode
