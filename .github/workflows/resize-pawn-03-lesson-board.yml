name: Resize Pawn 03 lesson board

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/resize-pawn-03-lesson-board.yml

permissions:
  contents: write

jobs:
  resize-board:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add page-specific lesson board sizing
        run: |
          python - <<'PY'
          from pathlib import Path

          lesson_path = Path("lessons/pawn-03-files-ranks-diagonals.html")
          workflow_path = Path(".github/workflows/resize-pawn-03-lesson-board.yml")
          text = lesson_path.read_text(encoding="utf-8")

          marker = '  <link rel="stylesheet" href="pawn-teacher-board.css?v=20260710-teacher-lesson-csv1">\n'
          override = '''  <style>
    /* Pawn 03: keep the floating interactive lesson board from covering the lesson. */
    .teacher-board-panel:not(.is-maximized):not(.is-minimized) {
      width: min(72vw, 520px);
      height: min(72vh, 560px);
    }

    @media (max-width: 720px) {
      .teacher-board-panel:not(.is-maximized):not(.is-minimized) {
        left: auto;
        right: .5rem;
        width: min(calc(100vw - 1rem), 440px);
        height: min(64vh, 500px);
      }
    }
  </style>
'''

          if "Pawn 03: keep the floating interactive lesson board" not in text:
              if marker not in text:
                  raise SystemExit("Expected lesson-board stylesheet link was not found.")
              text = text.replace(marker, marker + override, 1)
              lesson_path.write_text(text, encoding="utf-8")

          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Commit lesson fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/pawn-03-files-ranks-diagonals.html .github/workflows/resize-pawn-03-lesson-board.yml
          git commit -m "Reduce Pawn 03 lesson board size"
          git push origin main
