name: Run position training learning upgrade

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-position-training-learning-pr.yml
      - scripts/run-position-training-learning-upgrade.sh
      - scripts/apply-position-training-learning-upgrade.mjs
      - lichess-position-training-learning.mjs
      - tests/lichess-position-training-learning.test.mjs

permissions:
  contents: write

jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-position-training-learning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run upgrade
        id: upgrade
        shell: bash
        run: |
          set +e
          bash scripts/run-position-training-learning-upgrade.sh > position-training-upgrade.log 2>&1
          status=$?
          cat position-training-upgrade.log
          exit "$status"
      - name: Upload complete upgrade log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: position-training-upgrade-log
          path: position-training-upgrade.log
          if-no-files-found: error
