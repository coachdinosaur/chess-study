name: Apply AI Help documentation patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-docs:
    if: github.head_ref == 'agent/update-ai-help-documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-ai-help-documentation
          fetch-depth: 0

      - name: Apply documentation patch
        run: python tools/update_ai_help_docs.py

      - name: Validate documentation
        run: |
          node --check worker/ai-help-worker.js
          git diff --check
          grep -q 'https://cddigital.top/' USER_GUIDE.md
          grep -q '/v1beta/interactions' ARCHITECTURE.md
          grep -q 'AI Help Worker Conventions' AGENTS.md
          grep -q 'GET /health' README.md

      - name: Remove temporary patch machinery
        run: |
          rm .github/workflows/update-ai-help-docs.yml
          rm .github/workflows/apply-ai-help-docs-pr.yml
          rm tools/update_ai_help_docs.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE.md AGENTS.md README.md USER_GUIDE.md .github/workflows tools/update_ai_help_docs.py
          git commit -m "Update AI Help architecture and usage documentation"
          git push origin HEAD:agent/update-ai-help-documentation
