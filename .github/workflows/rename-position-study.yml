name: Rename puzzle header to Position Study

on:
  push:
    branches: [main]
    paths:
      - '.github/position-study-trigger.txt'

permissions:
  contents: write

jobs:
  rename-header:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename header and refresh module cache keys
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('lichess-position-training.mjs'): (
                  '<h2 id="positionTrainingTitle">Lichess Position Training</h2>',
                  '<h2 id="positionTrainingTitle">Position Study</h2>',
              ),
              Path('focus-analysis-popup.mjs'): (
                  "./lichess-position-training.mjs?v=20260726-header-copy2",
                  "./lichess-position-training.mjs?v=20260726-position-study1",
              ),
              Path('index.html'): (
                  "./focus-analysis-popup.mjs?v=20260726-training-copy1",
                  "./focus-analysis-popup.mjs?v=20260726-position-study1",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-use workflow files
        run: |
          rm -f .github/position-study-trigger.txt
          rm -f .github/workflows/rename-position-study.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lichess-position-training.mjs focus-analysis-popup.mjs index.html .github/position-study-trigger.txt .github/workflows/rename-position-study.yml
          git commit -m "Rename puzzle header to Position Study"
          git push origin main
