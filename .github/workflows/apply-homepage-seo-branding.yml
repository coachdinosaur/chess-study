name: Apply homepage SEO and branding

on:
  push:
    branches:
      - agent/homepage-seo-branding
    paths:
      - .github/workflows/apply-homepage-seo-branding.yml

permissions:
  contents: write

jobs:
  apply-homepage-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/homepage-seo-branding
          fetch-depth: 0

      - name: Apply homepage improvements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          old_meta = '''  <title>Chess Study</title>

  <!-- ==========================================================================
       Social Sharing / Search Engine Optimization (SEO) Metadata
       ========================================================================== -->
  <!-- Open Graph / Facebook / Messenger / Discord -->
  <meta property="og:title" content="Chess Study">
  <meta property="og:description" content="Interactive lessons, puzzles, and analysis">
  <meta property="og:image" content="https://coachdinosaur.github.io/chess-study/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://coachdinosaur.github.io/chess-study/">
  <meta property="og:type" content="website">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Chess Study">
  <meta name="twitter:description" content="Interactive lessons, puzzles, and analysis">
  <meta name="twitter:image" content="https://coachdinosaur.github.io/chess-study/assets/social-preview.png">
  <!-- ========================================================================== -->'''

          new_meta = '''  <title>CD Digital Chess Study | Interactive Chess Board &amp; Lessons</title>
  <meta name="description" content="Free interactive chess board with lessons, puzzles, analysis tools, clocks, and teaching features.">
  <link rel="canonical" href="https://cddigital.top/">

  <!-- ==========================================================================
       Social Sharing / Search Engine Optimization (SEO) Metadata
       ========================================================================== -->
  <!-- Open Graph / Facebook / Messenger / Discord -->
  <meta property="og:site_name" content="CD Digital Chess">
  <meta property="og:title" content="CD Digital Chess Study">
  <meta property="og:description" content="Interactive chess lessons, puzzles, analysis, and teaching tools.">
  <meta property="og:image" content="https://cddigital.top/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://cddigital.top/">
  <meta property="og:type" content="website">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CD Digital Chess Study">
  <meta name="twitter:description" content="Interactive chess lessons, puzzles, analysis, and teaching tools.">
  <meta name="twitter:image" content="https://cddigital.top/assets/social-preview.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "CD Digital Chess",
    "alternateName": "CD Digital Chess Study",
    "url": "https://cddigital.top/"
  }
  </script>
  <!-- ========================================================================== -->'''

          if old_meta not in html:
              raise SystemExit("Expected SEO metadata block was not found")
          html = html.replace(old_meta, new_meta, 1)

          old_styles = '''  <link rel="stylesheet" href="./styles.css?v=20260719-mobile-drag-ui1">
  <link rel="stylesheet" href="./focus-analysis-popup.css?v=20260719-focus-analysis1">'''
          new_styles = '''  <link rel="stylesheet" href="./styles.css?v=20260719-mobile-drag-ui1">
  <link rel="stylesheet" href="./site-home.css?v=20260719-seo-branding1">
  <link rel="stylesheet" href="./focus-analysis-popup.css?v=20260719-focus-analysis1">'''
          if old_styles not in html:
              raise SystemExit("Expected stylesheet block was not found")
          html = html.replace(old_styles, new_styles, 1)

          old_heading = '<h1 id="boardTitleDisplay" class="board-stage-title">Untitled position</h1>'
          new_heading = '<h2 id="boardTitleDisplay" class="board-stage-title">Untitled position</h2>'
          if old_heading not in html:
              raise SystemExit("Expected board title heading was not found")
          html = html.replace(old_heading, new_heading, 1)

          lesson_header = '          <section class="lesson-header" aria-labelledby="titleInput">'
          intro = '''          <header class="site-intro" aria-labelledby="siteTitle">
            <div class="site-intro-copy">
              <p class="site-intro-kicker">CD Digital Chess</p>
              <h1 id="siteTitle" class="site-intro-title">Interactive Chess Study Board</h1>
              <p class="site-intro-description">Build positions, study lessons, solve puzzles, and analyze games with browser-based chess tools.</p>
            </div>
            <nav class="site-intro-actions" aria-label="Quick start">
              <a class="site-intro-button site-intro-button-primary" href="./lessons/">Explore lessons</a>
              <button class="site-intro-button" type="button" data-action="set-tab" data-tab="analysis">Analyze a position</button>
            </nav>
          </header>

'''
          if lesson_header not in html:
              raise SystemExit("Expected lesson header marker was not found")
          html = html.replace(lesson_header, intro + lesson_header, 1)

          index_path.write_text(html, encoding="utf-8")

          css = '''.site-intro {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.75rem 1rem;
  padding: 0.78rem 0.9rem;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-panel, 18px);
  background: var(--header-bg);
  box-shadow: 0 10px 24px var(--panel-shadow);
}

.site-intro-copy {
  min-width: 0;
}

.site-intro-kicker {
  margin: 0 0 0.12rem;
  color: var(--accent-strong);
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  line-height: 1.2;
  text-transform: uppercase;
}

.site-intro-title {
  margin: 0;
  color: var(--text);
  font-family: var(--font-display);
  font-size: clamp(1.15rem, 2vw, 1.55rem);
  line-height: 1.12;
}

.site-intro-description {
  margin: 0.28rem 0 0;
  color: var(--text-muted);
  font-size: 0.82rem;
  line-height: 1.4;
}

.site-intro-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.45rem;
}

.site-intro-button {
  display: inline-flex;
  min-height: 2.35rem;
  align-items: center;
  justify-content: center;
  padding: 0.5rem 0.72rem;
  border: 1px solid var(--button-tonal-border);
  border-radius: var(--radius-card, 12px);
  background: var(--button-tonal-bg);
  color: var(--accent-strong);
  font: inherit;
  font-size: 0.78rem;
  font-weight: 750;
  line-height: 1.1;
  text-decoration: none;
  cursor: pointer;
  transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}

.site-intro-button:hover {
  border-color: var(--focus-border);
  box-shadow: 0 6px 14px var(--control-hover-shadow);
  transform: translateY(-1px);
}

.site-intro-button:focus-visible {
  outline: none;
  border-color: var(--focus-border);
  box-shadow: 0 0 0 4px var(--focus-ring);
}

.site-intro-button-primary {
  border-color: var(--button-primary-border);
  background: var(--button-primary-bg);
  color: var(--button-primary-text);
}

html[data-embed="1"] .site-intro,
html[data-board-only="1"] .site-intro,
body.focus-mode .site-intro,
body.is-focus-mode .site-intro,
body.focus-mode-active .site-intro {
  display: none;
}

@media (max-width: 760px) {
  .site-intro {
    grid-template-columns: 1fr;
    gap: 0.6rem;
    padding: 0.68rem 0.75rem;
  }

  .site-intro-actions {
    justify-content: flex-start;
  }

  .site-intro-button {
    flex: 1 1 9rem;
  }
}

@media (min-width: 761px) and (max-height: 650px) {
  .site-intro {
    padding: 0.55rem 0.7rem;
  }

  .site-intro-description {
    display: none;
  }
}
'''
          Path("site-home.css").write_text(css, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "https://coachdinosaur.github.io/chess-study/",
              "https://cddigital.top/",
              1,
          )
          readme_path.write_text(readme, encoding="utf-8")

          checks = [
              '<link rel="canonical" href="https://cddigital.top/">',
              '"name": "CD Digital Chess"',
              'id="siteTitle"',
              'href="./lessons/"',
              'data-tab="analysis"',
              '<h2 id="boardTitleDisplay"',
          ]
          for check in checks:
              if check not in html:
                  raise SystemExit(f"Validation failed: {check}")

          workflow_path = Path(".github/workflows/apply-homepage-seo-branding.yml")
          workflow_path.unlink()
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site-home.css README.md .github/workflows/apply-homepage-seo-branding.yml
          git commit -m "feat: improve homepage branding and SEO"
          git push origin HEAD:agent/homepage-seo-branding

# Triggered after the workflow existed on the branch.
