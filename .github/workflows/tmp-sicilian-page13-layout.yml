name: Temporary Sicilian Page 13 Layout Fix

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/tmp-sicilian-page13-layout.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931
          fetch-depth: 0
      - name: Apply correction
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python /tmp/fix.py
      - name: Test and build
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-sicilian-page13-layout.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md
          git add apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          git commit -m "Match Sicilian Page 13 rendered layout"
          git push origin HEAD:wip/sicilian-20260805-153931
