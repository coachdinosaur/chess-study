name: Apply Bishop presentation v4b

on:
  push:
    branches:
      - agent/repair-bishop-presentation-and-headers-v4
    paths:
      - .github/workflows/apply-bishop-presentation-v4b.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-bishop-presentation-and-headers-v4
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python .github/scripts/apply_bishop_presentation_v4.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared presenter syntax
        run: node --check lessons/lesson-presentation.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run Chromium audit
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/chess-study-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python .github/scripts/audit_bishop_presentation.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.github/bishop-presentation-audit.json').read_text())
          summary = report['summary']
          failures = {
              'missing_launch_button': summary['missing_launch_button'],
              'blank_scene_lessons': summary['blank_scene_lessons'],
              'exact_duplicate_lessons': summary['exact_duplicate_lessons'],
              'page_error_lessons': summary['page_error_lessons'],
              'module1_without_unified_header': summary['module1_without_unified_header'],
          }
          failures = {key: value for key, value in failures.items() if value}
          if failures:
              raise SystemExit('Browser regression audit failed: ' + json.dumps(failures, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons .github/scripts/audit_bishop_presentation.py .github/bishop-presentation-audit.json
          git commit -m "Fix Bishop presentation scoping and Module 1 headers"
          git push origin HEAD:agent/repair-bishop-presentation-and-headers-v4

# Explicit retry after the browser audit exposed the selector-scoping defect.
