name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/opening-book/package-lock.json
            apps/opening-book-sicilian/package-lock.json

      - name: Test and build opening book
        working-directory: apps/opening-book
        run: |
          npm ci
          npm test

      - name: Test and build sicilian opening book
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Verify combined-site integration
        run: |
          node --test tests/opening-book-integration.test.mjs
          node --test tests/endgame-trainer-integration.test.mjs

      - name: Prepare Google Search favicon
        run: python tools/prepare_search_favicon.py

      - name: Publish opening books
        shell: bash
        run: |
          test ! -e openings
          mv apps/opening-book/dist openings
          rm -rf apps/opening-book

          test ! -e openings-sicilian
          mv apps/opening-book-sicilian/dist openings-sicilian
          rm -rf apps/opening-book-sicilian

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
