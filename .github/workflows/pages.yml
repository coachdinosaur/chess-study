name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book/package-lock.json

      - name: Test and build opening book
        working-directory: apps/opening-book
        run: |
          npm ci
          npm test

      - name: Verify combined-site integration
        run: |
          node --test tests/opening-book-integration.test.mjs
          node --test tests/endgame-trainer-integration.test.mjs

      - name: Prepare Google Search favicon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import binascii
          import math
          import struct
          import zlib

          PNG_SIGNATURE = b"\x89PNG\r\n\x1a\n"
          source_path = Path("assets/pieces/app_icon.png")
          output_path = Path("favicon.png")

          def paeth(left, up, upper_left):
              estimate = left + up - upper_left
              distances = (
                  (abs(estimate - left), left),
                  (abs(estimate - up), up),
                  (abs(estimate - upper_left), upper_left),
              )
              return min(distances, key=lambda item: item[0])[1]

          def make_chunk(chunk_type, payload):
              return (
                  struct.pack(">I", len(payload))
                  + chunk_type
                  + payload
                  + struct.pack(">I", binascii.crc32(chunk_type + payload) & 0xFFFFFFFF)
              )

          data = source_path.read_bytes()
          if not data.startswith(PNG_SIGNATURE):
              raise SystemExit(f"{source_path} is not a PNG file")

          offset = len(PNG_SIGNATURE)
          ihdr = None
          compressed_parts = []
          while offset < len(data):
              length = struct.unpack(">I", data[offset : offset + 4])[0]
              chunk_type = data[offset + 4 : offset + 8]
              payload = data[offset + 8 : offset + 8 + length]
              offset += 12 + length
              if chunk_type == b"IHDR":
                  ihdr = payload
              elif chunk_type == b"IDAT":
                  compressed_parts.append(payload)
              elif chunk_type == b"IEND":
                  break

          if ihdr is None or not compressed_parts:
              raise SystemExit("The source PNG is missing required chunks")

          width, height, bit_depth, color_type, compression, filter_method, interlace = struct.unpack(
              ">IIBBBBB", ihdr
          )
          if (bit_depth, color_type, compression, filter_method, interlace) != (8, 6, 0, 0, 0):
              raise SystemExit(
                  "Expected a non-interlaced 8-bit RGBA PNG; "
                  f"got bit_depth={bit_depth}, color_type={color_type}, interlace={interlace}"
              )

          bytes_per_pixel = 4
          stride = width * bytes_per_pixel
          filtered = zlib.decompress(b"".join(compressed_parts))
          expected_length = height * (stride + 1)
          if len(filtered) != expected_length:
              raise SystemExit(
                  f"Unexpected decoded PNG length: {len(filtered)}; expected {expected_length}"
              )

          rows = []
          previous = bytearray(stride)
          position = 0
          for _ in range(height):
              filter_type = filtered[position]
              position += 1
              encoded = filtered[position : position + stride]
              position += stride
              decoded = bytearray(stride)
              for index, value in enumerate(encoded):
                  left = decoded[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  up = previous[index]
                  upper_left = previous[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  if filter_type == 0:
                      predictor = 0
                  elif filter_type == 1:
                      predictor = left
                  elif filter_type == 2:
                      predictor = up
                  elif filter_type == 3:
                      predictor = (left + up) // 2
                  elif filter_type == 4:
                      predictor = paeth(left, up, upper_left)
                  else:
                      raise SystemExit(f"Unsupported PNG filter type: {filter_type}")
                  decoded[index] = (value + predictor) & 0xFF
              rows.append(bytes(decoded))
              previous = decoded

          canvas_size = math.ceil(max(width, height) / 48) * 48
          left_padding = (canvas_size - width) // 2
          top_padding = (canvas_size - height) // 2
          transparent_row = bytes(canvas_size * bytes_per_pixel)
          output_rows = [transparent_row for _ in range(canvas_size)]
          for source_y, source_row in enumerate(rows):
              destination = bytearray(transparent_row)
              start = left_padding * bytes_per_pixel
              destination[start : start + stride] = source_row
              output_rows[top_padding + source_y] = bytes(destination)

          raw_output = b"".join(b"\x00" + row for row in output_rows)
          output_ihdr = struct.pack(
              ">IIBBBBB", canvas_size, canvas_size, 8, 6, 0, 0, 0
          )
          output_png = (
              PNG_SIGNATURE
              + make_chunk(b"IHDR", output_ihdr)
              + make_chunk(b"IDAT", zlib.compress(raw_output, level=9))
              + make_chunk(b"IEND", b"")
          )
          output_path.write_bytes(output_png)

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          old = '''  <link rel="icon" type="image/png" href="./assets/pieces/app_icon.png">
          <link rel="apple-touch-icon" href="./assets/pieces/app_icon.png">'''
          new = f'''  <link rel="icon" type="image/png" sizes="{canvas_size}x{canvas_size}" href="/favicon.png">
          <link rel="apple-touch-icon" href="/favicon.png">'''
          if old not in html:
              raise SystemExit("Expected favicon markup was not found in index.html")
          index_path.write_text(html.replace(old, new, 1), encoding="utf-8")

          written_width, written_height = struct.unpack(">II", output_png[16:24])
          if written_width != written_height or written_width < 48:
              raise SystemExit(
                  f"Generated favicon is invalid: {written_width}x{written_height}"
              )
          print(f"Generated {output_path}: {written_width}x{written_height}")
          PY

      - name: Publish opening book at /openings/
        shell: bash
        run: |
          test ! -e openings
          mv apps/opening-book/dist openings
          rm -rf apps/opening-book

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
