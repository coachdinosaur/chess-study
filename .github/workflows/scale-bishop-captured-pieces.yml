name: Scale Bishop captured pieces

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scale-bishop-captured-pieces.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scale-captured-pieces:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Bishop lesson captured-piece scale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lessons/endgame-lesson.js')
          source = path.read_text(encoding='utf-8')

          needle = '''    iframe.addEventListener("load", function () {
      screen.removeAttribute("role");
      screen.removeAttribute("aria-label");
      print.style.display = "none";
      iframe.style.visibility = "visible";
    });'''

          replacement = '''    iframe.addEventListener("load", function () {
      /* Bishop modules 2–10 use the embedded study board. Their captured-piece
         cells were too large for the compact lesson diagrams, so scale that
         strip to 50% before revealing the iframe. */
      if (/\\/bishop-m(?:[2-9]|10)-lesson-[^/]+\\.html$/i.test(window.location.pathname)) {
        try {
          var iframeDocument = iframe.contentDocument;
          if (iframeDocument && iframeDocument.head && !iframeDocument.querySelector("style[data-bishop-captured-scale]")) {
            var capturedScaleStyle = iframeDocument.createElement("style");
            capturedScaleStyle.setAttribute("data-bishop-captured-scale", "0.5");
            capturedScaleStyle.textContent = [
              ":root {",
              "  --captured-cell-min: 0.65rem;",
              "  --captured-cell-divisor: 24;",
              "  --captured-cell-max: 0.925rem;",
              "  --captured-row-extra-height: 0.35rem;",
              "  --captured-count-extra-width: 0.6rem;",
              "}",
              ".captured-pieces { gap: 0.09rem; }"
            ].join("\\n");
            iframeDocument.head.appendChild(capturedScaleStyle);
          }
        } catch (e) {}
      }

      screen.removeAttribute("role");
      screen.removeAttribute("aria-label");
      print.style.display = "none";
      iframe.style.visibility = "visible";
    });'''

          if needle not in source:
              raise SystemExit('Expected iframe load block was not found; refusing an unsafe edit.')

          updated = source.replace(needle, replacement, 1)
          path.write_text(updated, encoding='utf-8')

          workflow = Path('.github/workflows/scale-bishop-captured-pieces.yml')
          workflow.unlink()
          PY

      - name: Commit captured-piece sizing fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/endgame-lesson.js .github/workflows/scale-bishop-captured-pieces.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Scale Bishop lesson captured pieces to half size"
          git push
