name: Finalize lesson data foundation stage 1

on:
  push:
    branches:
      - agent/lesson-data-foundation-stage-1
    paths:
      - .github/workflows/finalize-lesson-stage-1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update existing documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'README.md',
              '- Save and reopen lesson JSON files and multi-lesson books.',
              '- Save and reopen lesson JSON files and multi-lesson books.\n- Use a versioned lesson-data foundation for future interoperability between rich lesson trees and flat CSV/XLSX position sets.'
          )
          replace_once(
              'README.md',
              '| `pgn.mjs` | PGN parsing, multi-game splitting, lesson-tree import/export |',
              '''| `pgn.mjs` | PGN parsing, multi-game splitting, lesson-tree import/export |
| `lesson-model.mjs` | Versioned lesson, lesson-book, and shared-position normalization and validation |
| `lesson-migrations.mjs` | Pure migration of legacy lesson states, lesson books, and browser drafts into versioned documents |
| `lesson-position-adapter.mjs` | Conversion between rich lesson documents, selected tree nodes, flat position sets, and spreadsheet rows |'''
          )
          replace_once(
              'README.md',
              'A deeper implementation map is in [ARCHITECTURE.md](ARCHITECTURE.md).',
              'A deeper implementation map is in [ARCHITECTURE.md](ARCHITECTURE.md). The Stage 1 lesson interoperability contracts are documented in [LESSON_DATA_ARCHITECTURE.md](LESSON_DATA_ARCHITECTURE.md).'
          )
          replace_once(
              'README.md',
              'node --check app.js\nnode --check ai-help-chat.mjs',
              'node --check app.js\nnode --check lesson-model.mjs\nnode --check lesson-migrations.mjs\nnode --check lesson-position-adapter.mjs\nnode --test tests/lesson-data-foundation.test.mjs\nnode --check ai-help-chat.mjs'
          )

          replace_once(
              'ARCHITECTURE.md',
              '''2. **Supporting SPA modules**
   - `pgn.mjs`
   - `puzzle-api.mjs`''',
              '''2. **Supporting SPA modules**
   - `pgn.mjs`
   - `lesson-model.mjs`, `lesson-migrations.mjs`, and `lesson-position-adapter.mjs`
   - `puzzle-api.mjs`'''
          )
          replace_once(
              'ARCHITECTURE.md',
              '''├── pgn.mjs
├── puzzle-api.mjs''',
              '''├── pgn.mjs
├── lesson-model.mjs
├── lesson-migrations.mjs
├── lesson-position-adapter.mjs
├── puzzle-api.mjs'''
          )
          replace_once(
              'ARCHITECTURE.md',
              '''    ├── pgn.mjs
    ├── puzzle-api.mjs''',
              '''    ├── pgn.mjs
    ├── puzzle-api.mjs'''
          )
          replace_once(
              'ARCHITECTURE.md',
              '''focus-analysis-popup.mjs
└── lichess-position-training.mjs''',
              '''lesson data foundation (Stage 1; not yet wired into `app.js` UI flows)
├── lesson-model.mjs
├── lesson-migrations.mjs
└── lesson-position-adapter.mjs

focus-analysis-popup.mjs
└── lichess-position-training.mjs'''
          )
          replace_once(
              'ARCHITECTURE.md',
              '| `pgn.mjs` | Lesson-tree to PGN conversion, PGN parsing, comments, variations, multi-game splitting |',
              '''| `pgn.mjs` | Lesson-tree to PGN conversion, PGN parsing, comments, variations, multi-game splitting |
| `lesson-model.mjs` | Versioned document contracts, stable IDs, shared `LessonPosition`, normalization, validation, and root-tree creation |
| `lesson-migrations.mjs` | Non-mutating migration of raw lesson states, current lesson-book entries, versioned files, and browser drafts |
| `lesson-position-adapter.mjs` | Rich lesson ↔ flat position conversions, selected-node export, ordered lesson-book conversion, and spreadsheet-row projection |'''
          )
          replace_once(
              'ARCHITECTURE.md',
              '''### Lesson files

- `.lesson.json` stores one lesson with app-specific state.''',
              '''### Lesson files

Stage 1 adds versioned `coach-dinosaur-lesson` and `coach-dinosaur-lesson-book` contracts plus a flat `LessonPosition` bridge. These modules are foundation-only in this change: the current runtime save/open handlers and browser keys remain unchanged until a later integration stage. See [LESSON_DATA_ARCHITECTURE.md](LESSON_DATA_ARCHITECTURE.md).

- `.lesson.json` stores one lesson with app-specific state.'''
          )
          PY

      - name: Validate lesson foundation
        shell: bash
        run: |
          node --check lesson-model.mjs
          node --check lesson-migrations.mjs
          node --check lesson-position-adapter.mjs
          node --test tests/lesson-data-foundation.test.mjs
          git diff --check

      - name: Commit final Stage 1 files
        shell: bash
        run: |
          rm .github/workflows/finalize-lesson-stage-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize lesson data foundation stage 1"
          git push origin HEAD:agent/lesson-data-foundation-stage-1
