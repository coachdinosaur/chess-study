name: Replace Position Study explanations with one hint

on:
  push:
    branches: [main]
    paths:
      - '.github/position-study-single-hint-trigger.txt'

permissions:
  contents: write

jobs:
  update-position-study:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused Position Study edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, found {count}')
              return updated

          main_path = Path('lichess-position-training.mjs')
          main = main_path.read_text(encoding='utf-8')

          main = replace_once(
              main,
              "import { PositionTrainingLearning } from './lichess-position-training-learning.mjs';",
              "import { PositionTrainingLearning } from './lichess-position-training-learning.mjs?v=20260726-single-hint1';",
              'learning module cache key',
          )
          main = replace_once(
              main,
              '            <section class="position-training-explanation" data-pt-explanation hidden></section>\n',
              '',
              'explanation panel markup',
          )
          main = replace_once(
              main,
              '              <button type="button" data-pt-action="hint">Hint 1 of 4</button>',
              '              <button type="button" data-pt-action="hint">Hint</button>',
              'initial hint button label',
          )
          main = regex_once(
              main,
              r"  async showHint\(\) \{\n.*?\n  \}\n\n  #handleKeydown",
              """  async showHint() {
    if (!this.current || this.busy || this.completed || this.learning.hintUsed()) return;
    const hint = this.learning.useHint({
      puzzle: this.current,
      bestMove: this.turnBaseline?.bestMove || this.initialBaseline?.bestMove || '',
    });
    if (!hint.from) {
      this.feedback = { kind: 'warning', text: 'A reliable hint is unavailable for this position.' };
      this.render();
      return;
    }
    this.hintSquare = hint.from;
    this.render();
  }

  #handleKeydown""",
              'single hint controller',
              re.DOTALL,
          )
          main = replace_once(
              main,
              '        this.explanation = this.learning.buildMistakeExplanation({ puzzle: this.current, moveSan: applied.san, reason: verdict.reason });\n',
              '',
              'mistake explanation assignment',
          )
          main = regex_once(
              main,
              r"    this\.explanation = this\.learning\.recordSolved\(\{\n.*?\n    \}\);",
              '    this.learning.recordSolved({ puzzle: this.current });',
              'success explanation assignment',
              re.DOTALL,
          )
          main = regex_once(
              main,
              r"\n    const explanation = this\.overlay\.querySelector\('\[data-pt-explanation\]'\);\n.*?\n    const current = this\.overlay\.querySelector\('\[data-pt-current\]'\);",
              "\n    const current = this.overlay.querySelector('[data-pt-current]');",
              'explanation renderer',
              re.DOTALL,
          )
          main = replace_once(
              main,
              "        square === this.hintSquare ? 'hinted' : '',\n        square === this.hintFrom ? 'hinted-from' : '',\n        square === this.hintTo ? 'hinted-target' : '',",
              "        square === this.hintSquare ? 'hinted-from' : '',",
              'board hint classes',
          )
          main = replace_once(
              main,
              "    hintButton.textContent = `Hint ${Math.min(4, this.learning.hintLevel() + 1)} of 4`;\n    hintButton.disabled = this.busy || this.completed || this.learning.hintLevel() >= 4;",
              "    hintButton.textContent = this.learning.hintUsed() ? 'Hint used' : 'Hint';\n    hintButton.disabled = !this.current || this.busy || this.completed || this.learning.hintUsed();",
              'hint button render state',
          )
          main = replace_once(
              main,
              '      <p>Train against dynamic defence with adaptive difficulty, progressive hints, mistake review, explanations, and theme performance tracking. The existing Endgame vs Stockfish trainer remains unchanged.</p>',
              '      <p>Train against dynamic defence with adaptive difficulty, a one-use piece hint, mistake review, and theme performance tracking. The existing Endgame vs Stockfish trainer remains unchanged.</p>',
              'launcher description',
          )

          main = re.sub(r"^\s{4}this\.(?:hintFrom|hintTo|hintLevel|explanation|lastAcceptedMove|lastVerdict) = .*;\n", '', main, flags=re.MULTILINE)
          main = re.sub(r"^\s{6}this\.(?:lastAcceptedMove|lastVerdict) = .*;\n", '', main, flags=re.MULTILINE)

          forbidden_main = [
              'data-pt-explanation',
              'Hint 1 of 4',
              'hintFrom',
              'hintTo',
              'hintLevel',
              'this.explanation',
              'buildMistakeExplanation',
              'progressive hints',
          ]
          for token in forbidden_main:
              if token in main:
                  raise SystemExit(f'lichess-position-training.mjs still contains {token!r}')
          main_path.write_text(main, encoding='utf-8')

          learning_path = Path('lichess-position-training-learning.mjs')
          learning = learning_path.read_text(encoding='utf-8')
          learning = replace_once(learning, "import { Chess } from './vendor/chess.js';\n\n", '', 'unused Chess import')
          learning = regex_once(
              learning,
              r"function moveToSan\(fen, uci\) \{\n.*?\n\}\n\n",
              '',
              'obsolete SAN helper',
              re.DOTALL,
          )
          learning = re.sub(r"^\s{4}\.position-training-explanation.*\n", '', learning, flags=re.MULTILINE)
          learning = re.sub(r"^\s{4}\.position-training-square\.hinted-target.*\n", '', learning, flags=re.MULTILINE)
          learning = regex_once(
              learning,
              r"  nextHint\(\{ puzzle, bestMove, objectiveText = '', humanTheme = \(value\) => value \} = \{\}\) \{\n.*?\n  \}\n\n  recordMistake",
              """  useHint({ puzzle, bestMove } = {}) {
    if (!this.attempt || this.attempt.puzzleId !== puzzle?.id) this.beginPuzzle(puzzle);
    if (this.attempt.hints >= 1) return { from: '' };

    const move = String(bestMove || '').trim().toLowerCase();
    const from = /^[a-h][1-8][a-h][1-8][qrbn]?$/.test(move) ? move.slice(0, 2) : '';
    if (!from) return { from: '' };

    this.attempt.hints = 1;
    this.state.totalHints += 1;
    for (const theme of this.attempt.themes) this.state.themes[theme].hints += 1;
    this.#save();
    return { from };
  }

  recordMistake""",
              'single hint learning method',
              re.DOTALL,
          )
          learning = replace_once(
              learning,
              "  recordSolved({ puzzle, moveSan = '', objectiveText = '', verdictReason = '', bestMove = '' } = {}) {",
              '  recordSolved({ puzzle } = {}) {',
              'recordSolved signature',
          )
          learning = regex_once(
              learning,
              r"\n    const explanation = this\.buildSuccessExplanation\(\{\n.*?\n    return explanation;\n  \}\n\n  buildSuccessExplanation.*?\n  \}\n\n  buildMistakeExplanation.*?\n  \}\n\n  nextReview",
              "\n    this.#save();\n  }\n\n  nextReview",
              'generic explanation builders',
              re.DOTALL,
          )
          learning = replace_once(
              learning,
              "  hintLevel() {\n    return this.attempt?.hints || 0;\n  }",
              "  hintUsed() {\n    return (this.attempt?.hints || 0) >= 1;\n  }",
              'hint state accessor',
          )

          forbidden_learning = [
              'nextHint',
              'hintLevel',
              'buildSuccessExplanation',
              'buildMistakeExplanation',
              'Why the solution worked',
              'Full reveal',
              'progressive hints',
              'hinted-target',
              'moveToSan',
          ]
          for token in forbidden_learning:
              if token in learning:
                  raise SystemExit(f'lichess-position-training-learning.mjs still contains {token!r}')
          learning_path.write_text(learning, encoding='utf-8')

          test_path = Path('tests/lichess-position-training-learning.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          tests = regex_once(
              tests,
              r"test\('progressive hints reveal concept, source, target, then move', \(\) => \{\n.*?\n\}\);",
              """test('one hint identifies only the piece to move and cannot be reused', () => {
  const learning = new PositionTrainingLearning({ storage: new MemoryStorage(), now: () => 1000 });
  learning.beginPuzzle(puzzle);

  const first = learning.useHint({ puzzle, bestMove: 'e1e2' });
  const second = learning.useHint({ puzzle, bestMove: 'e1e2' });

  assert.deepEqual(first, { from: 'e1' });
  assert.deepEqual(second, { from: '' });
  assert.equal(learning.hintUsed(), true);
  assert.equal(learning.snapshot().totalHints, 1);
  assert.equal(learning.dashboard().find((item) => item.theme === 'defensiveMove').hints, 1);
});""",
              'single hint test',
              re.DOTALL,
          )
          tests = tests.replace('learning.nextHint({', 'learning.useHint({')
          if 'nextHint' in tests or 'progressive hints' in tests:
              raise SystemExit('learning tests still reference the progressive hint system')
          test_path.write_text(tests, encoding='utf-8')

          focus_path = Path('focus-analysis-popup.mjs')
          focus = focus_path.read_text(encoding='utf-8')
          focus = replace_once(
              focus,
              "import './lichess-position-training.mjs?v=20260726-position-study-wording1';",
              "import './lichess-position-training.mjs?v=20260726-single-hint1';",
              'Position Study controller cache key',
          )
          focus_path.write_text(focus, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = replace_once(
              index,
              '<script type="module" src="./focus-analysis-popup.mjs?v=20260726-position-study-wording1"></script>',
              '<script type="module" src="./focus-analysis-popup.mjs?v=20260726-single-hint1"></script>',
              'focus popup cache key',
          )
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate updated modules
        run: |
          node --check lichess-position-training.mjs
          node --check lichess-position-training-learning.mjs
          node --test tests/lichess-position-training-learning.test.mjs

      - name: Remove one-use workflow files
        run: |
          rm -f .github/position-study-single-hint-trigger.txt
          rm -f .github/workflows/position-study-single-hint.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lichess-position-training.mjs lichess-position-training-learning.mjs tests/lichess-position-training-learning.test.mjs focus-analysis-popup.mjs index.html .github/position-study-single-hint-trigger.txt .github/workflows/position-study-single-hint.yml
          git commit -m "Replace Position Study explanations with one-use piece hint"
          git push origin main
