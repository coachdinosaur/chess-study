name: Lesson interoperability tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  implement-study-variations:
    if: github.event.pull_request.head.ref == 'agent/study-mainline-and-subvariations'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded implementation
        run: |
          python scripts/implement-study-variations.py
          git restore --source=HEAD -- \
            .github/workflows/lesson-interoperability-tests.yml \
            .github/workflows/build-study-mainline-controls.yml \
            scripts/implement-study-variations.py

      - name: Validate finished implementation
        run: |
          node --check app.js
          node --check pgn.mjs
          node --check lesson-variation-tree.mjs
          node --test tests/lesson-data-foundation.test.mjs
          node --test tests/lesson-position-interoperability.test.mjs
          node --test tests/lesson-variation-tree.test.mjs

      - name: Commit and push finished implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Study main-line and sub-variation controls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
