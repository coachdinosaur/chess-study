.notation-mainline-badge { flex: 0 0 auto; padding: 0.28rem 0.55rem; border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent-strong); font-size: 0.78rem; font-weight: 700; }
.notation-mainline-control .action-button { flex: 0 0 auto; min-height: 2rem; padding: 0.35rem 0.65rem; font-size: 0.82rem; }
@media (max-width: 760px) {
  .notation-mainline-control { align-items: stretch; flex-direction: column; }
  .notation-mainline-control .action-button,
  .notation-mainline-badge { align-self: flex-start; }
  .notation-variation { padding-left: 0.35rem; }
}
'''
          styles_path.write_text(styles, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = replace_once(index, './styles.css?v=20260725-puzzle-theme2', './styles.css?v=20260726-lesson-variations1', 'stylesheet cache version')
          index = replace_once(index, './app.js?v=20260725-puzzle-theme2', './app.js?v=20260726-lesson-variations1', 'app cache version')
          index_path.write_text(index, encoding='utf-8')

          guide_path = Path('USER_GUIDE.md')
          guide = guide_path.read_text(encoding='utf-8')
          guide = replace_once(guide, '- **Study**: review the board and recorded notation with the tools collapsed.', '- **Study**: review the board and recorded notation, manage the selected main line, and work with nested variations while the tools are collapsed.', 'Study guide summary')
          guide = guide.replace('- **Lessons**: create, edit, import, export, and load prepared FEN position sets.', '- **Position Sets**: create, edit, import, export, and load prepared FEN position sets.')
          guide = guide.replace('- Open the Lesson Position Builder: **Tools → Lessons**', '- Open the Position Set Builder: **Tools → Position Sets**')
          guide = replace_once(
              guide,
              '''Arrow-key navigation does not run while you are typing in a field or choosing a promotion piece.

---

## Analyze a Position with Stockfish''',
              '''Arrow-key navigation does not run while you are typing in a field or choosing a promotion piece.

## Choose the Main Line and Build Sub-Variations

> **Where to go:** notation tree in **Study** or **Analysis**

The first move recorded from a position becomes its main line. When that position already has a continuation, every later new move is added as a variation instead of silently replacing the main line.

To change the main line:

1. Click the variation move in the notation tree.
2. Confirm the notation area says that the selected move is a variation.
3. Click **Make main line**.
4. The former main continuation remains saved as a side variation.

Clicking or replaying a variation only navigates to it. Navigation does not promote it.

To create a sub-variation, enter any existing variation, navigate to the position where the nested branch should begin, and play a different move. The same first-continuation rule applies at every depth.

In the app, comments appear as styled prose without surrounding braces. In exported PGN, comments correctly use `{comment}` while variations and sub-variations use `(moves)`. Parentheses cannot be used for PGN comments because PGN readers interpret them as move branches.

See `LESSON_VARIATIONS_AND_MAIN_LINES.md` for the complete behavior and compatibility rules.

---

## Analyze a Position with Stockfish''',
              'variation guide section',
          )
          guide = guide.replace('- **Selected line** follows the currently displayed lesson line from the starting position.', '- **Selected line** follows the saved preferred main-line choices from the starting position.')
          guide_path.write_text(guide, encoding='utf-8')

          architecture_path = Path('LESSON_DATA_ARCHITECTURE.md')
          architecture = architecture_path.read_text(encoding='utf-8')
          if '## Main-line and recursive variation behavior' not in architecture:
              architecture += '''

## Main-line and recursive variation behavior

The runtime uses `lesson-variation-tree.mjs` for preferred-continuation semantics:

- the first valid child of a position becomes its main line;
- later children remain variations until explicitly promoted;
- navigation does not rewrite `selectedChildId`;
- **Make main line** updates only the selected move's immediate parent;
- the same rules apply recursively inside variations and sub-variations;
- comments remain comment data, while parentheses remain variation notation in PGN.

See `LESSON_VARIATIONS_AND_MAIN_LINES.md` for the user workflow, PGN rules, persistence contract, and validation checklist.
'''
          architecture_path.write_text(architecture, encoding='utf-8')

          final_workflow = '''name: Lesson interoperability tests

