name: Apply endgame presentation repair

on:
  push:
    branches:
      - fix/endgame-presentation-mode
    paths:
      - '.github/workflows/lesson-interoperability-tests.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/endgame-presentation-mode
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate the endgame presentation runtime
        shell: bash
        run: |
          set -euo pipefail
          cp lessons/lesson-presentation.js lessons/lesson-presentation-legacy.js
          base64 -d .github/endgame-presentation-payload.b64 > /tmp/endgame-presentation-payload.tar.gz
          tar -xzf /tmp/endgame-presentation-payload.tar.gz
          rm -f .github/endgame-presentation-payload.b64
          rm -f .github/workflows/fix-endgame-presentation-mode.yml

          node --check lessons/endgame-lesson.js
          node --check lessons/lesson-presentation.js
          node --check lessons/lesson-presentation-legacy.js
          node --check lessons/endgame-presentation.js
          node --test tests/lesson-endgame-presentation.test.mjs
          node --test tests/move-annotations.test.mjs
          node --test tests/lesson-data-foundation.test.mjs
          node --test tests/lesson-position-interoperability.test.mjs
          node --test tests/lesson-variation-tree.test.mjs
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete endgame lesson presentation mode"
          git push origin HEAD:fix/endgame-presentation-mode
