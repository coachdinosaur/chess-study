name: Lesson interoperability tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  implement-study-variations:
    if: github.event.pull_request.head.ref == 'agent/study-mainline-and-subvariations'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded runtime, PGN, style, and documentation changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_count(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              return text.replace(old, new)

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(
              app,
              "import { buildPgnFromLessonTree, parsePgnToLessonTree, splitPgnGames, extractPgnHeaders } from './pgn.mjs';\nimport { createLessonPositionBuilder } from './lesson-position-builder.mjs';",
              "import { buildPgnFromLessonTree, parsePgnToLessonTree, splitPgnGames, extractPgnHeaders } from './pgn.mjs';\nimport {\n  appendChildPreservingMainLine,\n  ensureExistingChildMainLine,\n  isNodeMainLine,\n  promoteNodeToMainLine,\n} from './lesson-variation-tree.mjs';\nimport { createLessonPositionBuilder } from './lesson-position-builder.mjs';",
              'variation helper import',
          )
          app = replace_once(app, "  const { syncSelection = true } = options;", "  const { syncSelection = false } = options;", 'non-promoting navigation default')

          old_move_block = '''  const existingChildId = findExistingAnalysisChildId(currentNode, applied);

  if (existingChildId) {
    currentNode.selectedChildId = existingChildId;
    applyAnalysisPathSelection(existingChildId);
    state.analysis.currentNodeId = existingChildId;
  } else {
    const nodeId = allocateAnalysisNodeId();
    state.analysis.nodes[nodeId] = {
      id: nodeId,
      parentId: currentNode.id,
      from: applied.from,
      to: applied.to,
      promotion: applied.promotion || undefined,
      san: applied.san,
      fen: state.analysis.game.fen(),
      children: [],
      selectedChildId: null,
      comment: '',
    };
    currentNode.children.push(nodeId);
    currentNode.selectedChildId = nodeId;
    applyAnalysisPathSelection(nodeId);
    state.analysis.currentNodeId = nodeId;
  }
'''
          new_move_block = '''  const existingChildId = findExistingAnalysisChildId(currentNode, applied);
  let createdAsVariation = false;

  if (existingChildId) {
    if (state.play.active) {
      currentNode.selectedChildId = existingChildId;
      applyAnalysisPathSelection(existingChildId);
    } else {
      ensureExistingChildMainLine(state.analysis.nodes, currentNode.id, existingChildId);
    }
    state.analysis.currentNodeId = existingChildId;
  } else {
    const nodeId = allocateAnalysisNodeId();
    const insertion = appendChildPreservingMainLine(state.analysis.nodes, currentNode.id, {
      id: nodeId,
      parentId: currentNode.id,
      from: applied.from,
      to: applied.to,
      promotion: applied.promotion || undefined,
      san: applied.san,
      fen: state.analysis.game.fen(),
      children: [],
      selectedChildId: null,
      comment: '',
    });
    if (state.play.active) {
      currentNode.selectedChildId = nodeId;
      applyAnalysisPathSelection(nodeId);
    } else {
      createdAsVariation = insertion.addedAsVariation;
    }
    state.analysis.currentNodeId = nodeId;
  }
'''
          app = replace_once(app, old_move_block, new_move_block, 'new move variation behavior')
          app = replace_once(
              app,
              '''  state.analysis.boardMessage = shouldKeepAnalysisLive
      ? `Current move: ${applied.san}. Stockfish is following the new board position.`
      : `Current move: ${applied.san}. Analyze the current board position for fresh evaluation.`;''',
              '''  const variationNotice = createdAsVariation
    ? ' Added as a variation. Use Make main line to promote it.'
    : '';
  state.analysis.boardMessage = shouldKeepAnalysisLive
      ? `Current move: ${applied.san}. Stockfish is following the new board position.${variationNotice}`
      : `Current move: ${applied.san}. Analyze the current board position for fresh evaluation.${variationNotice}`;''',
              'variation board message',
          )
          app = replace_count(app, '>{${escapeHtml(preview)}}</span>', '>${escapeHtml(preview)}</span>', 2, 'plain visual comment punctuation')
          app = replace_once(
              app,
              '''      class="notation-move ${state.analysis.currentNodeId === node.id ? 'is-current' : ''}"
      data-action="jump-node"''',
              '''      class="notation-move ${isNodeMainLine(state.analysis.nodes, node.id) ? 'is-main-line' : 'is-variation'} ${state.analysis.currentNodeId === node.id ? 'is-current' : ''}"
      data-action="jump-node"''',
              'interactive notation move class',
          )
          app = replace_once(
              app,
              '''  return `${moveNumberMarkup}<span class="notation-move ${state.analysis.currentNodeId === node.id ? 'is-current' : ''}">${escapeHtml(node.san)}</span>`;''',
              '''  return `${moveNumberMarkup}<span class="notation-move ${isNodeMainLine(state.analysis.nodes, node.id) ? 'is-main-line' : 'is-variation'} ${state.analysis.currentNodeId === node.id ? 'is-current' : ''}">${escapeHtml(node.san)}</span>`;''',
              'static notation move class',
          )
          app = replace_once(
              app,
              '''function renderNotationVariation(parentId, childId) {
  return `
    <div class="notation-variation">
      ${renderNotationBranchSequence(parentId, { forcedChildId: childId, skipInitialSiblings: true })}
    </div>
  `;
}''',
              '''function renderNotationVariation(parentId, childId) {
  return `
    <div class="notation-variation">
      <span class="notation-variation-paren" aria-hidden="true">(</span>
      <div class="notation-variation-body">
        ${renderNotationBranchSequence(parentId, { forcedChildId: childId, skipInitialSiblings: true })}
      </div>
      <span class="notation-variation-paren" aria-hidden="true">)</span>
    </div>
  `;
}''',
              'recursive variation punctuation',
          )

          controls = '''
function currentVariationControlState() {
  if (state.practice.active || state.play.active) {
    return null;
  }
  const currentNode = getCurrentAnalysisNode();
  if (!currentNode?.parentId) {
    return null;
  }
  const parentNode = getAnalysisNode(currentNode.parentId);
  if (!parentNode || !Array.isArray(parentNode.children) || parentNode.children.length < 2) {
    return null;
  }
  return {
    currentNode,
    parentNode,
    isMainLine: isNodeMainLine(state.analysis.nodes, currentNode.id),
  };
}

function renderNotationMainLineControl() {
  const control = currentVariationControlState();
  if (!control) {
    return '';
  }
  if (control.isMainLine) {
    return `
      <section class="notation-mainline-control" aria-label="Main-line status">
        <div class="notation-mainline-copy">
          <span class="notation-mainline-label">${escapeHtml(control.currentNode.san)} is the main line</span>
          <span class="notation-mainline-detail">Forward navigation and selected-line practice follow this move.</span>
        </div>
        <span class="notation-mainline-badge">Main line</span>
      </section>
    `;
  }
  return `
    <section class="notation-mainline-control" aria-label="Variation controls">
      <div class="notation-mainline-copy">
        <span class="notation-mainline-label">${escapeHtml(control.currentNode.san)} is a variation</span>
        <span class="notation-mainline-detail">Promoting it keeps the current main continuation as a side variation.</span>
      </div>
      <button type="button" class="action-button tonal" data-action="make-main-line">Make main line</button>
    </section>
  `;
}

function makeCurrentMoveMainLine() {
  const currentNode = getCurrentAnalysisNode();
  if (!currentNode) {
    return;
  }
  const result = promoteNodeToMainLine(state.analysis.nodes, currentNode.id);
  if (!result.ok) {
    syncLessonFileStatus(result.reason || 'Unable to promote this move.');
    return;
  }
  const message = result.changed
    ? `${currentNode.san} is now the main line from the previous position.`
    : `${currentNode.san} is already the main line.`;
  state.analysis.boardMessage = message;
  syncLessonFileStatus(message);
  schedulePersist();
  renderAll();
}

'''
          app = replace_once(app, '\nfunction renderNotationCommentEditor() {', '\n' + controls + 'function renderNotationCommentEditor() {', 'main-line control functions')
          app = replace_once(
              app,
              '''        ${renderNotationBranchSequence(state.analysis.rootId)}
      </div>
      ${renderNotationCommentEditor()}''',
              '''        ${renderNotationBranchSequence(state.analysis.rootId)}
      </div>
      ${renderNotationMainLineControl()}
      ${renderNotationCommentEditor()}''',
              'main-line control placement',
          )
          app = replace_once(
              app,
              '''    case 'jump-node':
      if (state.play.active) {''',
              '''    case 'make-main-line':
      makeCurrentMoveMainLine();
      break;
    case 'jump-node':
      if (state.play.active) {''',
              'make main line event action',
          )
          app_path.write_text(app, encoding='utf-8')

          pgn_path = Path('pgn.mjs')
          pgn = pgn_path.read_text(encoding='utf-8')
          old_pgn_function = '''function buildVariationSequence(nodes, parentId, forcedChildId = '') {
  const parts = [];
  let currentParentId = parentId;
  let overrideChildId = forcedChildId;
  let forceMoveNumber = true;
  const seenParents = new Set();

  while (currentParentId && !seenParents.has(currentParentId)) {
    seenParents.add(currentParentId);
    const parentNode = nodes[currentParentId];
    if (!parentNode) {
      break;
    }

    const childId = overrideChildId || getPreferredChildId(parentNode, nodes);
    overrideChildId = '';
    if (!childId) {
      break;
    }

    const childNode = nodes[childId];
    if (!childNode) {
      break;
    }

    parts.push(formatPgnMoveToken(parentNode.fen, childNode.san, forceMoveNumber));
    const comment = sanitizeCommentForPgn(childNode.comment);
    if (comment) {
      parts.push(`{${comment}}`);
    }

    const siblingIds = parentNode.children.filter((id) => id !== childId && nodes[id]);
    siblingIds.forEach((siblingId) => {
      const variation = buildVariationSequence(nodes, parentNode.id, siblingId);
      if (variation) {
        parts.push(`(${variation})`);
      }
    });

    currentParentId = childId;
    forceMoveNumber = false;
  }

  return parts.join(' ');
}'''
          new_pgn_function = '''function buildVariationSequence(nodes, parentId, forcedChildId = '', skipInitialSiblings = false) {
  const parts = [];
  let currentParentId = parentId;
  let overrideChildId = forcedChildId;
  let suppressSiblings = skipInitialSiblings;
  let forceMoveNumber = true;
  const seenParents = new Set();

  while (currentParentId && !seenParents.has(currentParentId)) {
    seenParents.add(currentParentId);
    const parentNode = nodes[currentParentId];
    if (!parentNode) {
      break;
    }

    const childId = overrideChildId || getPreferredChildId(parentNode, nodes);
    overrideChildId = '';
    if (!childId) {
      break;
    }

    const childNode = nodes[childId];
    if (!childNode) {
      break;
    }

    parts.push(formatPgnMoveToken(parentNode.fen, childNode.san, forceMoveNumber));
    const comment = sanitizeCommentForPgn(childNode.comment);
    if (comment) {
      parts.push(`{${comment}}`);
    }

    const siblingIds = suppressSiblings
      ? []
      : parentNode.children.filter((id) => id !== childId && nodes[id]);
    suppressSiblings = false;
    siblingIds.forEach((siblingId) => {
      const variation = buildVariationSequence(nodes, parentNode.id, siblingId, true);
      if (variation) {
        parts.push(`(${variation})`);
      }
    });

    currentParentId = childId;
    forceMoveNumber = false;
  }

  return parts.join(' ');
}'''
          pgn = replace_once(pgn, old_pgn_function, new_pgn_function, 'recursive PGN variation export')
          pgn_path.write_text(pgn, encoding='utf-8')

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          if '/* Lesson main-line and recursive variation controls */' not in styles:
              styles += '''

/* Lesson main-line and recursive variation controls */
