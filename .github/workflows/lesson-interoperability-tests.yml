name: Lesson interoperability tests

on:
  pull_request:
    paths:
      - 'app.js'
      - 'pgn.mjs'
      - 'styles.css'
      - 'lesson-model.mjs'
      - 'lesson-migrations.mjs'
      - 'lesson-position-adapter.mjs'
      - 'lesson-position-export-validation.mjs'
      - 'lesson-position-interoperability-core.mjs'
      - 'lesson-position-interoperability-export-guard.mjs'
      - 'lesson-position-interoperability.mjs'
      - 'lesson-variation-tree.mjs'
      - 'focus-analysis-popup.mjs'
      - 'tests/lesson-*.test.mjs'
      - 'LESSON_DATA_ARCHITECTURE.md'
      - 'LESSON_POSITION_INTEROPERABILITY.md'
      - 'LESSON_VARIATIONS_AND_MAIN_LINES.md'
      - 'USER_GUIDE.md'
      - '.github/workflows/lesson-interoperability-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'pgn.mjs'
      - 'styles.css'
      - 'lesson-model.mjs'
      - 'lesson-migrations.mjs'
      - 'lesson-position-adapter.mjs'
      - 'lesson-position-export-validation.mjs'
      - 'lesson-position-interoperability-core.mjs'
      - 'lesson-position-interoperability-export-guard.mjs'
      - 'lesson-position-interoperability.mjs'
      - 'lesson-variation-tree.mjs'
      - 'focus-analysis-popup.mjs'
      - 'tests/lesson-*.test.mjs'
      - 'LESSON_DATA_ARCHITECTURE.md'
      - 'LESSON_POSITION_INTEROPERABILITY.md'
      - 'LESSON_VARIATIONS_AND_MAIN_LINES.md'
      - 'USER_GUIDE.md'
      - '.github/workflows/lesson-interoperability-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check module syntax
        run: |
          node --check app.js
          node --check pgn.mjs
          node --check lesson-model.mjs
          node --check lesson-migrations.mjs
          node --check lesson-position-adapter.mjs
          node --check lesson-position-export-validation.mjs
          node --check lesson-position-interoperability-core.mjs
          node --check lesson-position-interoperability-export-guard.mjs
          node --check lesson-position-interoperability.mjs
          node --check lesson-variation-tree.mjs
          node --check focus-analysis-popup.mjs

      - name: Run lesson foundation, interoperability, and variation tests
        run: |
          node --test tests/lesson-data-foundation.test.mjs
          node --test tests/lesson-position-interoperability.test.mjs
          node --test tests/lesson-variation-tree.test.mjs
