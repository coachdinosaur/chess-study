}
.notation-variation-body { min-width: 0; display: grid; gap: 0.4rem; }
.notation-variation-paren { color: var(--text-soft); font-family: var(--font-display); font-size: 1.06em; font-weight: 700; line-height: 1.55; }
.notation-move.is-variation { color: var(--text-muted); }
.notation-move.is-variation:hover,
.notation-move.is-variation.is-current { color: var(--accent-strong); }
.notation-mainline-control { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.65rem 0.75rem; border: 1px solid var(--card-border); border-radius: var(--radius-card); background: var(--card-bg); }
.notation-mainline-copy { min-width: 0; display: grid; gap: 0.12rem; }
.notation-mainline-label { color: var(--text); font-weight: 700; }
