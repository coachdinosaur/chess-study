name: Apply Sicilian navigation repair

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-navigation-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Reapply the previously validated source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          previous = Path("/tmp/previous-workflow.yml")
          import subprocess
          previous.write_bytes(subprocess.check_output([
              "git", "show", "HEAD^:.github/workflows/apply-sicilian-navigation-fix.yml"
          ]))
          text = previous.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, "apply-sicilian-navigation-fix.py", "exec"), {"__name__": "__main__"})
          PY

      - name: Test Sicilian opening book
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git add apps/opening-book-sicilian
          git commit -m "Fix Sicilian move navigation across PDF pages"
          git push origin HEAD:wip/sicilian-20260805-153931
