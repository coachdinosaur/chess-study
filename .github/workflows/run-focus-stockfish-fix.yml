name: Run Focus Stockfish PV fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-focus-stockfish-pv'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-focus-stockfish-pv
          fetch-depth: 0

      - name: Apply and validate fix
        run: python tools/apply_focus_stockfish_fix.py

      - name: Remove temporary runner and commit
        shell: bash
        run: |
          rm -f tools/apply_focus_stockfish_fix.py
          rm -f .github/workflows/run-focus-stockfish-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show Stockfish PV lines in focus mode"
          git push origin HEAD:agent/fix-focus-stockfish-pv
