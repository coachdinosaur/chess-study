name: Add presentation click indicator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-click-indicator:
    if: github.head_ref == 'agent/add-presentation-click-indicator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-presentation-click-indicator
          fetch-depth: 0

      - name: Patch presentation JavaScript, CSS, and asset versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "20260725-presentation-click-pulse-v5"
          js_path = Path("lessons/lesson-presentation.js")
          css_path = Path("lessons/lesson-presentation.css")

          js = js_path.read_text(encoding="utf-8")
          old_header = '''  if (window.__LESSON_PRESENTATION_V4__) return;
            window.__LESSON_PRESENTATION_V4__ = true;

            var VERSION = "20260724-bishop-presentation-v4";'''.replace("            ", "")
          new_header = f'''  if (window.__LESSON_PRESENTATION_V5__) return;
            window.__LESSON_PRESENTATION_V5__ = true;

            var VERSION = "{version}";'''.replace("            ", "")
          if old_header not in js:
              raise SystemExit("Presentation version header marker was not found")
          js = js.replace(old_header, new_header, 1)

          variable_marker = "  var bishopLesson = false;\n"
          if variable_marker not in js:
              raise SystemExit("Presentation variable marker was not found")
          js = js.replace(
              variable_marker,
              variable_marker + "  var iframePointerDocuments = new WeakSet();\n",
              1,
          )

          function_marker = "  function requestNativeFullscreen() {\n"
          if function_marker not in js:
              raise SystemExit("Fullscreen function marker was not found")

          click_functions = r'''  function presentationIsActive() {
            return Boolean(document.body && document.body.classList.contains("lesson-presentation-active"));
          }

          function shouldIgnorePresentationPointer(target) {
            return Boolean(
              target &&
              target.closest &&
              target.closest(
                ".lesson-presentation-toolbar, .lesson-present-launch, " +
                ".teacher-board-panel, .teacher-board-toggle, [data-open-teacher-board]"
              )
            );
          }

          function showPresentationClickIndicator(clientX, clientY) {
            if (!presentationIsActive()) return;
            if (!Number.isFinite(clientX) || !Number.isFinite(clientY)) return;

            var indicators = document.querySelectorAll(".lesson-presentation-click-indicator");
            if (indicators.length >= 12 && indicators[0]) indicators[0].remove();

            var indicator = document.createElement("span");
            indicator.className = "lesson-presentation-click-indicator";
            indicator.setAttribute("aria-hidden", "true");
            indicator.style.left = clientX + "px";
            indicator.style.top = clientY + "px";
            document.body.appendChild(indicator);

            var removeIndicator = function () {
              if (indicator.parentNode) indicator.remove();
            };
            indicator.addEventListener("animationend", removeIndicator, { once: true });
            window.setTimeout(removeIndicator, 1100);
          }

          function validPresentationPointer(event) {
            if (!event || event.isPrimary === false) return false;
            return typeof event.button !== "number" || event.button === 0;
          }

          function onPresentationPointerDown(event) {
            if (!presentationIsActive() || !validPresentationPointer(event)) return;
            if (shouldIgnorePresentationPointer(event.target)) return;
            showPresentationClickIndicator(event.clientX, event.clientY);
          }

          function bindFramePointerIndicator(frame) {
            if (!frame || frame.dataset.presentationClickIndicatorBound === "true") return;
            frame.dataset.presentationClickIndicatorBound = "true";

            var bindDocument = function () {
              try {
                var frameDocument = frame.contentDocument;
                if (!frameDocument || iframePointerDocuments.has(frameDocument)) return;
                iframePointerDocuments.add(frameDocument);
                frameDocument.addEventListener("pointerdown", function (event) {
                  if (!presentationIsActive() || !validPresentationPointer(event)) return;
                  var rect = frame.getBoundingClientRect();
                  var frameWindow = frame.contentWindow;
                  var viewportWidth = frameWindow && frameWindow.innerWidth
                    ? frameWindow.innerWidth
                    : frame.clientWidth || rect.width;
                  var viewportHeight = frameWindow && frameWindow.innerHeight
                    ? frameWindow.innerHeight
                    : frame.clientHeight || rect.height;
                  var scaleX = viewportWidth ? rect.width / viewportWidth : 1;
                  var scaleY = viewportHeight ? rect.height / viewportHeight : 1;
                  showPresentationClickIndicator(
                    rect.left + event.clientX * scaleX,
                    rect.top + event.clientY * scaleY
                  );
                }, true);
              } catch (error) {
                // Cross-origin frames cannot expose pointer events to the lesson page.
              }
            };

            frame.addEventListener("load", bindDocument);
            bindDocument();
          }

          function bindBoardFramePointerIndicators() {
            document.querySelectorAll("iframe").forEach(bindFramePointerIndicator);
          }

'''.replace("          ", "")
          js = js.replace(function_marker, click_functions + function_marker, 1)

          exit_marker = '''  function exitPresentation() {
            if (!document.body.classList.contains("lesson-presentation-active")) return;
            document.body.classList.remove("lesson-presentation-active");'''.replace("            ", "")
          exit_replacement = '''  function exitPresentation() {
            if (!document.body.classList.contains("lesson-presentation-active")) return;
            document.querySelectorAll(".lesson-presentation-click-indicator").forEach(function (indicator) {
              indicator.remove();
            });
            document.body.classList.remove("lesson-presentation-active");'''.replace("            ", "")
          if exit_marker not in js:
              raise SystemExit("Exit presentation marker was not found")
          js = js.replace(exit_marker, exit_replacement, 1)

          init_marker = '''    createToolbar();
            addLaunchButton();
            document.addEventListener("keydown", onKeyDown);'''.replace("            ", "")
          init_replacement = '''    createToolbar();
            addLaunchButton();
            document.addEventListener("pointerdown", onPresentationPointerDown, true);
            bindBoardFramePointerIndicators();
            document.addEventListener("keydown", onKeyDown);'''.replace("            ", "")
          if init_marker not in js:
              raise SystemExit("Presentation init marker was not found")
          js = js.replace(init_marker, init_replacement, 1)
          js_path.write_text(js, encoding="utf-8")

          css = css_path.read_text(encoding="utf-8")
          css_marker = ".lesson-presentation-toolbar{\n  display:none;\n}\n"
          if css_marker not in css:
              raise SystemExit("Presentation stylesheet marker was not found")

          click_css = r'''.lesson-presentation-click-indicator{
            position:fixed;
            left:0;
            top:0;
            z-index:10019;
            width:3.7rem;
            height:3.7rem;
            pointer-events:none;
            border:.26rem solid #ffd166;
            border-radius:50%;
            opacity:0;
            transform:translate(-50%,-50%) scale(.18);
            box-shadow:0 0 0 .14rem rgba(4,8,10,.86),0 0 1.35rem rgba(255,209,102,.9);
            animation:lesson-presentation-click-pulse .72s cubic-bezier(.16,.84,.38,1) forwards;
          }
          .lesson-presentation-click-indicator::before{
            content:"";
            position:absolute;
            left:50%;
            top:50%;
            width:.66rem;
            height:.66rem;
            border:.13rem solid rgba(4,8,10,.88);
            border-radius:50%;
            background:#fff7d6;
            transform:translate(-50%,-50%);
            box-shadow:0 0 .45rem rgba(255,255,255,.95);
          }
          .lesson-presentation-click-indicator::after{
            content:"";
            position:absolute;
            inset:-.72rem;
            border:.12rem solid rgba(255,209,102,.68);
            border-radius:50%;
          }
          @keyframes lesson-presentation-click-pulse{
            0%{opacity:1;transform:translate(-50%,-50%) scale(.18)}
            38%{opacity:1;transform:translate(-50%,-50%) scale(.72)}
            100%{opacity:0;transform:translate(-50%,-50%) scale(1.28)}
          }
          @keyframes lesson-presentation-click-fade{
            0%,68%{opacity:1;transform:translate(-50%,-50%) scale(.82)}
            100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
          }
          @media (prefers-reduced-motion:reduce){
            .lesson-presentation-click-indicator{
              animation:lesson-presentation-click-fade .42s linear forwards;
            }
            .lesson-presentation-click-indicator::after{
              display:none;
            }
          }
'''.replace("          ", "")
          css = css.replace(css_marker, css_marker + click_css, 1)
          css = css.replace(
              ".lesson-present-launch,.lesson-presentation-toolbar{\n    display:none !important;\n  }",
              ".lesson-present-launch,.lesson-presentation-toolbar,.lesson-presentation-click-indicator{\n    display:none !important;\n  }",
              1,
          )
          css_path.write_text(css, encoding="utf-8")

          js_pattern = re.compile(r"lesson-presentation\.js(?:\?v=[^\"']*)?")
          css_pattern = re.compile(r"lesson-presentation\.css(?:\?v=[^\"']*)?")
          changed_pages = 0
          for page in sorted(Path("lessons").glob("*.html")):
              text = page.read_text(encoding="utf-8")
              if "lesson-presentation.js" not in text and "lesson-presentation.css" not in text:
                  continue
              updated = js_pattern.sub(f"lesson-presentation.js?v={version}", text)
              updated = css_pattern.sub(f"lesson-presentation.css?v={version}", updated)
              if updated != text:
                  page.write_text(updated, encoding="utf-8")
                  changed_pages += 1

          if changed_pages == 0:
              raise SystemExit("No lesson presentation asset references were updated")
          print(f"Updated presentation asset versions in {changed_pages} lesson pages")
          PY

      - name: Validate JavaScript and patched references
        run: |
          node --check lessons/lesson-presentation.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "20260725-presentation-click-pulse-v5"
          js = Path("lessons/lesson-presentation.js").read_text(encoding="utf-8")
          css = Path("lessons/lesson-presentation.css").read_text(encoding="utf-8")
          assert "__LESSON_PRESENTATION_V5__" in js
          assert "onPresentationPointerDown" in js
          assert "bindBoardFramePointerIndicators" in js
          assert "lesson-presentation-click-indicator" in css
          assert "@keyframes lesson-presentation-click-pulse" in css
          refs = []
          stale = []
          for page in Path("lessons").glob("*.html"):
              text = page.read_text(encoding="utf-8")
              if "lesson-presentation.js" not in text:
                  continue
              refs.append(page)
              if f"lesson-presentation.js?v={version}" not in text:
                  stale.append(page)
          assert refs, "No lesson pages load the presentation script"
          assert not stale, "Stale presentation versions: " + ", ".join(map(str, stale[:10]))
          print(f"Validated {len(refs)} presentation-enabled lesson pages")
          PY

      - name: Browser-test the click pulse
        run: |
          npm install --prefix /tmp/presentation-pw --no-save --no-package-lock playwright@1.55.0
          /tmp/presentation-pw/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8000 >/tmp/presentation-server.log 2>&1 &
          cat > /tmp/test-presentation-click.js <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('/tmp/presentation-pw/node_modules/playwright');

          const lessons = [
            'pawn-m2-lesson-01-how-to-move-the-king.html',
            'advanced-pawn-m12-lesson-01-basic-opening-traps-in-chess.html',
            'bishop-m1-lesson-01-building-a-strong-foundation.html',
            'bishop-m15-lesson-01-calculation-process-fen-laboratory.html',
          ];

          const endgame = fs.readdirSync('lessons').find((name) => {
            if (!/^01-.*\.html$/i.test(name)) return false;
            return fs.readFileSync(path.join('lessons', name), 'utf8').includes('lesson-presentation.js');
          });
          if (endgame) lessons.push(endgame);

          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const lesson of lessons) {
              const page = await browser.newPage({ viewport: { width: 1366, height: 768 } });
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));
              await page.goto(`http://127.0.0.1:8000/lessons/${lesson}`, { waitUntil: 'networkidle' });
              const launch = page.locator('.lesson-present-launch');
              if (await launch.count() !== 1) throw new Error(`${lesson}: expected one Present Lesson button`);
              await launch.click();
              await page.waitForFunction(() => document.body.classList.contains('lesson-presentation-active'));

              await page.mouse.click(36, 36);
              await page.waitForTimeout(60);
              if (await page.locator('.lesson-presentation-click-indicator').count() < 1) {
                throw new Error(`${lesson}: content click did not create an indicator`);
              }
              await page.waitForTimeout(900);
              if (await page.locator('.lesson-presentation-click-indicator').count() !== 0) {
                throw new Error(`${lesson}: click indicator did not clean itself up`);
              }

              const next = page.locator('[data-presentation-action="next"]');
              if (await next.isEnabled()) {
                await next.click();
                await page.waitForTimeout(60);
                if (await page.locator('.lesson-presentation-click-indicator').count() !== 0) {
                  throw new Error(`${lesson}: toolbar click should not create an indicator`);
                }
              }

              const visibleFrame = page.locator('.presentation-current iframe:visible').first();
              if (await visibleFrame.count()) {
                await page.waitForTimeout(350);
                const box = await visibleFrame.boundingBox();
                if (box && box.width > 20 && box.height > 20) {
                  await page.mouse.click(box.x + Math.min(40, box.width / 2), box.y + Math.min(40, box.height / 2));
                  await page.waitForTimeout(80);
                  if (await page.locator('.lesson-presentation-click-indicator').count() < 1) {
                    throw new Error(`${lesson}: same-origin iframe click did not create an indicator`);
                  }
                  await page.waitForTimeout(900);
                }
              }

              await page.keyboard.press('Escape');
              await page.waitForFunction(() => !document.body.classList.contains('lesson-presentation-active'));
              if (pageErrors.length) throw new Error(`${lesson}: ${pageErrors.join('; ')}`);
              await page.close();
            }
            await browser.close();
            console.log(`Presentation click pulse passed on ${lessons.length} representative lessons.`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS
          node /tmp/test-presentation-click.js

      - name: Remove temporary workflow
        run: rm .github/workflows/add-presentation-click-indicator.yml

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons .github/workflows/add-presentation-click-indicator.yml
          git commit -m "Add click pulse to lesson presentation mode"
          git push origin HEAD:agent/add-presentation-click-indicator
