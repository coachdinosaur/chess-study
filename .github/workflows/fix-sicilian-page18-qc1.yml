name: Fix Sicilian Page 18 Qc1 line

on:
  push:
    branches:
      - fix/sicilian-page18-qc1
    paths:
      - ".github/workflows/fix-sicilian-page18-qc1.yml"
      - "scripts/fix-sicilian-page18-qc1.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/sicilian-page18-qc1

      - name: Apply correction
        run: python scripts/fix-sicilian-page18-qc1.py

      - name: Run Sicilian tests
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit fix
        run: |
          git diff --check
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md apps/opening-book-sicilian/tests/page12-17-anchors.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Chapter 1 Page 18 Qc1 continuation"
          git push origin HEAD:fix/sicilian-page18-qc1
