name: Apply puzzle UI follow-up

on:
  push:
    branches:
      - agent/fix-puzzle-tab-theme
    paths:
      - .github/workflows/apply-puzzle-ui-fix.yml
      - scripts/fix-puzzle-ui.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-puzzle-tab-theme

      - name: Apply source patch
        run: python scripts/fix-puzzle-ui.py

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check lichess-position-training.mjs
          node --check lichess-position-training-interactions.mjs
          node --check focus-analysis-popup.mjs

      - name: Run position training core tests
        run: node --test tests/lichess-position-training-core.test.mjs

      - name: Verify puzzle UI cleanup
        run: |
          ! grep -q '<small>${square}</small>' lichess-position-training.mjs
          ! grep -q -- '--color-text-muted' app.js
          ! grep -q 'puzzle-queue-controls" style=' app.js
          grep -q 'position-training-interactions.mjs' focus-analysis-popup.mjs

      - name: Commit generated product changes
        run: |
          rm -f scripts/fix-position-training-coordinates.mjs scripts/fix-puzzle-ui.py .github/workflows/apply-puzzle-ui-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js styles.css index.html focus-analysis-popup.mjs lichess-position-training.mjs lichess-position-training.css lichess-position-training-interactions.mjs scripts .github/workflows
          git commit -m "Align puzzle tab theme and board interactions"
          git push origin HEAD:agent/fix-puzzle-tab-theme
