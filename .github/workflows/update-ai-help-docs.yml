name: Update AI Help documentation

on:
  push:
    branches:
      - agent/update-ai-help-documentation

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-ai-help-documentation
          fetch-depth: 0

      - name: Patch Markdown documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_section(path, start, end, replacement):
              text = path.read_text(encoding='utf-8')
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f'{path}: start marker not found: {start!r}')
              end_index = text.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f'{path}: end marker not found: {end!r}')
              updated = text[:start_index] + replacement.rstrip() + '\n\n' + text[end_index:]
              path.write_text(updated, encoding='utf-8')

          architecture = Path('ARCHITECTURE.md')
          replace_once(
              architecture,
              '''3. **AI chess-help UI**
   - `ai-help-chat.mjs`
   - `ai-help-chat.css`
   - `ai-help-config.mjs`
   - `ai-help-icon.mjs`

4. **Static lesson sites**''',
              '''3. **AI chess-help subsystem**
   - Browser UI: `ai-help-chat.mjs`, `ai-help-chat.css`, `ai-help-config.mjs`, `ai-help-icon.mjs`
   - Cloudflare Worker proxy: `worker/ai-help-worker.js`, `worker/wrangler.jsonc`
   - Gemini Interactions API, reached only from the Worker

4. **Static lesson sites**''',
          )
          replace_once(
              architecture,
              '''├── ai-help-icon.mjs
│
├── assets/''',
              '''├── ai-help-icon.mjs
│
├── worker/
│   ├── ai-help-worker.js
│   └── wrangler.jsonc
│
├── assets/''',
          )
          replace_once(
              architecture,
              '''ai-help-chat.mjs
├── ai-help-config.mjs
├── ai-help-icon.mjs
└── ai-help-chat.css
```''',
              '''ai-help-chat.mjs
├── ai-help-config.mjs
├── ai-help-icon.mjs
├── ai-help-chat.css
└── HTTPS POST /chat
    └── Cloudflare Worker (`worker/ai-help-worker.js`)
        └── Gemini Interactions API (`/v1beta/interactions`)
```''',
          )
          replace_once(
              architecture,
              '''| `ai-help-chat.mjs` | Dyno Bot launcher and panel, context collection, endpoint storage, transcript state, request lifecycle |
| `ai-help-chat.css` | Floating panel layout, themes, responsive hiding, Focus-mode placement |''',
              '''| `ai-help-chat.mjs` | Dyno Bot launcher and panel, bounded context collection, endpoint storage, transcript state, timeout and request lifecycle |
| `ai-help-chat.css` | Floating panel layout, themes, responsive hiding, Focus-mode placement |
| `ai-help-config.mjs` | Public Worker base URL used by the browser client; never contains the Gemini API key |
| `worker/ai-help-worker.js` | CORS enforcement, request validation, rate limiting, Gemini proxying, response normalization, `/chat` and `/health` routes |
| `worker/wrangler.jsonc` | Cloudflare Worker name, entry point, Gemini model, allowed origins, and rate-limit binding |''',
          )
          replace_section(
              architecture,
              '## 16. AI chess-help subsystem',
              '## 17. Focus mode',
              '''## 16. AI chess-help subsystem

AI Help is a two-tier feature. The static browser application collects bounded visible chess context, while a Cloudflare Worker protects the Gemini API key and performs the provider request.

```text
Browser at https://cddigital.top
  → ai-help-chat.mjs
  → HTTPS POST <Worker URL>/chat
  → Cloudflare Worker
  → Gemini Interactions API
  → normalized JSON { text }
  → Dyno Bot transcript
```

The browser must never call Gemini directly and must never contain `GEMINI_API_KEY`.

### 16.1 Browser client

`ai-help-chat.mjs` mounts the floating Dyno Bot interface unless the page is embedded or board-only. The client collects only visible, bounded context:

```javascript
{
  lessonTitle,
  fen,
  setupFen,
  opening,
  activeTab,
  positionLabel,
  sideToMove,
  notation
}
```

Notation and conversation history are capped before transmission. The request is aborted after 45 seconds. The endpoint is resolved from `AI_HELP_ENDPOINT` in `ai-help-config.mjs`, with browser-local `chess-study-ai-endpoint-v1` retained as a testing fallback. A base Worker URL is normalized to end in `/chat`.

### 16.2 Cloudflare Worker

`worker/ai-help-worker.js` exposes:

| Route | Method | Purpose |
|---|---|---|
| `/chat` | `POST` | Validate the request, enforce rate limits, call Gemini, and return `{ text }` |
| `/health` | `GET` | Confirm that the Worker is reachable from an allowed browser origin |
| `/chat` and `/health` | `OPTIONS` | CORS preflight handling |

The Worker:

- reads `GEMINI_API_KEY` from a Cloudflare secret;
- reads `GEMINI_MODEL` and `ALLOWED_ORIGINS` from Wrangler variables;
- accepts only exact allowed origins;
- limits request bytes, message count, message length, and context size;
- uses `https://generativelanguage.googleapis.com/v1beta/interactions`;
- removes an accidental `models/` prefix from a configured model ID;
- maps provider/network failures to bounded JSON errors rather than exposing secrets or raw provider responses.

The current production origins are `https://cddigital.top` and `https://www.cddigital.top`. The legacy GitHub Pages origin and localhost development origins remain allowed.

### 16.3 CORS behavior

CORS is enforced by exact origin matching. A missing production origin causes the browser to fail during preflight before JavaScript can read the Worker's JSON error. Firefox commonly reports this as:

```text
NetworkError when attempting to fetch resource.
```

When the production domain changes, update both the `ALLOWED_ORIGINS` Wrangler variable and the Worker's fallback origin list, then redeploy the Worker.

### 16.4 Deployment boundary

The static site and Cloudflare Worker are separate deployments. Merging Worker code into GitHub does not update the running Worker.

```powershell
cd worker
npx wrangler login
npx wrangler deploy
```

The existing secret normally remains attached. Set it only when missing:

```powershell
npx wrangler secret put GEMINI_API_KEY
npx wrangler deploy
```

Never commit the API key to `wrangler.jsonc`, JavaScript, Markdown, GitHub Actions logs, or screenshots.

### 16.5 Validation and troubleshooting

After Worker changes:

1. Run `node --check worker/ai-help-worker.js`.
2. Confirm `worker/wrangler.jsonc` contains the current production origins.
3. Deploy the Worker.
4. Open the app from `https://cddigital.top`, not from `file://`.
5. Test `/health` from an allowed origin, then send a short AI Help question.
6. Inspect the browser Network panel and Cloudflare Worker logs if the request fails.

Failure categories:

- **Browser network/CORS error:** Worker URL, DNS/TLS, deployment, or origin allowlist.
- **HTTP 429/503:** rate limit, missing Worker secret, provider outage, or temporary Gemini capacity.
- **HTTP 502:** provider rejected the model/request or returned unusable output.
- **Timeout:** the browser aborted after 45 seconds.

### 16.6 Visibility and placement

- Hidden for `embed` and `boardOnly` modes.
- Hidden at phone widths and short coarse-pointer landscape sizes.
- Normally fixed to the lower-right.
- In Focus mode, `.page-shell.is-focus-mode ~ .ai-help-chat` moves the launcher and panel to the lower-left.

The lower-right is reserved for `.focus-mode-brand`, so AI Help does not cover the app watermark.''',
          )

          agents = Path('AGENTS.md')
          replace_once(
              agents,
              '''- **Pawn Level** beginner curriculum (5 modules, 50+ static HTML pages)
- **Bishop Level** post-beginner curriculum (Module 1 published, 5 lesson pages)
- **Numbered endgame lessons** (7 chapter pages with embedded SPA iframe)''',
              '''- **Pawn Level** beginner curriculum (5 modules)
- **Advanced Pawn Level** curriculum (12 modules)
- **Bishop Level** post-beginner/intermediate curriculum (15 modules, 19 lesson pages)
- **Numbered endgame lessons** (7 chapter pages with embedded SPA iframe)
- **AI Help** browser panel backed by a separately deployed Cloudflare Worker and Gemini''',
          )
          replace_once(
              agents,
              '''When in doubt about module structure, read `lessons/pawn-index.html` or
  `lessons/bishop-index.html`.''',
              '''When in doubt about module structure, read `lessons/pawn-index.html`,
  `lessons/advanced-pawn-index.html`, or `lessons/bishop-index.html`.''',
          )
          replace_once(
              agents,
              '''| **Pawn lessons** | `lessons/pawn-*.html`, `lessons/pawn-m{2,3,4,5}-*.html`, `lessons/pawn-index.html` |
| **Bishop lessons** | `lessons/bishop-*.html`, `lessons/bishop_m1/` |''',
              '''| **Pawn lessons** | `lessons/pawn-*.html`, `lessons/pawn-m{2,3,4,5}-*.html`, `lessons/pawn-index.html` |
| **Advanced Pawn lessons** | `lessons/advanced-pawn-m*-lesson-*.html`, `lessons/advanced-pawn-module-*-data.js`, `lessons/advanced-pawn-index.html` |
| **Bishop lessons** | `lessons/bishop-m*-lesson-*.html`, `lessons/bishop-index.html`, `lessons/bishop_m1/` |
| **AI Help client** | `ai-help-chat.mjs`, `ai-help-chat.css`, `ai-help-config.mjs`, `ai-help-icon.mjs` |
| **AI Help Worker** | `worker/ai-help-worker.js`, `worker/wrangler.jsonc` |''',
          )
          replace_section(
              agents,
              '## Bishop Lesson Conventions',
              '## Lesson Position Builder Conventions',
              '''## Bishop Lesson Conventions

- **Table of contents:** `lessons/bishop-index.html`
- **Naming pattern:** `bishop-m{module}-lesson-{NN}-*.html`
- **Current curriculum:** 15 modules and 19 lesson pages. Never infer totals from this document; verify the index.
- **Module 1 image assets:** `lessons/bishop_m1/` with `intermediate-m1-` filenames.
- **Shared lesson systems:** Bishop pages may use `endgame-lesson.css`, `endgame-lesson.js`, `lesson-header.css`, `lesson-presentation.js`, `lesson-presentation.css`, and the Teacher Board helpers.
- **Legacy markup:** Module 1 pages differ from later generated/FEN-laboratory pages. Audit all Bishop pages when changing shared headers or presentation scene collection.
- **Presentation mode:** Collect intentional top-level lesson sections and direct position cards only. Do not turn nested candidate cards, student tasks, error notes, or transfer rules into standalone scenes. Browser-test representative legacy and recent modules.
- **Navigation:** Preserve Back-to-Bishop-Index and sequential lesson links; validate all links after editing.

## AI Help Worker Conventions

- The browser client sends bounded context to the configured Cloudflare Worker `/chat` route. It must never call Gemini directly.
- Keep `GEMINI_API_KEY` only as a Cloudflare Worker secret. Never commit, print, document, or expose the key in browser code.
- Production currently runs at `https://cddigital.top`; keep both that origin and `https://www.cddigital.top` in `ALLOWED_ORIGINS` unless the deployment changes.
- Preserve the legacy GitHub Pages and localhost origins needed for fallback/local testing.
- Exact-origin CORS failures appear in browsers as generic fetch/network errors. Check the allowlist before blaming Gemini.
- Gemini requests use the Interactions endpoint at `/v1beta/interactions` and a plain model ID. Normalize away an optional `models/` prefix.
- Preserve bounded request sizes, history limits, context limits, rate limiting, `/health`, and sanitized public errors.
- A GitHub merge does not deploy Cloudflare. Worker changes require `cd worker` and `npx wrangler deploy` after review.
- After Worker changes, run `node --check worker/ai-help-worker.js`, verify Wrangler configuration, deploy, test `/health`, and send a live AI Help request from the production origin.

## Lesson Position Builder Conventions''',
          )
          replace_once(
              agents,
              '''- [ ] All shared assets load (CSS, JS, SVGs, fonts)
- [ ] No accidental changes were made outside the requested scope''',
              '''- [ ] All shared assets load (CSS, JS, SVGs, fonts)
- [ ] AI Help Worker changes preserve secrets, allowed origins, CORS preflight, `/health`, rate limits, and deployment instructions
- [ ] No accidental changes were made outside the requested scope''',
          )

          readme = Path('README.md')
          replace_section(
              readme,
              '## AI chess help',
              '## Lessons and files',
              '''## AI chess help

`ai-help-chat.mjs` mounts an optional floating Dyno Bot panel outside embedded/board-only mode. It can explain the visible board, plans, candidate moves, tactical ideas, lesson concepts, and supported app controls.

The browser sends bounded context to a Cloudflare Worker:

- lesson title
- current FEN and setup FEN
- opening name/ECO display
- active tab
- side-to-move and position labels
- visible notation, capped before transmission

```text
Browser → Cloudflare Worker /chat → Gemini Interactions API
```

The Gemini API key is never stored in the static site. It exists only as the Worker's `GEMINI_API_KEY` secret. The browser endpoint comes from `ai-help-config.mjs` or the local testing key `chess-study-ai-endpoint-v1`.

The Worker implementation is in `worker/ai-help-worker.js`; deployment configuration is in `worker/wrangler.jsonc`. It provides:

- `POST /chat` for AI requests
- `GET /health` for origin-aware connectivity checks
- exact-origin CORS validation
- request/context limits
- per-client rate limiting
- normalized public error responses

Current allowed production origins are `https://cddigital.top` and `https://www.cddigital.top`. The old GitHub Pages origin and localhost origins remain available for fallback/development.

### Deploy or update the Worker

Merging Worker code does not update the running Cloudflare deployment.

```powershell
cd worker
npx wrangler login
npx wrangler deploy
```

The existing secret normally remains attached. Set it only if Cloudflare reports it missing:

```powershell
npx wrangler secret put GEMINI_API_KEY
npx wrangler deploy
```

Never commit the API key.

### AI Help troubleshooting

- **`NetworkError when attempting to fetch resource`**: check Worker deployment, Worker URL, DNS/TLS, and `ALLOWED_ORIGINS`; this usually occurs before Gemini is contacted.
- **Busy/temporary error**: wait briefly; rate limiting or Gemini capacity may be involved.
- **Configuration error**: confirm the Worker secret and configured model.
- **Timeout**: the client aborts after 45 seconds.

The floating AI-help control is hidden on phone-width layouts and short coarse-pointer landscape screens so it does not cover board controls. In Focus mode it moves to the lower-left, leaving the lower-right watermark unobstructed. It is disabled in `?embed=1` and board-only modes.''',
          )
          replace_once(
              readme,
              '''| `ai-help-icon.mjs` | Embedded launcher icon data |
| `vendor/chess.js` | Chess rules, legal moves, FEN, PGN support |''',
              '''| `ai-help-icon.mjs` | Embedded launcher icon data |
| `worker/ai-help-worker.js` | Cloudflare Worker CORS, validation, rate limiting, Gemini proxy, `/chat`, and `/health` |
| `worker/wrangler.jsonc` | Worker deployment variables, production origins, model, and rate-limit binding |
| `vendor/chess.js` | Chess rules, legal moves, FEN, PGN support |''',
          )
          replace_once(
              readme,
              '''node --check app.js
node --check ai-help-chat.mjs
node tools/test-puzzle-api.mjs''',
              '''node --check app.js
node --check ai-help-chat.mjs
node --check worker/ai-help-worker.js
node tools/test-puzzle-api.mjs''',
          )

          guide = Path('USER_GUIDE.md')
          replace_once(
              guide,
              'https://coachdinosaur.github.io/chess-study/',
              'https://cddigital.top/',
          )
          replace_section(
              guide,
              '## Explain the Current Position with AI Help',
              '## Add a Lesson Note',
              '''## Explain the Current Position with AI Help

> **Where to go:** **AI Help** button at the bottom-right on supported desktop-sized layouts

The AI receives a bounded snapshot of the visible lesson title, current FEN, setup FEN, active tab, side to move, opening information, position label, and notation excerpt. It does not receive your saved files, unrelated browser data, or the Gemini API key.

Useful questions include:

- “Explain this position.”
- “What should White look for?”
- “What changed after the last move?”
- “Give me a small hint.”
- “How do I import a PGN?”

AI can make mistakes. Verify concrete tactics with Stockfish and verify app instructions against this guide.

### When the AI Help button is hidden

The floating control is intentionally hidden:

- on phone-width screens;
- on short landscape touch screens;
- in embedded or board-only mode.

This prevents the panel from covering board and classroom controls. Use a wider desktop/tablet layout for AI Help.

### AI Help connection errors

If the panel says it could not reach the AI service:

1. Confirm that the main app is open at `https://cddigital.top/`.
2. Confirm that the rest of the internet connection works.
3. Reload once and try a short message such as “hello.”
4. If the message contains `NetworkError when attempting to fetch resource`, the problem is usually the AI Worker URL, Worker deployment, DNS/TLS, or the production-domain CORS allowlist. It is not caused by the chess position.
5. If the message says the service is busy or there are too many requests, wait about a minute and retry.
6. If requests repeatedly time out, try again later and report the exact displayed message.

Do not paste an API key into the chat or browser console. The Gemini key belongs only in the private Cloudflare Worker secret. The Worker must be redeployed separately after its code or allowed-origin configuration changes.

---

## Add a Lesson Note''',
          )

          for path in (architecture, agents, readme, guide):
              text = path.read_text(encoding='utf-8')
              if '\r\n' in text:
                  raise SystemExit(f'{path}: unexpected CRLF after patch')
              if not text.endswith('\n'):
                  path.write_text(text + '\n', encoding='utf-8')
          PY

      - name: Validate documentation
        run: |
          node --check worker/ai-help-worker.js
          git diff --check
          grep -q 'https://cddigital.top/' USER_GUIDE.md
          grep -q '/v1beta/interactions' ARCHITECTURE.md
          grep -q 'AI Help Worker Conventions' AGENTS.md
          grep -q 'GET /health' README.md

      - name: Remove one-time workflow
        run: rm .github/workflows/update-ai-help-docs.yml

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE.md AGENTS.md README.md USER_GUIDE.md .github/workflows/update-ai-help-docs.yml
          git commit -m "Update AI Help architecture and usage documentation"
          git push origin HEAD:agent/update-ai-help-documentation
