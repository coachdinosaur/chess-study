name: Apply Sicilian page 6 Qg2 navigation fix

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page6-qg2-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Correct Qg2 and add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter_path = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          chapter = chapter_path.read_text(encoding='utf-8')
          old = '13.Qxa6 (13.Bg2 g6 14.0-0 Bg7 15.Bxa6 0-0 16.Bd3 Qc8∞)'
          new = '13.Qxa6 (13.Qg2 g6 14.0-0 Bg7 15.Bxa6 0-0 16.Bd3 Qc8∞)'
          count = chapter.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one mistranscribed Page 6 variation, found {count}')
          chapter_path.write_text(chapter.replace(old, new, 1), encoding='utf-8')

          tests_path = Path('apps/opening-book-sicilian/tests/chapter-workflow.test.mjs')
          tests = tests_path.read_text(encoding='utf-8')
          marker = 'test("move navigation survives PDF page and parenthesis boundaries", () => {'
          regression = '''test("the Page 6 Qg2 variation stays on one legal navigation path", () => {
  const resolver = new MarkdownMoveResolver();
  resolver.setAnchor(
    "r2qkb1r/pp1bpppp/2n5/8/2Q5/2N3P1/PPP2P1P/R1B1KB1R b KQkq - 2 9",
    "After 9.Qc4",
  );

  const tokens = resolver.resolveText(
    "9...Be6! 10.Qb5 (10.Qa4 Qd4=) 10...a6! 11.Qxb7 Nd4 12.Bd3 Rb8 13.Qxa6 (13.Qg2 g6 14.0-0 Bg7 15.Bxa6 0-0 16.Bd3 Qc8∞) 13...Nf3+ 14.Kd1 Ne5∞",
  );

  assert.ok(tokens.every((token) => token.navigation), "Every move in the Page 6 variation should be navigable.");
  const qg2 = tokens.find((token) => token.display === "13.Qg2");
  const castlings = tokens.filter((token) => token.display === "0-0");
  const bd3 = tokens.filter((token) => token.display === "16.Bd3").at(-1);
  const qc8 = tokens.find((token) => token.display === "Qc8");

  assert.ok(qg2?.navigation, "13.Qg2 should start the alternative from before 13.Qxa6.");
  assert.equal(castlings.length, 2, "The variation should contain White and Black castling once each.");
  assert.ok(castlings.every((token) => token.navigation), "Both castling moves should be navigable.");
  assert.ok(bd3?.navigation, "16.Bd3 should continue after Black castles.");
  assert.ok(qc8?.navigation, "Qc8 should continue after 16.Bd3.");
  assert.deepEqual(
    qc8.navigation.steps.slice(-8).map((step) => step.label),
    ["13.Qg2", "g6", "14.0-0", "Bg7", "15.Bxa6", "0-0", "16.Bd3", "Qc8"],
  );
});

'''
          if regression.strip() not in tests:
              if marker not in tests:
                  raise SystemExit('Could not find regression-test insertion point')
              tests = tests.replace(marker, regression + marker, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

          git diff --check

      - name: Install and test Sicilian app
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page6-qg2-fix.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md \
                  apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          git diff --cached --check
          git commit -m "Fix Sicilian page 6 Qg2 variation navigation"
          git push origin HEAD:wip/sicilian-20260805-153931
