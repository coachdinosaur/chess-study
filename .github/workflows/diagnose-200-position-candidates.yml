name: Diagnose 200-puzzle candidate merge

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-200-position-candidates.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-100-position-training-puzzles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate candidate pool
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/banflam/chess-trainer/main/puzzles_subset.csv \
            --output /tmp/lichess-puzzles-subset.csv
          rm -rf /tmp/position-training-candidates
          node tools/build-lichess-position-training.mjs \
            --input /tmp/lichess-puzzles-subset.csv \
            --output /tmp/position-training-candidates \
            --limit 500 \
            --shard-size 100 \
            --min-rating 0 \
            --max-rating 4000 \
            --min-popularity 0 \
            --min-plays 0
      - name: Record overlap diagnostics
        run: |
          mkdir -p proof/logs
          node --input-type=module <<'NODE' > proof/logs/lichess-200-candidate-diagnostic.txt 2>&1
          import fs from 'node:fs';
          import path from 'node:path';

          function loadDataset(directory) {
            const manifest = JSON.parse(fs.readFileSync(path.join(directory, 'manifest.json'), 'utf8'));
            const records = [];
            for (const shard of manifest.shards || []) {
              const payload = JSON.parse(fs.readFileSync(path.join(directory, shard.file), 'utf8'));
              records.push(...(Array.isArray(payload) ? payload : payload.puzzles || []));
            }
            return { manifest, records };
          }

          const baseline = loadDataset('assets/puzzles/lichess-position-training');
          const candidates = loadDataset('/tmp/position-training-candidates');
          const baselineIds = new Set(baseline.records.map((record) => record.id));
          const baselineFens = new Set(baseline.records.map((record) => record.startFen));
          const candidateIds = new Set();
          const candidateFens = new Set();
          let idOverlap = 0;
          let fenOverlap = 0;
          let candidateDuplicateIds = 0;
          let candidateDuplicateFens = 0;
          const additions = [];
          const seenIds = new Set(baselineIds);
          const seenFens = new Set(baselineFens);

          for (const record of candidates.records) {
            if (candidateIds.has(record.id)) candidateDuplicateIds += 1;
            candidateIds.add(record.id);
            if (candidateFens.has(record.startFen)) candidateDuplicateFens += 1;
            candidateFens.add(record.startFen);
            if (baselineIds.has(record.id)) idOverlap += 1;
            if (baselineFens.has(record.startFen)) fenOverlap += 1;
            if (!record?.id || seenIds.has(record.id)) continue;
            if (!record?.startFen || seenFens.has(record.startFen)) continue;
            additions.push(record);
            seenIds.add(record.id);
            seenFens.add(record.startFen);
          }

          console.log(`Baseline manifest count: ${baseline.manifest.count}`);
          console.log(`Baseline loaded records: ${baseline.records.length}`);
          console.log(`Baseline unique IDs: ${baselineIds.size}`);
          console.log(`Baseline unique FENs: ${baselineFens.size}`);
          console.log(`Candidate manifest count: ${candidates.manifest.count}`);
          console.log(`Candidate loaded records: ${candidates.records.length}`);
          console.log(`Candidate unique IDs: ${candidateIds.size}`);
          console.log(`Candidate unique FENs: ${candidateFens.size}`);
          console.log(`Candidate duplicate IDs: ${candidateDuplicateIds}`);
          console.log(`Candidate duplicate FENs: ${candidateDuplicateFens}`);
          console.log(`Baseline ID overlaps: ${idOverlap}`);
          console.log(`Baseline FEN overlaps: ${fenOverlap}`);
          console.log(`Eligible unique additions: ${additions.length}`);
          console.log(`First eligible IDs: ${additions.slice(0, 10).map((record) => record.id).join(', ')}`);
          NODE
          cat proof/logs/lichess-200-candidate-diagnostic.txt
      - name: Commit diagnostics and remove temporary workflow
        run: |
          rm -f .github/workflows/diagnose-200-position-candidates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proof/logs/lichess-200-candidate-diagnostic.txt .github/workflows/diagnose-200-position-candidates.yml
          git commit -m 'Record position-training candidate diagnostics'
          git push origin HEAD:agent/add-100-position-training-puzzles
