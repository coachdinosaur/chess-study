name: Fix documentation heading duplicates

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix-headings:
    if: github.head_ref == 'agent/update-ai-help-documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-ai-help-documentation
          fetch-depth: 0

      - name: Remove duplicated headings
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('AGENTS.md'): (
                  '## Lesson Position Builder Conventions\n\n## Lesson Position Builder Conventions',
                  '## Lesson Position Builder Conventions',
              ),
              Path('USER_GUIDE.md'): (
                  '## Add a Lesson Note\n\n## Add a Lesson Note',
                  '## Add a Lesson Note',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one duplicated heading, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          test "$(grep -c '^## Lesson Position Builder Conventions$' AGENTS.md)" -eq 1
          test "$(grep -c '^## Add a Lesson Note$' USER_GUIDE.md)" -eq 1

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-doc-heading-duplicates.yml

      - name: Commit heading cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md USER_GUIDE.md .github/workflows/fix-doc-heading-duplicates.yml
          git commit -m "Remove duplicated documentation headings"
          git push origin HEAD:agent/update-ai-help-documentation
