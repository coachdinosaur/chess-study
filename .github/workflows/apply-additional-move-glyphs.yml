name: Apply additional move glyphs

on:
  push:
    branches:
      - feature/additional-move-glyphs
    paths:
      - 'tools/apply_additional_move_glyphs.py'
      - '.github/workflows/apply-additional-move-glyphs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/apply_additional_move_glyphs.py'
      - '.github/workflows/apply-additional-move-glyphs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/additional-move-glyphs
          fetch-depth: 1
          show-progress: false

      - name: Apply UI and documentation changes
        id: apply
        shell: bash
        run: |
          set +e
          python tools/apply_additional_move_glyphs.py > patch.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: additional-glyph-patch-log
          path: patch.log
          if-no-files-found: error

      - name: Stop after patch failure
        if: steps.apply.outputs.status != '0'
        run: |
          cat patch.log
          exit 1

      - name: Validate glyph support
        run: |
          node --check app.js
          node --check pgn.mjs
          node --check move-annotations.mjs
          node --test tests/move-annotations.test.mjs
          node --test tests/lesson-data-foundation.test.mjs
          node --test tests/lesson-position-interoperability.test.mjs
          node --test tests/lesson-variation-tree.test.mjs

      - name: Commit generated changes
        run: |
          rm -f patch.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css README.md USER_GUIDE.md
          git commit -m "Expand move annotation glyphs"
          git push origin HEAD:feature/additional-move-glyphs
