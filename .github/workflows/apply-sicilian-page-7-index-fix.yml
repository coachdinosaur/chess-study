name: Apply Sicilian Page 7 index correction

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page-7-index-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Correct Page 7 variation hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          text = chapter.read_text(encoding='utf-8')
          old = '''D) 2.Na3 (page 13)
              D1) 2...Nc6 3.Bb5 (page 13)
              D2) 2...Nc6 3.Nf3 (page 14)'''
          new = '''D) 2.Na3 Nc6 (page 13)
              D1) 3.Bb5 (page 13)
              D2) 3.Nf3 (page 14)'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one old Page 7 hierarchy, found {text.count(old)}')
          chapter.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('apps/opening-book-sicilian/tests/chapter-workflow.test.mjs')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'test("Chapter 1 retains PDF-corrected moves and source references", async () => {'
          regression = '''test("Chapter 1 Page 7 matches the PDF variation hierarchy", async () => {\n  const markdown = await readChapterOne();\n  const start = markdown.indexOf("## Page 7");\n  const end = markdown.indexOf("## Page 8", start);\n  const pageSeven = markdown.slice(start, end);\n\n  assert.match(pageSeven, /D\) 2\.Na3 Nc6 \(page 13\)[\s\S]*D1\) 3\.Bb5 \(page 13\)[\s\S]*D2\) 3\.Nf3 \(page 14\)/);\n  assert.doesNotMatch(pageSeven, /D\) 2\.Na3 \(page 13\)[\s\S]*D1\) 2\.\.\.Nc6 3\.Bb5/);\n  assert.doesNotMatch(pageSeven, /Version:/);\n});\n\n'''
          if regression.strip() not in test_text:
              if marker not in test_text:
                  raise SystemExit('Could not find regression insertion point')
              test_text = test_text.replace(marker, regression + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

          git diff --check

      - name: Install and test Sicilian app
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page-7-index-fix.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md \
                  apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          git diff --cached --check
          git commit -m "Fix Sicilian Page 7 variation index"
          git push origin HEAD:wip/sicilian-20260805-153931
