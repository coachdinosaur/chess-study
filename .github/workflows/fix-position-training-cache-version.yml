name: Fix position training cache version

on:
  push:
    branches:
      - agent/fix-position-training-cache-version
    paths:
      - .github/workflows/fix-position-training-cache-version.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump module cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = './focus-analysis-popup.mjs?v=20260719-focus-analysis3'
          new = './focus-analysis-popup.mjs?v=20260725-position-training2'
          if old not in text:
              raise SystemExit(f'Expected script URL not found: {old}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-position-training-cache-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-position-training-cache-version.yml
          git commit -m "Bust cache for Lichess position training launcher [skip ci]"
          git push origin HEAD:agent/fix-position-training-cache-version
