name: Expand Lichess position training to 1000

on:
  pull_request:
    paths:
      - 'scripts/expand-lichess-position-training.mjs'
      - '.github/workflows/expand-lichess-position-training-to-1000.yml'

permissions:
  contents: write

concurrency:
  group: lichess-1000-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  expand-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out expansion branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Zstandard
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Download a partial official Lichess puzzle export
        run: |
          curl --fail --location --retry 3 --range 0-33554431 \
            https://database.lichess.org/lichess_db_puzzle.csv.zst \
            --output /tmp/lichess_db_puzzle.partial.csv.zst
          set +e
          zstd -dc /tmp/lichess_db_puzzle.partial.csv.zst > /tmp/lichess-puzzles.csv
          decode_status=$?
          set -e
          test -s /tmp/lichess-puzzles.csv
          line_count=$(wc -l < /tmp/lichess-puzzles.csv)
          echo "Partial decoder status: ${decode_status}"
          echo "Decompressed CSV rows available: ${line_count}"
          test "${line_count}" -ge 2000

      - name: Add 500 unique validated puzzles
        run: node scripts/expand-lichess-position-training.mjs /tmp/lichess-puzzles.csv 500

      - name: Run position-training and assignment tests
        run: |
          mapfile -t position_tests < <(find tests -maxdepth 1 -type f -name '*lichess-position-training*.test.mjs' -print | sort)
          test "${#position_tests[@]}" -gt 0
          node --test "${position_tests[@]}" tests/puzzle-assignment-core.test.mjs \
            2>&1 | tee proof/logs/lichess-1000-tests-output.txt

      - name: Verify production dataset
        run: |
          node --check lichess-position-training.mjs
          node --check lichess-position-training-data.mjs
          node --check lichess-position-training-core.mjs
          node --check management/js/puzzle-assignment-core.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = 'assets/puzzles/lichess-position-training';
          const manifest = JSON.parse(fs.readFileSync(`${dir}/manifest.json`, 'utf8'));
          if (manifest.count !== 1000) throw new Error(`Expected 1000 puzzles, found ${manifest.count}`);
          if (manifest.shards.length !== 40) throw new Error(`Expected 40 shards, found ${manifest.shards.length}`);
          let count = 0;
          const ids = new Set();
          const positions = new Set();
          for (const shard of manifest.shards) {
            const data = JSON.parse(fs.readFileSync(`${dir}/${shard.file}`, 'utf8'));
            if (data.puzzles.length !== shard.count) throw new Error(`${shard.file} count mismatch`);
            count += data.puzzles.length;
            for (const puzzle of data.puzzles) {
              if (ids.has(puzzle.id)) throw new Error(`Duplicate ID ${puzzle.id}`);
              ids.add(puzzle.id);
              const key = puzzle.startFen.split(/\s+/).slice(0, 4).join(' ');
              if (positions.has(key)) throw new Error(`Duplicate starting position ${puzzle.id}`);
              positions.add(key);
              for (const forbidden of ['moves', 'solution', 'solutionMoves', 'continuation', 'line', 'bestMove', 'expectedMove', 'expectedMoves']) {
                if (Object.hasOwn(puzzle, forbidden)) throw new Error(`${puzzle.id} stores forbidden continuation field ${forbidden}`);
              }
            }
          }
          if (count !== 1000 || ids.size !== 1000 || positions.size !== 1000) {
            throw new Error(`Dataset cardinality mismatch: count=${count}, ids=${ids.size}, positions=${positions.size}`);
          }
          console.log('Production dataset verification: PASS');
          NODE
          git diff --check

      - name: Commit production data and remove temporary machinery
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm scripts/expand-lichess-position-training.mjs
          rm .github/workflows/expand-lichess-position-training-to-1000.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add 500 more validated Lichess position puzzles'
          git push origin "HEAD:${HEAD_BRANCH}"
