name: Expand Lichess puzzle library to 30000

on:
  push:
    branches: [agent/add-20000-more-lichess-puzzles]
    paths: [.github/workflows/expand-lichess-30000.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-20000-more-lichess-puzzles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate, validate, document, and commit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          mkdir -p scripts proof/logs
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/coachdinosaur/chess-study/cb8ff0a8d549f13af85380c5d4315c3a1ec75be7/scripts/expand-lichess-5000.mjs \
            --output scripts/expand-lichess-30000.mjs
          sed -i \
            -e 's/const START_COUNT = 2000;/const START_COUNT = 10000;/' \
            -e 's/const ADD_COUNT = 3000;/const ADD_COUNT = 20000;/' \
            -e 's/Lichess 5,000-puzzle/Lichess 30,000-puzzle/g' \
            -e 's/lichess-5000-/lichess-30000-/g' \
            scripts/expand-lichess-30000.mjs
          grep -q 'const START_COUNT = 10000;' scripts/expand-lichess-30000.mjs
          grep -q 'const ADD_COUNT = 20000;' scripts/expand-lichess-30000.mjs

          set +e
          set +o pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://database.lichess.org/lichess_db_puzzle.csv.zst \
            | zstd -dc \
            | node scripts/expand-lichess-30000.mjs 2>&1 \
            | tee proof/logs/lichess-30000-generator-output.txt
          statuses=("${PIPESTATUS[@]}")
          set -e
          set -o pipefail
          test "${statuses[2]}" -eq 0
          test "${statuses[3]}" -eq 0

          node scripts/expand-lichess-30000.mjs --validate-only \
            | tee proof/logs/lichess-30000-validator-output.txt

          mapfile -t test_files < <(find tests -maxdepth 1 -type f \
            \( -name '*lichess-position-training*.test.mjs' -o -name 'puzzle-assignment-core.test.mjs' \) \
            | sort)
          test "${#test_files[@]}" -gt 0
          node --test "${test_files[@]}" \
            | tee proof/logs/lichess-30000-tests-output.txt

          python - <<'PY'
          from pathlib import Path

          def swap(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: missing {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          swap('README.md', 'current production library of 10,000 validated Lichess-derived positions', 'current production library of 30,000 validated Lichess-derived positions')
          swap('README.md', 'backed by 10,000 validated Lichess-derived positions in 400 shards of 25 records', 'backed by 30,000 validated Lichess-derived positions in 1,200 shards of 25 records')
          swap('README.md', 'Production manifest and 400 immutable 25-puzzle shards (10,000 positions)', 'Production manifest and 1,200 immutable 25-puzzle shards (30,000 positions)')
          swap('README.md', '- [LICHESS_POSITION_TRAINING.md](LICHESS_POSITION_TRAINING.md)\n- [LOCAL_DEPLOYMENT.md](LOCAL_DEPLOYMENT.md)', '- [LICHESS_POSITION_TRAINING.md](LICHESS_POSITION_TRAINING.md)\n- [MINI_SOFT_LAUNCH.md](MINI_SOFT_LAUNCH.md)\n- [LOCAL_DEPLOYMENT.md](LOCAL_DEPLOYMENT.md)')
          swap('USER_GUIDE.md', '10,000 Lichess-derived positions', '30,000 Lichess-derived positions')
          swap('ARCHITECTURE.md', 'plus 400 shard files', 'plus 1,200 shard files')
          swap('ARCHITECTURE.md', '- 10,000 puzzles', '- 30,000 puzzles')
          swap('ARCHITECTURE.md', '- 400 sequential shards', '- 1,200 sequential shards')
          swap('management/README.md', 'currently 10,000 puzzles across 400 shards', 'currently 30,000 puzzles across 1,200 shards')
          swap('LICHESS_POSITION_TRAINING.md', '10,000', '30,000', 2)
          swap('LICHESS_POSITION_TRAINING.md', '| Shards | 400 |', '| Shards | 1,200 |')
          swap('LICHESS_POSITION_TRAINING.md', '| Last shard | `shard-0399.json` |', '| Last shard | `shard-1199.json` |')
          swap('LICHESS_POSITION_TRAINING.md', 'lichess-10000-', 'lichess-30000-')

          Path('MINI_SOFT_LAUNCH.md').write_text('''# Mini Soft Launch: 30,000 Lichess Puzzles

The 30,000-puzzle release is the mini soft-launch baseline for Lichess Position Training and teacher-managed puzzle assignments.

## Launch scope

This is a limited release for a manageable group of real teachers and students, not broad public promotion. It covers:

- 30,000 validated Lichess-derived positions;
- 1,200 immutable shards with 25 positions each;
- manifest-driven counts and on-demand loading;
- fixed and adaptive modes, progressive hints, and Mistake Review;
- terminal checkmate/draw grading before engine evaluation;
- stable desktop, tablet, and mobile layouts;
- frozen teacher assignments, secure student links, progress, archive/restore, duplication, and deletion.

## Readiness checks

1. Confirm `main` reports 30,000 puzzles and 1,200 shards.
2. Confirm the deployed trainer displays “30,000 Lichess puzzles available.”
3. Sample low, medium, and high ratings across several themes.
4. Verify delivered checkmate succeeds without an engine request.
5. Verify feedback does not resize or collapse the board.
6. Generate, preview, publish, and complete a test assignment.
7. Verify teacher progress and scores update.
8. Verify archive, restore, duplicate, replacement-link, and permanent deletion.
9. Test Firefox, Chromium, and at least one phone or tablet.
10. Confirm migration 010, RLS, backups, and production configuration.

## Monitor during launch

Track puzzle IDs reported as incorrectly graded, engine/tablebase failures, empty filters, layout defects, assignment-link or progress-sync failures, IndexedDB/browser-storage failures, and confusion about objectives or hints. Record the puzzle ID, browser, device, move, and screenshot. “It failed somehow” is emotionally valid but diagnostically decorative.

## Boundaries

- Free-trainer learning is browser-local, not account-synchronized.
- Assignment progress is stored in Supabase and requires the private link.
- Library growth does not alter frozen published assignments.
- Merging does not prove the public deployment has completed.
- This is a limited operational test, not completion of every legal, commercial, support, monitoring, and recovery requirement.
''', encoding='utf-8')
          PY

          git diff --check
          node - <<'NODE'
          const m = require('./assets/puzzles/lichess-position-training/manifest.json');
          if (m.count !== 30000 || m.shards.length !== 1200 || m.shardSize !== 25) process.exit(1);
          if (m.shards[0]?.file !== 'shard-0000.json' || m.shards.at(-1)?.file !== 'shard-1199.json') process.exit(1);
          console.log('Puzzles:', m.count, 'Shards:', m.shards.length);
          NODE
          test -f assets/puzzles/lichess-position-training/shard-0400.json
          test -f assets/puzzles/lichess-position-training/shard-1199.json
          test -f MINI_SOFT_LAUNCH.md
          grep -q '30,000' README.md USER_GUIDE.md ARCHITECTURE.md management/README.md LICHESS_POSITION_TRAINING.md MINI_SOFT_LAUNCH.md

          rm scripts/expand-lichess-30000.mjs
          rm .github/workflows/expand-lichess-30000.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add 20000 more Lichess puzzles for mini soft launch"
          git push origin HEAD:agent/add-20000-more-lichess-puzzles

# Recovery trigger after PR #88 was merged before generation.
