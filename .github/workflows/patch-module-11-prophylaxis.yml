name: Patch Module 11 prophylaxis definition

on:
  push:
    branches:
      - agent/define-prophylaxis-module-11
    paths:
      - .github/workflows/patch-module-11-prophylaxis.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/define-prophylaxis-module-11
          fetch-depth: 0

      - name: Expand the prophylaxis explanation
        shell: python
        run: |
          from pathlib import Path

          lesson = Path('lessons/bishop-m11-lesson-01-finding-weaknesses-fen-laboratory.html')
          text = lesson.read_text(encoding='utf-8')

          old_history = "<article class='master-card'><h3>Tigran Petrosian</h3><p>Prophylaxis can prevent the opponent’s freeing plan before the attack on a weakness even begins.</p></article>"
          new_history = "<article class='master-card'><h3>Tigran Petrosian</h3><p><strong>Prophylaxis</strong> is the strategic process of identifying the opponent’s most useful intended move or plan and acting before it happens to prevent it, weaken it, delay it, or make it harmless. The practical question is: <strong>If I passed my turn, what would my opponent do next?</strong> Typical targets include freeing pawn breaks, favorable exchanges, occupation of an outpost, improvement of a restricted piece, direct threats, and ways to repair a weakness. Prophylaxis is not passive waiting; a strong prophylactic move normally improves your own position while reducing the opponent’s counterplay.</p></article>"

          old_glossary = "<article class='concept-card'><h3>Freeing break</h3><p>A pawn move that repairs a cramped or weak position by opening lines, exchanging a target, or activating pieces.</p></article>"
          new_glossary = "<article class='concept-card'><h3>Prophylaxis</h3><p>Anticipating the opponent’s best plan and preventing, weakening, delaying, or neutralizing it before continuing with your own plan. In weakness play, this often means stopping the freeing move that would let a target advance, exchange, or escape.</p></article>" + old_glossary

          if old_history not in text:
              raise SystemExit('Petrosian prophylaxis sentence was not found')
          if old_glossary not in text:
              raise SystemExit('Glossary insertion point was not found')

          text = text.replace(old_history, new_history, 1)
          text = text.replace(old_glossary, new_glossary, 1)
          lesson.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/patch-module-11-prophylaxis.yml')
          workflow.unlink()

      - name: Commit the focused lesson update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/bishop-m11-lesson-01-finding-weaknesses-fen-laboratory.html .github/workflows/patch-module-11-prophylaxis.yml
          git commit -m "Define prophylaxis in Bishop Module 11"
          git push origin HEAD:agent/define-prophylaxis-module-11
