name: Apply Bishop presentation v3

on:
  push:
    branches:
      - agent/fix-bishop-presentation-v3
    paths:
      - .github/bishop-presentation-v3-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-bishop-presentation-v3
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_bishop_presentation.py
      - name: Validate JavaScript
        run: node --check lessons/lesson-presentation.js
      - name: Commit repair
        run: |
          rm -f .github/bishop-presentation-v3-trigger
          rm -f .github/scripts/fix_bishop_presentation.py
          rm -f .github/workflows/apply-bishop-presentation-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Bishop presentation loading and scene selection"
          git push origin HEAD:agent/fix-bishop-presentation-v3
