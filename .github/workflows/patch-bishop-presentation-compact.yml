name: Patch compact Bishop presentation layouts

on:
  push:
    branches:
      - agent/improve-bishop-presentation-mode

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-bishop-presentation-mode
          fetch-depth: 0
      - name: Add compact position presentation support
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('lessons/lesson-presentation.js')
          js = js_path.read_text()
          old = '''if (scene.querySelector(".board, .chessboard, .board-grid, .board-iframe")) {
          scene.classList.add("presentation-board-scene");
          }
          if (scene.matches(".weakness-grid, .question-grid, .process-grid, .objective-grid, .checklist")) {'''
          new = '''if (scene.querySelector(".board, .chessboard, .board-grid, .board-iframe")) {
          scene.classList.add("presentation-board-scene");
          }
          if (
          bishopLesson &&
          scene.matches(".position") &&
          !scene.querySelector(".position-body") &&
          scopedQuery(scene, "> .diagram").length
          ) {
          scene.classList.add("presentation-compact-position-scene");
          }
          if (scene.matches(".weakness-grid, .question-grid, .process-grid, .objective-grid, .checklist")) {'''
          if old not in js:
              raise SystemExit('JavaScript patch marker not found')
          js_path.write_text(js.replace(old, new, 1))

          css_path = Path('lessons/lesson-presentation.css')
          css = css_path.read_text()
          marker = 'body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-position-scene .position-note{'
          compact = '''body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene{display:grid !important;grid-template-columns:minmax(420px,min(66vh,760px)) minmax(320px,1fr) !important;grid-template-areas:"context context" "label label" "board answer";gap:clamp(.75rem,1.8vw,1.5rem) clamp(1.35rem,3.5vw,3.5rem) !important;align-content:start !important;align-items:center !important;}body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene>.presentation-generated-context{grid-area:context;width:100%;}body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene>.position-label{grid-area:label;width:100%;}body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene>.diagram{grid-area:board;}body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene>details,body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene>.position-note,body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene>.rule-box{grid-area:answer;align-self:center;width:100%;margin:0 !important;}'''
          if marker not in css:
              raise SystemExit('CSS patch marker not found')
          css = css.replace(marker, compact + marker, 1)
          old_responsive = 'body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-position-scene .position-body{grid-template-columns:1fr !important;}'
          new_responsive = 'body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-position-scene .position-body,body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene{grid-template-columns:1fr !important;}body.lesson-presentation-bishop-page.lesson-presentation-active .presentation-current.presentation-compact-position-scene{grid-template-areas:"context" "label" "board" "answer";}'
          if old_responsive not in css:
              raise SystemExit('Responsive CSS patch marker not found')
          css_path.write_text(css.replace(old_responsive, new_responsive, 1))

          Path('.github/workflows/patch-bishop-presentation-compact.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/lesson-presentation.js lessons/lesson-presentation.css .github/workflows/patch-bishop-presentation-compact.yml
          git commit -m "Support compact Bishop presentation exercises"
          git push
