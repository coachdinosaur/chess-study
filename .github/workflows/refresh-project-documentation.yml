name: Refresh project documentation

on:
  push:
    branches:
      - agent/refresh-project-documentation

permissions:
  contents: write

concurrency:
  group: refresh-project-documentation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refresh-project-documentation
          fetch-depth: 0

      - name: Apply documentation refresh
        run: python3 scripts/refresh-project-documentation.py

      - name: Validate documentation
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re

          required = {
              'README.md': [
                  '## Static course lessons and Teacher Board',
                  '## Live Board',
                  'lessons/lesson-header.css',
                  'live-board-messages-v2.js',
              ],
              'ARCHITECTURE.md': [
                  '## 19. Live Board collaboration',
                  '## 22. Static lesson architecture',
                  'setSideToMove',
                  'live-board-session-ready',
              ],
              'AGENTS.md': [
                  '## Shared Lesson Header and Presentation Conventions',
                  '## Live Board Conventions',
                  'teacher-board-illegal-moves.mjs',
              ],
              'USER_GUIDE.md': [
                  '# Course Lessons, Presentation, and Teacher Board',
                  '# Live Board for Teacher and Student',
                  '**Side to move**',
                  '**Tools → Lessons**',
              ],
          }

          for filename, needles in required.items():
              text = Path(filename).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, f'{filename} missing {needle!r}'

          guide = Path('USER_GUIDE.md').read_text(encoding='utf-8')
          assert 'Tools → Line' not in guide
          assert '**Line**: review' not in guide

          # Validate local Markdown links in the four refreshed files.
          link_pattern = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          for filename in required:
              source = Path(filename)
              text = source.read_text(encoding='utf-8')
              for raw_target in link_pattern.findall(text):
                  target = raw_target.split('#', 1)[0].strip()
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  resolved = (source.parent / target).resolve()
                  assert resolved.exists(), f'{filename}: missing linked path {target}'

          # The documentation must describe real production files.
          production_paths = [
              'live-board.html',
              'live-board.js',
              'live-board-realtime.js',
              'live-board-messages-v2.js',
              'lessons/lesson-header.css',
              'lessons/lesson-presentation.js',
              'lessons/lesson-presentation.css',
              'lessons/pawn-teacher-board.js',
              'lessons/pawn-teacher-board.css',
              'lessons/teacher-board-illegal-moves.mjs',
          ]
          for item in production_paths:
              assert Path(item).exists(), f'documented production path missing: {item}'
          PY

      - name: Remove temporary refresh machinery
        run: |
          rm scripts/refresh-project-documentation.py
          rm .github/workflows/refresh-project-documentation.yml

      - name: Commit refreshed documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ARCHITECTURE.md AGENTS.md USER_GUIDE.md
          git add -u scripts/refresh-project-documentation.py .github/workflows/refresh-project-documentation.yml
          git diff --cached --check
          git commit -m "Refresh project documentation"
          git push origin HEAD:agent/refresh-project-documentation
