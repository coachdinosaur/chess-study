name: Fix Sicilian Page 13 layout

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/fix-sicilian-page13-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-page-13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Restore PDF Page 13 variation hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          text = chapter.read_text(encoding='utf-8')
          old = '16.Rd5 (16.Rd2 Ne5=) 16...Qe6='
          new = '''16.Rd5

          <!-- FEN: r1q2rk1/pp2ppbp/2n3p1/8/Q3B1b1/2N1B1P1/PPP2P1P/R2R2K1 w - - 12 16 -->
          16.Rd2 Ne5=

          <!-- FEN: r1q2rk1/pp2ppbp/2n3p1/3R4/Q3B1b1/2N1B1P1/PPP2P1P/R5K1 b - - 13 16 -->
          16...Qe6='''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one combined Page 13 variation, found {text.count(old)}')
          chapter.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_file = Path('apps/opening-book-sicilian/tests/chapter-workflow.test.mjs')
          tests = test_file.read_text(encoding='utf-8')
          old_test = '  assert.match(page, /16\\.Rd5 \\(16\\.Rd2 Ne5=\\) 16\\.\\.\\.Qe6=/);'
          new_test = '''  assert.match(page, /16\\.Rd5/);
            assert.match(page, /16\\.Rd2 Ne5=/);
            assert.match(page, /16\\.\\.\\.Qe6=/);
            assert.doesNotMatch(page, /16\\.Rd5 \\(16\\.Rd2/);'''
          if tests.count(old_test) != 1:
              raise SystemExit(f'Expected one old Page 13 assertion, found {tests.count(old_test)}')
          test_file.write_text(tests.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Test and build Sicilian app
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit correction and remove one-shot workflow
        run: |
          rm .github/workflows/fix-sicilian-page13-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md \
                  apps/opening-book-sicilian/tests/chapter-workflow.test.mjs \
                  .github/workflows/fix-sicilian-page13-layout.yml
          git commit -m "Preserve Sicilian Page 13 variation layout"
          git push origin HEAD:wip/sicilian-20260805-153931
