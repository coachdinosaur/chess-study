name: Refresh Bishop lesson board script

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bump-bishop-board-cache.yml

permissions:
  contents: write

jobs:
  bump-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump board script version for Bishop modules 2 through 10
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          pattern = re.compile(r'endgame-lesson\.js\?v=[^"\']+')

          for path in sorted(Path('lessons').glob('bishop-m*-lesson-*.html')):
              match = re.match(r'bishop-m(\d+)-lesson-', path.name)
              if not match:
                  continue
              module = int(match.group(1))
              if not 2 <= module <= 10:
                  continue

              source = path.read_text(encoding='utf-8')
              updated, count = pattern.subn('endgame-lesson.js?v=20260721-bishop-captured-half2', source)
              if count and updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No Bishop module script references were updated.')

          print('Updated:')
          for item in changed:
              print(f'- {item}')
          PY

      - name: Commit cache refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/bishop-m*-lesson-*.html
          git commit -m "Refresh Bishop lesson board script cache"
          git push
