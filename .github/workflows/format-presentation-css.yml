name: Format presentation stylesheet

on:
  push:
    branches:
      - agent/improve-bishop-presentation-mode

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-bishop-presentation-mode
          fetch-depth: 0
      - name: Format CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lessons/lesson-presentation.css')
          css = path.read_text().strip()
          lines = []
          token = ''
          indent = 0
          for char in css:
              token += char
              if char == '{':
                  lines.append('  ' * indent + token.strip())
                  token = ''
                  indent += 1
              elif char == ';':
                  lines.append('  ' * indent + token.strip())
                  token = ''
              elif char == '}':
                  before = token[:-1].strip()
                  if before:
                      lines.append('  ' * indent + before)
                  indent = max(0, indent - 1)
                  lines.append('  ' * indent + '}')
                  token = ''
          if token.strip():
              lines.append('  ' * indent + token.strip())
          path.write_text('\n'.join(lines) + '\n')
          Path('.github/workflows/format-presentation-css.yml').unlink()
          PY
      - name: Commit formatted CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/lesson-presentation.css .github/workflows/format-presentation-css.yml
          git commit -m "Format presentation stylesheet"
          git push
