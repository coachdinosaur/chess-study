name: Correct Pawn 03 board target

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/correct-pawn-03-board-target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/correct-pawn-03-board-target
          fetch-depth: 0

      - name: Correct the board selector and validate
        shell: bash
        run: |
          python tools/correct_pawn_03_board_target.py
          grep -q '.coordinate-board.master' lessons/pawn-03-files-ranks-diagonals.html
          grep -q 'width: min(100%, 520px);' lessons/pawn-03-files-ranks-diagonals.html
          ! grep -q 'Pawn 03: keep the floating interactive lesson board' lessons/pawn-03-files-ranks-diagonals.html
          git diff --check

      - name: Remove temporary files and commit
        shell: bash
        run: |
          rm -f tools/correct_pawn_03_board_target.py
          rm -f tools/trigger_pawn_03_board_correction.txt
          rm -f tools/README.tmp
          rm -f tools/.noop tools/.cleanup-marker tools/.last-noop tools/.test
          rm -f .github/workflows/correct-pawn-03-board-target.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct Pawn 03 board sizing target"
          git push origin HEAD:agent/correct-pawn-03-board-target
