name: Apply trainer grid cache bump

on:
  push:
    branches:
      - agent/fix-trainer-grid-rows

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-trainer-grid-rows
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/apply-trainer-grid-cache-bump.mjs
      - run: node --check focus-analysis-popup.mjs
      - run: node --check lichess-position-training-grid-layout.mjs
      - name: Commit generated cache bump
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump trainer grid layout cache"
          git push
