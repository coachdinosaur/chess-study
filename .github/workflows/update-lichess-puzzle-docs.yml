name: Update Lichess puzzle documentation

on:
  push:
    branches:
      - agent/update-lichess-puzzle-documentation
    paths:
      - .github/workflows/update-lichess-puzzle-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and run documentation updater
        shell: bash
        run: |
          git show d0b464871560b17c0f7c13494500bcc06a40fb5c:.github/workflows/update-lichess-puzzle-docs.yml > /tmp/original-doc-workflow.yml
          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/original-doc-workflow.yml').read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          script = []
          for line in lines[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/update_lichess_docs.py').write_text('\n'.join(script) + '\n', encoding='utf-8')
          PY
          python /tmp/update_lichess_docs.py

      - name: Validate documentation and current dataset
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('assets/puzzles/lichess-position-training/manifest.json').read_text(encoding='utf-8'))
          assert manifest['count'] == 10000
          assert len(manifest['shards']) == 400
          assert manifest['shardSize'] == 25
          assert manifest['shards'][0]['file'] == 'shard-0000.json'
          assert manifest['shards'][-1]['file'] == 'shard-0399.json'

          checks = {
              'README.md': ['10,000 validated Lichess-derived positions', 'LICHESS_POSITION_TRAINING.md', 'lichess-position-training-data.mjs'],
              'USER_GUIDE.md': ['# Puzzle Training', '10,000 Lichess-derived positions', 'Complete a Teacher Puzzle Assignment'],
              'ARCHITECTURE.md': ['### 14.2 Lichess Position Training runtime', '10,000 puzzles', '### 14.3 Teacher assignments'],
              'management/README.md': ['010_teacher_puzzle_assignments.sql', '## Teacher puzzle assignments', 'SHA-256 token hashes'],
              'LICHESS_POSITION_TRAINING.md': ['# Lichess Position Training', '| Puzzles | 10,000 |', '## Teacher-managed assignments'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, f'{path} is missing {needle!r}'
          PY
          git diff --check

      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/update-lichess-puzzle-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update Lichess puzzle and assignment documentation"
          git push origin HEAD:agent/update-lichess-puzzle-documentation
