name: Run play clock patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-fix-play-clock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-play-clock

      - name: Apply clock patch
        run: python .github/scripts/fix_play_clock.py

      - name: Validate JavaScript and diff
        run: |
          node --check app.js
          git diff --check

      - name: Commit patch branch
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-play-clock.yml
          git rm .github/scripts/fix_play_clock.py
          git add app.js styles.css
          git diff --cached --check
          git commit -m "Fix play clock fairness for bullet and blitz"
          git push origin HEAD:agent/fix-play-clock
