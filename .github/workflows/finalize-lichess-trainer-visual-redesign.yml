name: Finalize Lichess trainer visual redesign

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: agent/lichess-trainer-visual-redesign
          fetch-depth: 0

      - name: Force new stylesheet version
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lichess-position-training.mjs')
          text = path.read_text(encoding='utf-8')
          old = "const STYLE_URL = './lichess-position-training-desktop-fit.css?v=20260726-desktop-fit2';"
          new = "const STYLE_URL = './lichess-position-training-desktop-fit.css?v=20260726-visual-redesign3';"
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected stylesheet URL was not found.')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate redesign
        run: |
          node --check lichess-position-training.mjs
          python - <<'PY'
          from pathlib import Path

          css = Path('lichess-position-training-desktop-fit.css').read_text(encoding='utf-8')
          module = Path('lichess-position-training.mjs').read_text(encoding='utf-8')
          checks = {
              'new cache key': 'visual-redesign3' in module,
              'flush board padding': '.position-training-board-wrap' in css and 'padding: 0;' in css,
              'square board corners': '.position-training-board {' in css and 'border-radius: 0;' in css,
              'no decorative board frame': 'background: transparent;' in css and 'box-shadow: none;' in css,
              'wider desktop sidebar': 'minmax(340px, 380px)' in css,
              'objective hierarchy': '.position-training-card:first-child' in css and 'border-left: 4px solid' in css,
              'learning before filters': '.position-training-card:nth-child(4) { order: 2; }' in css,
              'clear primary action': "button[data-pt-action='next']" in css and 'margin-left: auto;' in css,
              'short-screen compaction': '(max-height: 850px)' in css,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {name}")
          if failed:
              raise SystemExit('Visual redesign checks failed: ' + ', '.join(failed))
          PY
          git diff --check

      - name: Record proof and commit
        run: |
          cat > proof/lichess-trainer-visual-redesign.md <<'EOF'
          # Lichess Trainer Visual Redesign

          - Removed board-shell padding, margins, rounded corners, gradient frame, and decorative shell shadow.
          - Preserved the exact viewport-fit grid from the previous desktop correction.
          - Widened the desktop sidebar and flattened secondary cards.
          - Strengthened the side-to-move and objective hierarchy.
          - Moved learning progress above filters.
          - Gave the action row a clear divider and right-aligned primary next action.
          - Added compact spacing for desktop screens 850px high or shorter.
          - Changed the stylesheet cache key so the redesign cannot be masked by the previous cached CSS.
          EOF
          git rm .github/workflows/finalize-lichess-trainer-visual-redesign.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Lichess trainer visual redesign"
          git push origin HEAD:agent/lichess-trainer-visual-redesign
