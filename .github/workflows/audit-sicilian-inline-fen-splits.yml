name: Finish Sicilian PDF line layout fix

on:
  push:
    branches:
      - fix/sicilian-pdf-line-layout
    paths:
      - '.github/workflows/audit-sicilian-inline-fen-splits.yml'

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sicilian-pdf-line-layout
      - name: Update stale line-break assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/opening-book-sicilian/tests/chapter-workflow.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = r'  assert.match(markdown, /13\.Bf3 Qd7! 14\.Qd3 Nc6!\s*<!--[\s\S]*?-->\s*15\.Bxe4/);'
          new = r'  assert.match(markdown, /13\.Bf3 Qd7! 14\.Qd3 Nc6! 15\.Bxe4/);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not find either old or corrected Page 21 assertion')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Test Sicilian opening book
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test
      - name: Commit updated assertion
        run: |
          git diff --check
          git add apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Sicilian PDF line-layout regression test"
          git push origin HEAD:fix/sicilian-pdf-line-layout
