name: Consolidate Sicilian Markdown

on:
  push:
    branches:
      - cleanup/sicilian-canonical-markdown-20260806
    paths:
      - .github/sicilian-cleanup-payload.tar.gz.b64
      - .github/workflows/consolidate-sicilian-markdown.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/sicilian-canonical-markdown-20260806
          fetch-depth: 0

      - name: Install canonical Markdown and remove patch stack
        shell: bash
        run: |
          base64 --decode .github/sicilian-cleanup-payload.tar.gz.b64 > /tmp/sicilian-cleanup.tar.gz
          tar -xzf /tmp/sicilian-cleanup.tar.gz -C .

          rm -f \
            apps/opening-book-sicilian/app/lib/chapter-content-corrections.ts \
            apps/opening-book-sicilian/app/lib/chapter-page15-corrections.ts \
            apps/opening-book-sicilian/app/lib/chapter-page16-corrections.ts \
            apps/opening-book-sicilian/app/lib/chapter-page17-corrections.ts \
            apps/opening-book-sicilian/tests/page16-content.test.mjs \
            apps/opening-book-sicilian/tests/page17-content.test.mjs \
            .github/sicilian-cleanup-payload.tar.gz.b64 \
            .github/workflows/consolidate-sicilian-markdown.yml

      - name: Commit consolidated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use canonical Sicilian Chapter 1 Markdown"
          git push origin HEAD:cleanup/sicilian-canonical-markdown-20260806
