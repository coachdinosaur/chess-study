name: Fix Bishop level icons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-bishop-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace header icons on Bishop pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'(<div\s+class=["\']index-brand-icon["\'][^>]*>).*?(</div>)',
              re.DOTALL,
          )
          changed = []

          for path in sorted(Path("lessons").glob("bishop*.html")):
              original = path.read_text(encoding="utf-8")
              updated, matches = pattern.subn(r"\1♝\2", original, count=1)
              if matches and updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          workflow = Path(".github/workflows/fix-bishop-icons.yml")
          if workflow.exists():
              workflow.unlink()
              changed.append(str(workflow))

          print("Changed files:")
          for path in changed:
              print(f"- {path}")
          PY

      - name: Commit corrected icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/bishop*.html .github/workflows/fix-bishop-icons.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Bishop level icons"
          git push
