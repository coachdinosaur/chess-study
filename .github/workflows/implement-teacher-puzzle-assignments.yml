name: Implement teacher puzzle assignments

on:
  push:
    branches:
      - agent/teacher-puzzle-assignments
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/teacher-puzzle-assignments
          fetch-depth: 0

      - name: Apply feature payload and integration patches
        run: |
          mkdir -p proof/logs
          set +e
          python scripts/apply-teacher-puzzle-assignments.py > proof/logs/teacher-puzzle-bootstrap.txt 2>&1
          status=$?
          set -e
          cat proof/logs/teacher-puzzle-bootstrap.txt
          if [ "$status" -ne 0 ]; then
            git add proof/logs/teacher-puzzle-bootstrap.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Capture teacher assignment bootstrap failure"
            git push origin HEAD:agent/teacher-puzzle-assignments
            exit "$status"
          fi

      - name: Validate JavaScript syntax
        run: |
          node --check management/js/puzzle-assignment-core.mjs
          node --check management/js/puzzle-assignment-dashboard.mjs
          node --check management/js/puzzle-assignment-student.mjs
          node --check lichess-position-training.mjs
          node --check management/js/supabase-client.mjs

      - name: Run assignment and trainer tests
        run: |
          mkdir -p proof/logs
          node --test \
            tests/puzzle-assignment-core.test.mjs \
            tests/lichess-position-training-core.test.mjs \
            tests/lichess-position-training-learning.test.mjs \
            | tee proof/logs/teacher-puzzle-assignments-tests.txt

      - name: Run static integration checks
        run: |
          python - <<'PY' | tee proof/logs/teacher-puzzle-assignments-static.txt
          from pathlib import Path

          teacher = Path('management/teacher.html').read_text()
          assignment = Path('management/assignment.html').read_text()
          responsive = Path('lichess-position-training.css').read_text()
          migration = Path('supabase/migrations/010_teacher_puzzle_assignments.sql').read_text()
          dashboard = Path('management/js/puzzle-assignment-dashboard.mjs').read_text()
          student = Path('management/js/puzzle-assignment-student.mjs').read_text()

          checks = {
              'teacher stylesheet': 'puzzle-assignments.css?v=20260726-puzzle-assignments1' in teacher,
              'teacher module': 'puzzle-assignment-dashboard.mjs?v=20260726-puzzle-assignments1' in teacher,
              'student Supabase client': '@supabase/supabase-js@2' in assignment,
              'student runner': 'puzzle-assignment-student.mjs?v=20260726-puzzle-assignments1' in assignment,
              'desktop width-and-height sizing': 'Desktop board sizing aligned with the main chessboard.' in responsive and '100dvh' in responsive,
              'teacher auth gate': "requireProfile('teacher')" in dashboard,
              'fixed puzzle preview': 'Pre-review exact positions' in dashboard and 'Replace puzzle' in dashboard,
              'token-scoped student RPC': 'get_puzzle_assignment_by_token' in student and 'save_puzzle_assignment_attempt' in student,
              'migration RLS': all(name in migration for name in [
                  'alter table public.puzzle_assignments enable row level security',
                  'puzzle_assignments_teacher_select',
                  'puzzle_assignment_attempts_teacher_select',
              ]),
              'no service role key': 'service_role' not in dashboard.lower() and 'service_role' not in student.lower(),
          }

          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {name}")
          if failed:
              raise SystemExit('Static checks failed: ' + ', '.join(failed))
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit implementation
        run: |
          git rm scripts/teacher-puzzle-payload-1.txt scripts/teacher-puzzle-payload-2.txt scripts/teacher-puzzle-payload-3.txt
          git rm scripts/current-teacher-puzzle-payload-1.txt scripts/current-teacher-puzzle-payload-2.txt scripts/current-teacher-puzzle-payload-3.txt scripts/current-teacher-puzzle-payload-4.txt
          git rm scripts/apply-teacher-puzzle-assignments.py
          git rm .github/workflows/implement-teacher-puzzle-assignments.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement teacher puzzle assignments"
          git push origin HEAD:agent/teacher-puzzle-assignments
