name: Apply deep Sicilian Page 13 PDF sync

on:
  push:
    branches:
      - wip/sicilian-20260805-153931
    paths:
      - .github/workflows/apply-sicilian-page13-deep-sync.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sicilian-20260805-153931

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opening-book-sicilian/package-lock.json

      - name: Deep-sync printed PDF Page 13
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter = Path('apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md')
          text = chapter.read_text(encoding='utf-8')

          replacements = [
              (
                  "D) 2.Na3\n1.e4 c5 2.Na3\n\n**FEN:**",
                  "D) 2.Na3\n\n**FEN:**",
                  "remove repeated Page 13 opening sequence",
              ),
              (
                  "D1) 3.Bb5\n<!-- FEN: r1bqkbnr/pp1ppppp/2n5/2p5/4P3/N7/PPPP1PPP/R1BQKBNR w KQkq - 2 3 -->\n3.Bb5\n\nA move which has some purpose",
                  "D1) 3.Bb5\n<!-- FEN: r1bqkbnr/pp1ppppp/2n5/2p5/4P3/N7/PPPP1PPP/R1BQKBNR w KQkq - 2 3 -->\n\nA move which has some purpose",
                  "remove repeated D1 move",
              ),
              (
                  "Saule - Jemec, email 2006, continued with 4.Nf3, and here I would like to suggest a new idea: 4...Nge7!N 5.Nc4 (5.0-0 a6 6.Be2 d5 7.exd5 Nxd5 8.Re1 f6 9.Bf1 Be7 looks quite unimpressive for White) 5...d6 6.Ne3 a6 7.Be2 d5 8.d3 d4 9.Nc4 Ng6 10.a4 Be6 The position is simply excellent for Black.",
                  "Saule – Jemec, email 2006, continued with 4.Nf3, and here I would like to suggest a new idea: 4...Nge7!?N 5.Nc4 (5.0-0 a6 6.Be2 d5 7.exd5 Nxd5 8.Re1 f6 9.Bf1 Be7∓ looks quite unimpressive for White) 5...d6 6.Ne3 a6 7.Be2 d5 8.d3 d4 9.Nc4 Ng6 10.a4 Be6∓ The position is simply excellent for Black.",
                  "correct Saule-Jemec notation and evaluations",
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          chapter.write_text(text, encoding='utf-8')

          tests = Path('apps/opening-book-sicilian/tests/chapter-workflow.test.mjs')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'test("evaluation and positional glyphs remain attached to move buttons", () => {'
          regression = '''test("printed PDF Page 13 keeps its exact move content and boundary", async () => {\n  const markdown = await readChapterOne();\n  const start = markdown.indexOf("## Page 13");\n  const end = markdown.indexOf("## Page 14", start);\n  const page = markdown.slice(start, end);\n  const pageFourteen = markdown.slice(end, markdown.indexOf("## Page 15", end));\n\n  assert.match(page, /16\\.Rd5 \\(16\\.Rd2 Ne5=\\) 16\\.\\.\\.Qe6=/);\n  assert.match(page, /D\\) 2\\.Na3/);\n  assert.match(page, /D1\\) 3\\.Bb5[\\s\\S]*D2\\) 3\\.Nf3/);\n  assert.match(page, /3\\.\\.\\.e5!\\?/);\n  assert.match(page, /4\\.d3!N/);\n  assert.match(page, /Saule – Jemec, email 2006/);\n  assert.match(page, /4\\.\\.\\.Nge7!\\?N/);\n  assert.match(page, /9\\.Bf1 Be7∓/);\n  assert.match(page, /10\\.a4 Be6∓ The position is simply excellent for Black\\.\\s*$/);\n  assert.doesNotMatch(page, /1\\.e4 c5 2\\.Na3/);\n  assert.doesNotMatch(page, /D1\\) 3\\.Bb5[\\s\\S]*<!--[\\s\\S]*?-->\\s*3\\.Bb5/);\n  assert.doesNotMatch(page, /Saule - Jemec/);\n  assert.doesNotMatch(page, /4\\.\\.\\.Nge7!N/);\n  assert.doesNotMatch(page, /9\\.Bf1 Be7 looks/);\n  assert.doesNotMatch(page, /10\\.a4 Be6 The/);\n  assert.doesNotMatch(page, /4\\.Bxc6 dxc6/);\n  assert.match(pageFourteen, /^## Page 14\\s+<!--[\\s\\S]*?-->\\s*4\\.Bxc6 dxc6/);\n});\n\n'''
          if regression.strip() not in test_text:
              if marker not in test_text:
                  raise SystemExit('Could not find Page 13 regression insertion point')
              test_text = test_text.replace(marker, regression + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

          git diff --check

      - name: Install and test Sicilian app
        working-directory: apps/opening-book-sicilian
        run: |
          npm ci
          npm test

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "coachdinosaur"
          git config user.email "86093996+coachdinosaur@users.noreply.github.com"
          git rm .github/workflows/apply-sicilian-page13-deep-sync.yml
          git add apps/opening-book-sicilian/app/content/chapters/chapter-1-sicilian.md \
                  apps/opening-book-sicilian/tests/chapter-workflow.test.mjs
          git diff --cached --check
          git commit -m "Deep-sync Sicilian Page 13 with PDF"
          git push origin HEAD:wip/sicilian-20260805-153931
