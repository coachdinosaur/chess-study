name: Show Lichess puzzle total

on:
  push:
    branches:
      - agent/show-lichess-puzzle-total
    paths:
      - '.github/workflows/show-lichess-puzzle-total.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/show-lichess-puzzle-total
          fetch-depth: 0

      - name: Add manifest-backed puzzle count
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          module_path = Path('lichess-position-training.mjs')
          module = module_path.read_text(encoding='utf-8')
          module = replace_once(
              module,
              "const STYLE_URL = './lichess-position-training-desktop-fit.css?v=20260726-visual-redesign3';",
              "const STYLE_URL = './lichess-position-training-desktop-fit.css?v=20260726-library-count1';",
              'stylesheet cache key',
          )
          module = replace_once(
              module,
              "const HISTORY_MAX = 200;\n",
              "const HISTORY_MAX = 200;\nconst PUZZLE_COUNT_FORMATTER = new Intl.NumberFormat('en-US');\n",
              'count formatter',
          )
          module = replace_once(
              module,
              "    this.busy = false;\n    this.completed = false;",
              "    this.busy = false;\n    this.libraryCount = null;\n    this.libraryCountStatus = 'loading';\n    this.libraryMetadataPromise = null;\n    this.completed = false;",
              'controller count state',
          )
          module = replace_once(
              module,
              "            <p>Play the position, preserve the objective, and face dynamic defence. No stored continuation is treated as the only correct line.</p>\n",
              "            <p>Play the position, preserve the objective, and face dynamic defence. No stored continuation is treated as the only correct line.</p>\n            <p class=\"position-training-library-count\" data-pt-library-count data-state=\"loading\" aria-live=\"polite\">Loading puzzle library…</p>\n",
              'dialog count display',
          )
          module = replace_once(
              module,
              "  async open() {\n    this.ensureOverlay();\n    this.overlay.hidden = false;",
              "  async open() {\n    this.ensureOverlay();\n    this.loadLibraryMetadata();\n    this.overlay.hidden = false;",
              'metadata load on open',
          )
          module = replace_once(
              module,
              "  close() {\n",
              "  async loadLibraryMetadata() {\n    if (this.libraryCountStatus === 'ready') {\n      this.#renderLibraryCount();\n      return this.libraryCount;\n    }\n    if (this.libraryMetadataPromise) return this.libraryMetadataPromise;\n\n    this.libraryCountStatus = 'loading';\n    this.#renderLibraryCount();\n    this.libraryMetadataPromise = this.dataSource.initialize()\n      .then((manifest) => {\n        const declaredCount = Number(manifest?.count);\n        const shardCount = Array.isArray(manifest?.shards)\n          ? manifest.shards.reduce((total, shard) => total + Math.max(0, Number(shard?.count) || 0), 0)\n          : 0;\n        this.libraryCount = Number.isFinite(declaredCount) && declaredCount > 0 ? declaredCount : shardCount;\n        this.libraryCountStatus = this.libraryCount > 0 ? 'ready' : 'unavailable';\n        return this.libraryCount;\n      })\n      .catch(() => {\n        this.libraryCount = null;\n        this.libraryCountStatus = 'unavailable';\n        return null;\n      })\n      .finally(() => {\n        this.libraryMetadataPromise = null;\n        this.#renderLibraryCount();\n      });\n    return this.libraryMetadataPromise;\n  }\n\n  close() {\n",
              'metadata loader method',
          )
          module = replace_once(
              module,
              "  render() {\n    if (!this.overlay) return;\n    this.#renderBoard();",
              "  #renderLibraryCount() {\n    let text = 'Loading puzzle library…';\n    if (this.libraryCountStatus === 'ready') {\n      text = `${PUZZLE_COUNT_FORMATTER.format(this.libraryCount)} Lichess puzzles available`;\n    } else if (this.libraryCountStatus === 'unavailable') {\n      text = 'Puzzle library count unavailable';\n    }\n    for (const element of document.querySelectorAll('[data-pt-library-count]')) {\n      element.textContent = text;\n      element.dataset.state = this.libraryCountStatus;\n      element.title = this.libraryCountStatus === 'ready'\n        ? 'Total validated Lichess positions installed in this app'\n        : text;\n    }\n  }\n\n  render() {\n    this.#renderLibraryCount();\n    if (!this.overlay) return;\n    this.#renderBoard();",
              'count renderer',
          )
          module = replace_once(
              module,
              "      <p>Train against dynamic defence with adaptive difficulty, progressive hints, mistake review, explanations, and theme performance tracking. The existing Endgame vs Stockfish trainer remains unchanged.</p>\n    </div>",
              "      <p>Train against dynamic defence with adaptive difficulty, progressive hints, mistake review, explanations, and theme performance tracking. The existing Endgame vs Stockfish trainer remains unchanged.</p>\n      <p class=\"position-training-library-count\" data-pt-library-count data-state=\"loading\" aria-live=\"polite\">Loading puzzle library…</p>\n    </div>",
              'launcher count display',
          )
          module = replace_once(
              module,
              "  panel.prepend(launcher);\n}",
              "  panel.prepend(launcher);\n  controller.loadLibraryMetadata();\n}",
              'launcher metadata load',
          )
          module_path.write_text(module, encoding='utf-8')

          css_path = Path('lichess-position-training-desktop-fit.css')
          css = css_path.read_text(encoding='utf-8')
          anchor = ".position-training-header h2 + p {\n  max-width: 78ch;\n  line-height: 1.35;\n}\n"
          addition = anchor + "\n.position-training-library-count {\n  display: inline-flex;\n  align-items: center;\n  gap: 0.4rem;\n  width: fit-content;\n  margin-top: 0.55rem !important;\n  padding: 0.3rem 0.55rem;\n  border: 1px solid color-mix(in srgb, var(--focus-border) 34%, var(--section-divider-soft));\n  border-radius: 6px;\n  background: color-mix(in srgb, var(--accent-soft) 72%, var(--card-bg) 28%);\n  color: var(--accent-strong);\n  font-size: 0.78rem;\n  font-weight: 760;\n  line-height: 1.2;\n}\n\n.position-training-library-count::before {\n  content: '';\n  width: 0.45rem;\n  height: 0.45rem;\n  flex: 0 0 auto;\n  border-radius: 50%;\n  background: currentColor;\n}\n\n.position-training-library-count[data-state='unavailable'] {\n  border-color: var(--section-divider-soft);\n  background: var(--panel-strong);\n  color: var(--text-muted);\n}\n"
          css = replace_once(css, anchor, addition, 'count badge styles')
          css_path.write_text(css, encoding='utf-8')

          wrapper_path = Path('focus-analysis-popup.mjs')
          wrapper = wrapper_path.read_text(encoding='utf-8')
          wrapper = replace_once(
              wrapper,
              "import './lichess-position-training.mjs?v=20260726-learning1';",
              "import './lichess-position-training.mjs?v=20260726-library-count1';",
              'module cache key',
          )
          wrapper_path.write_text(wrapper, encoding='utf-8')
          PY

      - name: Validate feature
        run: |
          node --check lichess-position-training.mjs
          node --check focus-analysis-popup.mjs
          mapfile -t position_tests < <(find tests -maxdepth 1 -type f -name '*lichess-position-training*.test.mjs' -print | sort)
          test "${#position_tests[@]}" -gt 0
          node --test "${position_tests[@]}" tests/puzzle-assignment-core.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('assets/puzzles/lichess-position-training/manifest.json', 'utf8'));
          const module = fs.readFileSync('lichess-position-training.mjs', 'utf8');
          const css = fs.readFileSync('lichess-position-training-desktop-fit.css', 'utf8');
          if (manifest.count !== 2000 || manifest.shards.length !== 80) throw new Error('Expected the merged 2,000-puzzle dataset.');
          if (new Intl.NumberFormat('en-US').format(manifest.count) !== '2,000') throw new Error('Puzzle count formatting failed.');
          if ((module.match(/data-pt-library-count/g) || []).length < 3) throw new Error('Puzzle count display or renderer is missing.');
          if (!module.includes('manifest?.count') || !module.includes('shard?.count')) throw new Error('Manifest count and shard fallback are not wired.');
          if (!css.includes('.position-training-library-count')) throw new Error('Puzzle count styling is missing.');
          console.log('Lichess puzzle total display validation: PASS');
          NODE
          git diff --check

      - name: Commit product changes and remove temporary workflow
        run: |
          rm .github/workflows/show-lichess-puzzle-total.yml
          git add lichess-position-training.mjs lichess-position-training-desktop-fit.css focus-analysis-popup.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Show total Lichess puzzle count'
          git push origin HEAD:agent/show-lichess-puzzle-total
