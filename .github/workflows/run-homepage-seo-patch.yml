name: Run homepage SEO patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/homepage-seo-branding'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/homepage-seo-branding
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_homepage_seo.py

      - name: Remove temporary runners and commit
        shell: bash
        run: |
          rm -f tools/apply_homepage_seo.py
          rm -f .github/workflows/apply-homepage-seo-branding.yml
          rm -f .github/workflows/run-homepage-seo-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve homepage branding and SEO"
          git push origin HEAD:agent/homepage-seo-branding
