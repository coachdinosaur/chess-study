<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Teacher Password | CD Digital Chess</title>
  <link rel="icon" type="image/png" href="../assets/pieces/app_icon.png">
  <link rel="stylesheet" href="./management.css?v=20260723-hardening1">
  <link rel="stylesheet" href="./hardening.css?v=20260723-hardening1">
</head>
<body>
  <div class="portal-shell">
    <header class="portal-header">
      <a class="portal-brand" href="./login.html">
        <span class="portal-brand-mark" aria-hidden="true">♟</span>
        <span class="portal-brand-copy"><strong>Password recovery</strong><span>CD Digital Chess</span></span>
      </a>
      <nav class="portal-actions"><a class="button-secondary" href="./login.html">Back to sign in</a></nav>
    </header>

    <main class="stack approval-card">
      <div id="resetPasswordStatus" class="status" aria-live="polite">Checking recovery link…</div>
      <section class="panel">
        <h1>Choose a new password</h1>
        <form id="resetPasswordForm" class="form-grid">
          <div class="form-row">
            <label for="newPassword">New password</label>
            <div class="password-input">
              <input id="newPassword" name="password" type="password" minlength="8" autocomplete="new-password" required>
              <button class="password-toggle" type="button" data-password-toggle="newPassword" data-password-label="new password" aria-controls="newPassword" aria-pressed="false">Show</button>
            </div>
          </div>
          <div class="form-row">
            <label for="confirmPassword">Confirm new password</label>
            <div class="password-input">
              <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
              <button class="password-toggle" type="button" data-password-toggle="confirmPassword" data-password-label="password confirmation" aria-controls="confirmPassword" aria-pressed="false">Show</button>
            </div>
          </div>
          <button class="button" type="submit">Update password</button>
        </form>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/password-toggle.mjs?v=20260723-hardening1"></script>
  <script type="module" src="./js/reset-password.mjs?v=20260723-hardening1"></script>
</body>
</html>
