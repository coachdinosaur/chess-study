<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Dashboard | CD Digital Chess</title>
  <link rel="icon" type="image/png" href="../assets/pieces/app_icon.png">
  <link rel="stylesheet" href="./management.css">
</head>
<body>
  <div class="portal-shell">
    <header class="portal-header">
      <a class="portal-brand" href="./index.html">
        <span class="portal-brand-mark" aria-hidden="true">♟</span>
        <span class="portal-brand-copy"><strong>Student dashboard</strong><span id="profileName">Loading account…</span></span>
      </a>
      <nav class="portal-actions">
        <a class="button-secondary" href="./join.html">Join another class</a>
        <a class="button-secondary" href="../lessons/index.html">Public lessons</a>
        <button id="signOutButton" class="button-danger" type="button">Sign out</button>
      </nav>
    </header>

    <main class="stack">
      <div id="studentStatus" class="status" aria-live="polite" hidden></div>

      <section class="panel">
        <div class="section-head"><h1>Your classes</h1></div>
        <div id="membershipList" class="list"><div class="empty">Loading classes…</div></div>
      </section>

      <section class="panel">
        <div class="section-head"><h2>Assignments</h2></div>
        <div id="assignmentList" class="list"><div class="empty">Loading assignments…</div></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/student-dashboard.mjs"></script>
</body>
</html>
