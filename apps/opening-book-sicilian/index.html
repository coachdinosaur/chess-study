<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A static, interactive Sicilian opening book with navigable variations and local Stockfish analysis."
    />
    <link rel="canonical" href="https://cddigital.top/openings-sicilian/" />
    <link rel="icon" type="image/png" href="/app_icon_chess_study.png" />
    <title>Sicilian Defense: Beating the Anti-Sicilian</title>
  <style>
    body {
      margin: 0;
      background-color: #071012;
      color: #f7faf5;
    }
    .app-loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: #071012;
      color: #f7faf5;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      box-sizing: border-box;
      padding: 1.5rem;
    }
    .app-loading-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #e11d48;
      border-radius: 50%;
      animation: app-spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes app-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (const r of regs) r.unregister();
      }).catch(function () {});
    }
  </script>
</head>
<body>
  <div id="root">
    <div class="app-loading-screen">
      <div class="app-loading-spinner"></div>
      <div style="font-size:1.1rem;font-weight:600;margin-bottom:0.35rem;">Loading Sicilian Defense…</div>
      <div style="font-size:0.85rem;color:#8ba39a;">Preparing repertoire &amp; analysis</div>
    </div>
  </div>
  <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
