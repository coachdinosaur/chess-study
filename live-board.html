<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Board | CD Digital Chess</title>
  <meta name="description" content="A simple interactive chess board for live teaching sessions.">
  <link rel="icon" type="image/png" href="./assets/pieces/app_icon.png">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('color-theme-v1');
        document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="./live-board.css?v=20260722-live-board1">
</head>
<body>
  <main class="live-board-shell">
    <header class="live-board-header">
      <div>
        <p class="eyebrow">CD Digital Chess</p>
        <h1>Live Board</h1>
        <p class="subtitle">A clean board for teacher and student demonstrations.</p>
      </div>
      <a class="secondary-button" href="./">Back to main app</a>
    </header>

    <section class="live-board-layout" aria-label="Live chess board">
      <article class="board-card">
        <div class="board-card-head">
          <div>
            <p class="eyebrow">Interactive board</p>
            <h2 id="statusTitle">White to move</h2>
          </div>
          <span id="statusPill" class="status-pill">Ready</span>
        </div>

        <div class="board-frame">
          <div id="liveBoard" class="chess-board" role="grid" aria-label="Chess board"></div>
        </div>

        <div class="board-toolbar" aria-label="Board controls">
          <button id="undoButton" type="button">Undo</button>
          <button id="resetButton" type="button">Reset</button>
          <button id="flipButton" type="button">Flip board</button>
          <button id="themeButton" type="button">Theme</button>
        </div>
      </article>

      <aside class="side-card">
        <section>
          <p class="eyebrow">Position</p>
          <label for="fenInput">FEN</label>
          <textarea id="fenInput" rows="4" spellcheck="false"></textarea>
          <div class="side-actions">
            <button id="loadFenButton" type="button">Load FEN</button>
            <button id="copyFenButton" class="secondary-button" type="button">Copy FEN</button>
          </div>
          <p id="fenMessage" class="message" aria-live="polite"></p>
        </section>

        <section>
          <p class="eyebrow">Moves</p>
          <ol id="moveList" class="move-list"></ol>
        </section>
      </aside>
    </section>
  </main>

  <script type="module" src="./live-board.js?v=20260722-live-board1"></script>
</body>
</html>
